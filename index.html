th": "audio/voice/56f1db36a62a3478.mp3", "duration": 2.529252 }, "better": { "path": "audio/voice/d7d5dcc369426e2e.mp3", "duration": 1.509433 }, "certainly": { "path": "audio/voice/00fd2615de994cb3.mp3", "duration": 1.734286 }, "get up": { "path": "audio/voice/4553dee862f05c9f.mp3", "duration": 1.554376 }, "yet": { "path": "audio/voice/cfd96dd92f7e0025.mp3", "duration": 1.514422 }, "rich": { "path": "audio/voice/7baa68f2418ba82d.mp3", "duration": 1.589433 }, "food": { "path": "audio/voice/c1f026582fe6e8cb.mp3", "duration": 1.579456 }, "play": { "path": "audio/voice/aba4cc9b8af82df5.mp3", "duration": 1.474422 }, "match": { "path": "audio/voice/4945a70fa7f9c13f.mp3", "duration": 1.589433 }, "talk": { "path": "audio/voice/ce7611e7481e75f0.mp3", "duration": 1.51941 }, "How's Jimmy today?": { "path": "audio/voice/8b299eea2545dbfe.mp3", "duration": 2.124308 }, "Better. Thank you, doctor.": { "path": "audio/voice/f3e210cec818f1cd.mp3", "duration": 3.789887 }, "Can I see him please, Mrs. Williams?": { "path": "audio/voice/1c99067e05e394ed.mp3", "duration": 3.714014 }, "Certainly, doctor. Come upstairs.": { "path": "audio/voice/a62828c1dc774044.mp3", "duration": 4.418957 }, "You look very well, Jimmy. You look better now, but you mustn't get up yet. You must stay in bed for another two days.": { "path": "audio/voice/6f1a821e7812985c.mp3", "duration": 9.678141 }, "The boy mustn't go to school yet, Mrs. Williams. And he mustn't eat rich food.": { "path": "audio/voice/f8705e5ed00505f5.mp3", "duration": 6.553741 }, "Has he a temperature, doctor?": { "path": "audio/voice/02ce2ab0693436eb.mp3", "duration": 3.059138 }, "No, he hasn't.": { "path": "audio/voice/81731f9a43010da4.mp3", "duration": 2.384308 }, "Must he stay in bed?": { "path": "audio/voice/911cfe7374f9587a.mp3", "duration": 2.274785 }, "Yes. He must remain in bed for another two days. He can get up for about two hours each day, but you must keep the room warm.": { "path": "audio/voice/5b966bf825b17efd.mp3", "duration": . She's not a baby. Give her the key. She always comes home early.": { "path": "audio/voice/f94bd5c83fa666de.mp3", "duration": 9.17356 }, "Oh, all right!": { "path": "audio/voice/953ede7dd99e1d4f.mp3", "duration": 2.284354 }, "Here you are. But you mustn't come home after a quarter past eleven. Do you hear?": { "path": "audio/voice/562619b1e456a101.mp3", "duration": 7.023628 }, "Yes, Dad. Thanks, Mum.": { "path": "audio/voice/0efe1d4bdc6621cc.mp3", "duration": 4.36458 }, "That's all right. Goodbye. Enjoy yourself!": { "path": "audio/voice/f868156033c3c5fa.mp3", "duration": 5.213968 }, "We always enjoy ourselves, Mum. Bye-bye.": { "path": "audio/voice/334cfc85419cd000.mp3", "duration": 4.739048 }, "Can I have the key to the front door, Dad?": { "path": "audio/voice/ec156b3cc997a368.mp3", "duration": 3.624036 }, "You mustn't come home late.": { "path": "audio/voice/785d804e088e2c55.mp3", "duration": 2.504082 }, "Enjoy yourself!": { "path": "audio/voice/ecc48a090b467602.mp3", "duration": 2.149252 }, "We always enjoy ourselves.": { "path": "audio/voice/0a06bf4510b639aa.mp3", "duration": 2.709161 }, "You must be home at half past ten.": { "path": "audio/voice/a057d73f063155a8.mp3", "duration": 3.049116 }, "The weekend": { "path": "audio/voice/d32e0a9e43f6acae.mp3", "duration": 1.754331 }, "absent": { "path": "audio/voice/5ad38304b535c298.mp3", "duration": 1.769342 }, "Monday": { "path": "audio/voice/6a00dfc1dc867e84.mp3", "duration": 1.554376 }, "Tuesday": { "path": "audio/voice/7d8af1de1262f150.mp3", "duration": 1.614422 }, "Wednesday": { "path": "audio/voice/c0a6cc829cd08735.mp3", "duration": 1.63932 }, "Friday": { "path": "audio/voice/e21f3f372a46d4be.mp3", "duration": 1.629433 }, "Saturday": { "path": "audio/voice/dbe35c7363c2f7ec.mp3", "duration": 1.654286 }, "Sunday": { "path": "audio/voice/873fef760e5d001b.mp3", "duration": 1.61941 }, "weekend": { "path": "audio/voice/1197a20df1b4c87b.mp3", "duration": 1.73941 }, "keep": { "path": "audio/voice/6ca7ea2feefc88ec.mp3", "duration": 1.51941 }, "spend": { "path": "audio/voice/f64a33ff88c38111.mp3", "duration": 1.774376 }, "Hello. Were you at the butcher's?": { "path": "audio/voice/8550b0359cfa3472.mp3", "duration": 3.464127 }, "Yes, I was. Were you at the butcher's, too?": { "path": "audio/voice/d9646da40cfdd72b.mp3", "duration": 5.083991 }, "No, I wasn't. I was at the greengrocer's. How's Jimmy today?": { "path": "audio/voice/9a40d79bfddb21e6.mp3", "duration": 6.588662 }, "He's very well, thank you.": { "path": "audio/voice/01f7c1bf9b519dd8.mp3", "duration": 3.006213 }, "Was he absent from school last week?": { "path": "audio/voice/2af26e4671181fb1.mp3", "duration": 3.204082 }, "Yes, he was. He was absent on Monday, Tuesday, Wednesday and Thursday. How are you all keeping?": { "path": "audio/voice/3fd9ec45867a0408.mp3", "duration": 8.868571 }, "Very well, thank you. We're going to spend three days in the country. We're going to stay at my mother's for the weekend.": { "path": "audio/voice/a2ddfef597ecbd39.mp3", "duration": 8.983084 }, "Friday, Saturday and Sunday in the country! Aren't you lucky!": { "path": "audio/voice/dae9b274cce3a1d6.mp3", "duration": 5.4039 }, "Were you at the butcher's last Monday?": { "path": "audio/voice/997526704134d9e2.mp3", "duration": 2.864082 }, "He was absent on Monday.": { "path": "audio/voice/fd361511ae3c8472.mp3", "duration": 2.464082 }, "How are you all keeping?": { "path": "audio/voice/3023b249f94732e1.mp3", "duration": 2.329252 }, "Were you at the butcher's?": { "path": "audio/voice/13b59deea18d2ada.mp3", "duration": 2.214195 }, "We're going to stay at my mother's for the weekend.": { "path": "audio/voice/63b2977f7d777ba3.mp3", "duration": 3.418866 }, "The car race": { "path": "audio/voice/bf68d3cfa0fd2cbc.mp3", "duration": 1.964354 }, "race": { "path": "audio/voice/129ce50dd90bf244.mp3", "duration": 1.589433 }, "town": { "path": "audio/voice/50ac81f970325a3e.mp3", "duration": 1.55941 }, "crowd": { "path": "audio/voice/5b4535bdd79ff9cd.mp3", "duration": 1.554422 }, "stand": { "path": "audio/voice/d37a24b801c6e2e3.mp3", "duration": 1.769388 }, "exciting": { "path": "audio/voice/5ae666e5b1a641b3.mp3", "duration": 1.759365 }, "handsome": { "path": "audio/voice/4623f30b926198d4.mp3", "duration": 1.799365 }, "finish": { "path": "audio/voice/42af43e3616eba4a.mp3", "duration": 1.73941 }, "winner": { "path": "audio/voice/4221a0fc3dfbfd83.mp3", "duration": 1.49941 }, "hundred": { "path": "audio/voice/97fe8a3749069931.mp3", "duration": 1.694422 }, "year": { "path": "audio/voice/4cb4ea25583c2564.mp3", "duration": 1.454422 }, "There is a car race near our town every year.": { "path": "audio/voice/eefd72fd48c11b2f.mp3", "duration": 3.374059 }, "In 1995, there was a very big race.": { "path": "audio/voice/3e3701db4db35232.mp3", "duration": 4.36458 }, "There were hundreds of people there.": { "path": "audio/voice/68288d7016c0a91d.mp3", "duration": 2.779002 }, "My wife and I were at the race. Our friends Julie and Jack were there, too.": { "path": "audio/voice/4d6111c48b98bd48.mp3", "duration": 6.22381 }, "You can see us in the crowd. We are standing on the left.": { "path": "audio/voice/e41ba55c8978d664.mp3", "duration": 4.803719 }, "There were twenty cars in the race. There were English cars, French cars, German cars, Italian cars, American cars and Japanese cars.": { "path": "audio/voice/cb3a86339b3e53d3.mp3", "duration": 10.227619 }, "It was an exciting finish. The winner was Billy Stewart.": { "path": "audio/voice/07f06dcad1d3f352.mp3", "duration": 4.713696 }, "He was in car number fifteen. Five other cars were just behind him.": { "path": "audio/voice/b98b11cb501e6fc6.mp3", "duration": 5.673605 }, "On the way home, my wife said to me, “Don't drive so quickly! You're not Billy Stewart!”": { "path": "audio/voice/eaa57af16f203965.mp3", "duration": 7.223537 }, "The winner was Billy Stewart.": { "path": "audio/voice/d640b59d213cad42.mp3", "duration": 2.479138 }, "There was a very big race in 1995.": { "path": "audio/voice/14dd80ec9eebd641.mp3", "duration": 3.753968 }, "There were twenty cars in the race.": { "path": "audio/voice/e7014ae3dc9271ef.mp3", "duration": 2.824082 }, "He's awful!": { "path": "audio/voice/aac6700fce9aef9b.mp3", "duration": 1.80458 }, "awful": { "path": "audio/voice/87e1315329cf22c9.mp3", "duration": 1.59941 }, "time": { "path": "audio/voice/336074805fc85398.mp3", "duration": 1.549433 }, "answer": { "path": "audio/voice/0db52f4076c08251.mp3", "duration": 1.624399 }, "last": { "path": "audio/voice/3547cb112ac4489a.mp3", "duration": 1.684399 }, "phone": { "path": "audio/voice/45569da57f4b7bf4.mp3", "duration": 1.664444 }, "again": { "path": "audio/voice/b4c9e14061c2fd45.mp3", "duration": 1.609433 }, "say": { "path": "audio/voice/a0b967fc60136d2e.mp3", "duration": 1.439456 }, "yesterday": { "path": "audio/voice/9523d9fbe79bcf3e.mp3", "duration": 1.659365 }, "What's Ron Marston like, Pauline?": { "path": "audio/voice/05d54c2029a9ffcd.mp3", "duration": 3.304172 }, "He telephoned me four times yesterday, and three times the day before yesterday.": { "path": "audio/voice/f9cc6f947bbb3cc7.mp3", "duration": 5.558594 }, "He telephoned the office yesterday morning and yesterday afternoon.": { "path": "audio/voice/935cb5ffd74e1580.mp3", "duration": 4.543583 }, "My boss answered the telephone.": { "path": "audio/voice/e310198fa5c2c206.mp3", "duration": 2.809116 }, "What did your boss say to him?": { "path": "audio/voice/0f2a306341ef7d09.mp3", "duration": 2.634059 }, "He said, 'Pauline is typing letters. She can't speak to you now!'": { "path": "audio/voice/20eb00ae9cfdc5ee.mp3", "duration": 5.673787 }, "Then I arrived home at six o'clock yesterday evening.": { "path": "audio/voice/1b82dcf79436f315.mp3", "duration": 3.978912 }, "He telephoned again.": { "path": "audio/voice/70ef2928366f25b3.mp3", "duration": 2.204218 }, "But I didn't answer the phone!": { "path": "audio/voice/93ab7d5196665416.mp3", "duration": 2.539184 }, "Did he telephone again last night?": { "path": "audio/voice/cb60552e2a1426b8.mp3", "duration": 2.999048 }, "Yes, he did.": { "path": "audio/voice/bf26cc9ae802f324.mp3", "duration": 2.394331 }, "He telephoned at nine o'clock.": { "path": "audio/voice/e3fb7dc8f96df796.mp3", "duration": 2.704082 }, "What did you say to him?": { "path": "audio/voice/ac49d72817aa80d6.mp3", "duration": 2.31415 }, "I said, 'This is Pauline's mother. Please don't telephone my daughter again!'": { "path": "audio/voice/6bd6c27167a9ec59.mp3", "duration": 6.203764 }, "Did he telephone again?": { "path": "audio/voice/7f266e02427522a4.mp3", "duration": 2.389206 }, "No, he didn't!": { "path": "audio/voice/4de784a8f2b8b26b.mp3", "duration": 2.354286 }, "He telephoned me four times yesterday.": { "path": "audio/voice/808f88e7a9851983.mp3", "duration": 3.179002 }, "The way to King Street": { "path": "audio/voice/4c46cbc90596e482.mp3", "duration": 2.304263 }, "week": { "path": "audio/voice/6df37daaa46ce714.mp3", "duration": 1.524399 }, "London": { "path": "audio/voice/ecc0e7dc084f141b.mp3", "duration": 1.726213 }, "suddenly": { "path": "audio/voice/18204974997e94d4.mp3", "duration": 1.709342 }, "smile": { "path": "audio/voice/fa1eadc4c6995667.mp3", "duration": 1.749433 }, "pleasantly": { "path": "audio/voice/08d274500a357e6c.mp3", "duration": 1.726213 }, "understand": { "path": "audio/voice/f9dc689e6d50ad6f.mp3", "duration": 1.939274 }, "speak": { "path": "audio/voice/21e5205f73d9edbf.mp3", "duration": 1.71941 }, "pocket": { "path": "audio/voice/62f5d588fd39c2bb.mp3", "duration": 1.65941 }, "phrasebook": { "path": "audio/voice/72053c2b4d5cbef2.mp3", "duration": 1.864354 }, "slowly": { "path": "audio/voice/793080bb3a187fca.mp3", "duration": 1.63941 }, "Last week Mrs. Mills went to London. She does not know London very well, and she lost her way.": { "path": "audio/voice/458864fc3751c9ee.mp3", "duration": 7.443311 }, "Suddenly, she saw a man near a bus stop. “I can ask him the way,” she said to herself.": { "path": "audio/voice/b52d9f1cfc365bfa.mp3", "duration": 7.473333 }, "“Excuse me,” she said. “Can you tell me the way to King Street, please?”": { "path": "audio/voice/0150420e7a9d70fe.mp3", "duration": 6.584989 }, "The man smiled pleasantly. He did not understand English! He spoke German. He was a tourist.": { "path": "audio/voice/e5d9af7e0285f33f.mp3", "duration": 8.818231 }, "Then he put his hand into his pocket, and took out a phrasebook.": { "path": "audio/voice/c1404eb021fdabeb.mp3", "duration": 4.64381 }, "He opened the book and found a phrase. He read the phrase slowly.": { "path": "audio/voice/f06fe70b788a7b15.mp3", "duration": 5.113696 }, "“I am sorry,” he said. “I do not speak English.”": { "path": "audio/voice/bc540da34b52382d.mp3", "duration": 5.0639 }, "Last week Mrs. Mills went to London.": { "path": "audio/voice/9ea7ed7a998a781c.mp3", "duration": 3.163946 }, "She lost her way.": { "path": "audio/voice/0379a98f02f3aab2.mp3", "duration": 2.109252 }, "Can you tell me the way to King Street, please?": { "path": "audio/voice/00d090fe292ee1d5.mp3", "duration": 3.93415 }, "Uncomfortable shoes": { "path": "audio/voice/b5262f93c616b165.mp3", "duration": 2.389252 }, "ago": { "path": "audio/voice/1d8e08fd63268284.mp3", "duration": 1.444444 }, "shoes": { "path": "audio/voice/01ea5ddd3be5477a.mp3", "duration": 1.700091 }, "fashion": { "path": "audio/voice/309d267f086d5fe5.mp3", "duration": 1.85941 }, "uncomfortable": { "path": "audio/voice/7b617aac7d2b7df9.mp3", "duration": 1.964308 }, "wear": { "path": "audio/voice/c47fbc5d87a12981.mp3", "duration": 1.509388 }, "buy": { "path": "audio/voice/e8197b20f8e71e42.mp3", "duration": 1.384444 }, "pair": { "path": "audio/voice/47d8bd46877831cc.mp3", "duration": 1.504399 }, "then": { "path": "audio/voice/21af6f1260f927f5.mp3", "duration": 1.514422 }, "Do you have any shoes like these?": { "path": "audio/voice/acd7a0b1ee42c240.mp3", "duration": 2.934104 }, "What size?": { "path": "audio/voice/25b767af317489d7.mp3", "duration": 1.809342 }, "Size five.": { "path": "audio/voice/03e87b89bc27deea.mp3", "duration": 1.894376 }, "What colour?": { "path": "audio/voice/4fbb5b3a927d1ba7.mp3", "duration": 1.704308 }, "Black.": { "path": "audio/voice/a329071218843803.mp3", "duration": 1.584399 }, "I'm sorry. We don't have any.": { "path": "audio/voice/d70a2c70064ccb9e.mp3", "duration": 3.534195 }, "But my sister bought this pair last month.": { "path": "audio/voice/38ebe66c9068c872.mp3", "duration": 3.363946 }, "Did she buy them here?": { "path": "audio/voice/2daca5e320728214.mp3", "duration": 2.214286 }, "No, she bought them in the U.S.": { "path": "audio/voice/b9c3da12551a4d7d.mp3", "duration": 3.189161 }, "We had some shoes like those a month ago, but we don't have any now.": { "path": "audio/voice/cd72f99025649e5c.mp3", "duration": 4.85873 }, "Can you get a pair for me, please?": { "path": "audio/voice/19edca8081c4cc3f.mp3", "duration": 3.319683 }, "I'm afraid that I can't. They were in fashion last year and the year before last. But they're not in fashion this year.": { "path": "audio/voice/9fc532035602b321.mp3", "duration": 8.48322 }, "These shoes are in fashion now.": { "path": "audio/voice/cea5df0ae6c2598f.mp3", "duration": 2.640499 }, "Do you like them?": { "path": "audio/voice/7dc52c7bbcd16c77.mp3", "duration": 1.989297 }, "Yes, they look very uncomfortable.": { "path": "audio/voice/bc944de8921fa564.mp3", "duration": 3.374059 }, "They are very uncomfortable. But women always wear uncomfortable shoes!": { "path": "audio/voice/b270f96ff416fe1e.mp3", "duration": 5.668526 }, "They were in fashion last year and the year before last.": { "path": "audio/voice/90e12f05b198317c.mp3", "duration": 3.903946 }, "Women always wear uncomfortable shoes!": { "path": "audio/voice/6f6f6c731d146a34.mp3", "duration": 3.228889 }, "We had some shoes like those a month ago.": { "path": "audio/voice/bfe0f961bc9a26aa.mp3", "duration": 3.215193 }, "They were in fashion last year.": { "path": "audio/voice/389071f814a8a45b.mp3", "duration": 2.704127 }, "But they're not in fashion this year.": { "path": "audio/voice/787cdb8179496589.mp3", "duration": 2.78907 }, "Terrible toothache": { "path": "audio/voice/a64af7b4543ecf3b.mp3", "duration": 2.11424 }, "appointment": { "path": "audio/voice/fd37f875ad2991f4.mp3", "duration": 1.909297 }, "urgent": { "path": "audio/voice/f9d37c23fcc0f03c.mp3", "duration": 1.674422 }, "till": { "path": "audio/voice/a64e98ff18a83009.mp3", "duration": 1.474422 }, "toothache": { "path": "audio/voice/7153a86186dd04c0.mp3", "duration": 1.769388 }, "dentist": { "path": "audio/voice/f62e610834f27439.mp3", "duration": 1.834422 }, "wait": { "path": "audio/voice/716ecabb45ac6a88.mp3", "duration": 1.509433 }, "afternoon": { "path": "audio/voice/c8e07c1ac268eae0.mp3", "duration": 1.859365 }, "I want to see the dentist, please.": { "path": "audio/voice/8d6cef15c74c9478.mp3", "duration": 3.384127 }, "Do you have an appointment?": { "path": "audio/voice/703d608793e89982.mp3", "duration": 2.39415 }, "No, I don't.": { "path": "audio/voice/675d13c2dc0bf946.mp3", "duration": 2.314376 }, "Is it urgent?": { "path": "audio/voice/25de0f98714e6448.mp3", "duration": 1.83932 }, "Yes, it is. It's very urgent. I have terrible toothache.": { "path": "audio/voice/b67398bb5afefc17.mp3", "duration": 6.42381 }, "Can you come at 10 a.m. on Monday, May 4th?": { "path": "audio/voice/5b0badbd0ab168fa.mp3", "duration": 4.039093 }, "I must see the dentist now, nurse.": { "path": "audio/voice/32802f90d25e1c28.mp3", "duration": 3.359048 }, "The dentist is very busy at the moment. Can you come at 2 p.m.?": { "path": "audio/voice/b275183441f70793.mp3", "duration": 5.393696 }, "That's very late. Can't the dentist see me now?": { "path": "audio/voice/012509cbcc9ee749.mp3", "duration": 4.323855 }, "I'm afraid that he can't, Mr. Croft. Can't you wait till this afternoon?": { "path": "audio/voice/85b2d0e03adc9f50.mp3", "duration": 6.183492 }, "I can wait, but my toothache can't!": { "path": "audio/voice/15b7fb38886987df.mp3", "duration": 3.334014 }, "Can't you wait till this afternoon?": { "path": "audio/voice/01d280529f1b97bb.mp3", "duration": 2.809025 }, "Carol's shopping list": { "path": "audio/voice/46ca1f4cfcb09ffa.mp3", "duration": 2.369206 }, "shopping": { "path": "audio/voice/1180412af43d7860.mp3", "duration": 1.794376 }, "list": { "path": "audio/voice/a330395cc0a53ad1.mp3", "duration": 1.684399 }, "vegetable": { "path": "audio/voice/4715b734085d8d9c.mp3", "duration": 1.726213 }, "need": { "path": "audio/voice/be8dff00b0d468b2.mp3", "duration": 1.464989 }, "hope": { "path": "audio/voice/c29277f55fb31aeb.mp3", "duration": 1.634422 }, "thing": { "path": "audio/voice/5de94d691ae3039a.mp3", "duration": 1.604444 }, "money": { "path": "audio/voice/8d2ac8b58ead9744.mp3", "duration": 1.491111 }, "beer": { "path": "audio/voice/1d8b4cf854cd42f4.mp3", "duration": 1.484399 }, "wine": { "path": "audio/voice/32c4feed996880bc.mp3", "duration": 1.554422 }, "grocer": { "path": "audio/voice/adfa2e566afb919d.mp3", "duration": 1.669433 }, "I'm making a shopping list, Tom.": { "path": "audio/voice/773aaa7e8c0540d3.mp3", "duration": 3.439138 }, "What do we need?": { "path": "audio/voice/a4edb83fcea61db1.mp3", "duration": 1.961315 }, "We need a lot of things this week.": { "path": "audio/voice/e3a7272c545704ff.mp3", "duration": 2.774059 }, "I must go to the grocer's. We haven't got much tea or coffee, and we haven't got any sugar or jam.": { "path": "audio/voice/ca70267255683c44.mp3", "duration": 7.713152 }, "What about vegetables?": { "path": "audio/voice/b53231ff1c47720a.mp3", "duration": 2.309206 }, "I must go to the greengrocer's. We haven't got many tomatoes, but we've got a lot of potatoes.": { "path": "audio/voice/2297a544ddb1e424.mp3", "duration": 7.378141 }, "I must go to the butcher's, too. We need some meat. We haven't got any meat at all.": { "path": "audio/voice/cf7452e7027dfac8.mp3", "duration": 7.26839 }, "Have we got any beer and wine?": { "path": "audio/voice/78bd4adbd6c6e245.mp3", "duration": 2.74907 }, "No, we haven't. And I'm not going to get any!": { "path": "audio/voice/2d231aa09247394b.mp3", "duration": 4.634104 }, "I hope that you've got some money.": { "path": "audio/voice/2de9bb3fc3341eaf.mp3", "duration": 2.68898 }, "I haven't got much.": { "path": "audio/voice/3a83b41ce966bd08.mp3", "duration": 2.209161 }, "Well, I haven't got much either!": { "path": "audio/voice/603c97d918e8c741.mp3", "duration": 3.199002 }, "I'm making a shopping list.": { "path": "audio/voice/72492061b78f90a1.mp3", "duration": 2.624127 }, "I hope you've got some money.": { "path": "audio/voice/1970415778aef2af.mp3", "duration": 2.509887 }, "We haven't got much tea or coffee.": { "path": "audio/voice/0985f5dec4a59294.mp3", "duration": 2.98898 }, "Roast beef and potatoes": { "path": "audio/voice/8d06d0f55ac96d6f.mp3", "duration": 2.599184 }, "bath": { "path": "audio/voice/0de8ab6315488d30.mp3", "duration": 1.584444 }, "nearly": { "path": "audio/voice/bf33e11fa2942227.mp3", "duration": 1.579365 }, "ready": { "path": "audio/voice/b24d6d33736ecd56.mp3", "duration": 1.474376 }, "dinner": { "path": "audio/voice/dda209044ad44962.mp3", "duration": 1.484399 }, "restaurant": { "path": "audio/voice/ee275d64dafcd283.mp3", "duration": 1.919365 }, "roast": { "path": "audio/voice/52b5cd277fbcd788.mp3", "duration": 1.689433 }, "breakfast": { "path": "audio/voice/7c58ea253628feed.mp3", "duration": 1.974376 }, "haircut": { "path": "audio/voice/8a9c59afb7e7cb40.mp3", "duration": 1.719365 }, "party": { "path": "audio/voice/1d0fea39ec33ff75.mp3", "duration": 1.57941 }, "Hi, Carol! Where's Tom?": { "path": "audio/voice/b86bdafc9b5494f3.mp3", "duration": 3.864263 }, "He's upstairs. He's having a bath.": { "path": "audio/voice/5b66cf8a1c6a4f59.mp3", "duration": 3.959048 }, "Tom!": { "path": "audio/voice/f71e8ea12aadebd5.mp3", "duration": 1.549433 }, "Sam's here.": { "path": "audio/voice/84377fa076ff0318.mp3", "duration": 1.869342 }, "I'm nearly ready.": { "path": "audio/voice/33cdf6940385d3ed.mp3", "duration": 1.964263 }, "Hello, Sam. Have a cigarette.": { "path": "audio/voice/0e46ec914cf04dd3.mp3", "duration": 4.184172 }, "No, thanks, Tom.": { "path": "audio/voice/f76b1d73b6bc31d3.mp3", "duration": 3.154286 }, "Have a glass of whisky then.": { "path": "audio/voice/6734dcc4dae1301f.mp3", "duration": 2.544218 }, "OK. Thanks.": { "path": "audio/voice/ade0f63092dcea87.mp3", "duration": 3.024399 }, "Is dinner ready, Carol?": { "path": "audio/voice/6b82152dabc8dd19.mp3", "duration": 2.804218 }, "It's nearly ready. We can have dinner at seven o'clock.": { "path": "audio/voice/36280270203293c8.mp3", "duration": 4.653787 }, "Sam and I had lunch together today. We went to a restaurant.": { "path": "audio/voice/4fd3d7e7a87ab1cc.mp3", "duration": 5.069887 }, "What did you have?": { "path": "audio/voice/36ddf94ba7036758.mp3", "duration": 2.054286 }, "We had roast beef and potatoes.": { "path": "audio/voice/772b730eea164911.mp3", "duration": 2.879093 }, "Oh!": { "path": "audio/voice/56723edcd935d476.mp3", "duration": 1.299456 }, "What's the matter, Carol?": { "path": "audio/voice/9f691b1bf9d9f2dd.mp3", "duration": 2.75424 }, "Well, you're going to have roast beef and potatoes again tonight!": { "path": "audio/voice/1164489a00141d37.mp3", "duration": 4.83873 }, "Where's Tom? He's having a bath.": { "path": "audio/voice/8e44014075173a37.mp3", "duration": 3.724127 }, "What did you have for lunch?": { "path": "audio/voice/dc9a095a7e736471.mp3", "duration": 2.444082 }, "Going on holiday": { "path": "audio/voice/8f358de5fc40b9a7.mp3", "duration": 2.089297 }, "mess": { "path": "audio/voice/7d64084076881eb2.mp3", "duration": 1.589433 }, "pack": { "path": "audio/voice/4862f447f2c7f272.mp3", "duration": 1.514422 }, "suitcase": { "path": "audio/voice/9817a64167e5ea6c.mp3", "duration": 1.854376 }, "leave": { "path": "audio/voice/af193190b8d3cd14.mp3", "duration": 1.589433 }, "already": { "path": "audio/voice/ea53396caebc40d7.mp3", "duration": 1.55941 }, "holiday": { "path": "audio/voice/81c16d337a1b7314.mp3", "duration": 1.619365 }, "Hello, Sam. Come in.": { "path": "audio/voice/6f9f6e4dc198b9c7.mp3", "duration": 3.769252 }, "Hi, Sam. We're having lunch. Do you want to have lunch with us?": { "path": "audio/voice/ffac3b8f065857a2.mp3", "duration": 6.67873 }, "No, thank you, Tom. I've already had lunch. I had lunch at half past twelve.": { "path": "audio/voice/e0f6a2778462b62a.mp3", "duration": 7.973515 }, "Have a cup of coffee then.": { "path": "audio/voice/5442e4274b91a39e.mp3", "duration": 2.519184 }, "I've just had a cup, thank you. I had one after my lunch.": { "path": "audio/voice/9b6b1a64f6c93b1a.mp3", "duration": 5.46381 }, "Let's go into the living room, Carol. We can have our coffee there.": { "path": "audio/voice/8f026232b4a89a69.mp3", "duration": 5.613696 }, "Excuse the mess, Sam. This room's very untidy. We're packing our suitcases. We're going to leave tomorrow. Tom and I are going to have a holiday.": { "path": "audio/voice/9215eafa9ffc8531.mp3", "duration": 12.777914 }, "Aren't you lucky!": { "path": "audio/voice/0c028051831c8c19.mp3", "duration": 1.889342 }, "When are you going to have a holiday, Sam?": { "path": "audio/voice/9b63699cd9527928.mp3", "duration": 3.659274 }, "I don't know. I've already had my holiday this year.": { "path": "audio/voice/53a20e393642aed0.mp3", "duration": 4.633787 }, "Where did you go?": { "path": "audio/voice/6607ce5473abcf8d.mp3", "duration": 1.91932 }, "I stayed at home!": { "path": "audio/voice/76a5ed96a54a6f1f.mp3", "duration": 2.094286 }, "Have you packed your suitcase yet?": { "path": "audio/voice/ae87b50604727d20.mp3", "duration": 2.954104 }, "I've already packed it.": { "path": "audio/voice/d852c163f6ce551b.mp3", "duration": 2.25415 }, "We're going on holiday tomorrow.": { "path": "audio/voice/a980b9be8fbf2bff.mp3", "duration": 2.838957 }, "I've just had a cup of coffee.": { "path": "audio/voice/aac0e06f75003344.mp3", "duration": 2.739048 }, "Paris in the spring": { "path": "audio/voice/5e3522e99b1616f1.mp3", "duration": 2.099184 }, "Paris": { "path": "audio/voice/5dd272b4f316b776.mp3", "duration": 1.73941 }, "cinema": { "path": "audio/voice/b815843425f6ac6c.mp3", "duration": 1.614331 }, "film": { "path": "audio/voice/d0607f7ad2628b2a.mp3", "duration": 1.584399 }, "beautiful": { "path": "audio/voice/c6a1427d7119cd3c.mp3", "duration": 1.704354 }, "city": { "path": "audio/voice/11a62c23412b7747.mp3", "duration": 1.549433 }, "never": { "path": "audio/voice/6497e4b3d7bed169.mp3", "duration": 1.51941 }, "ever": { "path": "audio/voice/63212655f2e25a8f.mp3", "duration": 1.474422 }, "Have you just been to the cinema?": { "path": "audio/voice/30d84e25bbb72350.mp3", "duration": 2.62907 }, "Yes, I have.": { "path": "audio/voice/a7700a56086f0544.mp3", "duration": 2.414331 }, "What's on?": { "path": "audio/voice/1848a120f0117ac2.mp3", "duration": 1.726213 }, "“Paris in the Spring”.": { "path": "audio/voice/2b050044873a1091.mp3", "duration": 2.099184 }, "Oh, I've already seen it. I saw it on television last year. It's an old film, but it's very good.": { "path": "audio/voice/b6be8cd794138177.mp3", "duration": 8.808299 }, "Paris is a beautiful city.": { "path": "audio/voice/05c6675e990f2474.mp3", "duration": 2.514014 }, "I've never been there. Have you ever been there, Ken?": { "path": "audio/voice/edca599bfa9af672.mp3", "duration": 4.918866 }, "Yes, I have. I was there in April.": { "path": "audio/voice/3f1a328bc71b5423.mp3", "duration": 4.394014 }, "Paris in the spring, eh?": { "path": "audio/voice/b36363007574b3f2.mp3", "duration": 2.679184 }, "It was raining at the time.": { "path": "audio/voice/39b3583eb8a5305a.mp3", "duration": 2.344127 }, "I've never been there.": { "path": "audio/voice/1aecefb5991f63b9.mp3", "duration": 2.119229 }, "Have you ever been there, Ken?": { "path": "audio/voice/9d271419063c43b6.mp3", "duration": 3.049116 }, "A car crash": { "path": "audio/voice/f4de38ba08ae5891.mp3", "duration": 2.044354 }, "attendant": { "path": "audio/voice/7c5e0e76beb30963.mp3", "duration": 1.73932 }, "bring": { "path": "audio/voice/4311902217ad5aa4.mp3", "duration": 1.614422 }, "garage": { "path": "audio/voice/21b747de22dbb757.mp3", "duration": 1.674422 }, "crash": { "path": "audio/voice/cdb2e0d0f873ce53.mp3", "duration": 1.674422 }, "lamp-post": { "path": "audio/voice/3d5e52f53f8aca92.mp3", "duration": 1.989342 }, "repair": { "path": "audio/voice/a1a14ff4aab4f1d3.mp3", "duration": 1.614331 }, "try": { "path": "audio/voice/1e262cd7d110812f.mp3", "duration": 1.474422 }, "drive": { "path": "audio/voice/7062520c5a0ea9de.mp3", "duration": 1.644444 }, "Isn't my car ready yet?": { "path": "audio/voice/448c50b691290727.mp3", "duration": 2.509887 }, "No, I'm afraid not. They're still working on it.": { "path": "audio/voice/73030c124b92ace5.mp3", "duration": 4.788889 }, "I brought it here three days ago.": { "path": "audio/voice/a2b6c1d7bf67c5f9.mp3", "duration": 2.664172 }, "Yes, I know. Didn't you have a crash?": { "path": "audio/voice/28c14e559f291bd4.mp3", "duration": 4.390703 }, "That's right. I drove it into a lamp-post. Can your mechanics repair it?": { "path": "audio/voice/9814a0285149c038.mp3", "duration": 6.603492 }, "Well, they're trying to repair it, sir. But to tell you the truth, you need a new car!": { "path": "audio/voice/3968afa22529d569.mp3", "duration": 7.508662 }, "Isn't your car ready yet?": { "path": "audio/voice/14d971da5367358a.mp3", "duration": 2.539229 }, "I drove it into a lamp-post.": { "path": "audio/voice/97b38a4e76e95c6b.mp3", "duration": 2.771111 }, "Can your mechanics repair it?": { "path": "audio/voice/f0b87aad88aa1c45.mp3", "duration": 2.569025 }, "They're still working on it.": { "path": "audio/voice/f4aa9471411bb336.mp3", "duration": 2.339093 }, "For sale": { "path": "audio/voice/aedf56fc02b42aab.mp3", "duration": 1.799365 }, "believe": { "path": "audio/voice/f078209dfece9535.mp3", "duration": 1.684399 }, "may": { "path": "audio/voice/ee4d988c65de860f.mp3", "duration": 1.389433 }, "sell": { "path": "audio/voice/c0f21d451463ec3e.mp3", "duration": 1.55941 }, "because": { "path": "audio/voice/a511aeeeb8a11993.mp3", "duration": 1.689433 }, "retire": { "path": "audio/voice/9588c4b2e8c1865b.mp3", "duration": 1.679365 }, "cost": { "path": "audio/voice/9f82f7b375f4aa1b.mp3", "duration": 1.684399 }, "pound": { "path": "audio/voice/39d77c4bd9a79b5d.mp3", "duration": 1.569478 }, "worth": { "path": "audio/voice/c0a6eb55b12b7dfe.mp3", "duration": 1.554422 }, "penny": { "path": "audio/voice/03d04f7fcebc3c44.mp3", "duration": 1.504444 }, "since": { "path": "audio/voice/6b5a3ded016ab782.mp3", "duration": 1.726213 }, "Good afternoon. I believe that this house is for sale.": { "path": "audio/voice/d9e676a5c2f2c816.mp3", "duration": 4.688844 }, "That's right.": { "path": "audio/voice/644e298d89f966a7.mp3", "duration": 1.764308 }, "May I have a look at it, please?": { "path": "audio/voice/9d50f51200f4e666.mp3", "duration": 3.179184 }, "Yes, of course. Come in.": { "path": "audio/voice/1537ce68a4b09d09.mp3", "duration": 3.899138 }, "How long have you lived here?": { "path": "audio/voice/c7332e8dc4d06b90.mp3", "duration": 2.544263 }, "I've lived here for twenty years.": { "path": "audio/voice/04dd7ba8dfa05569.mp3", "duration": 2.904218 }, "Twenty years! That's a long time.": { "path": "audio/voice/dfa4020267e57665.mp3", "duration": 3.859093 }, "Yes, I've been here since 1976.": { "path": "audio/voice/2a1ec4af36bdd2dc.mp3", "duration": 4.368934 }, "Then why do you want to sell it?": { "path": "audio/voice/c71875eb3e07eadf.mp3", "duration": 2.679138 }, "Because I've just retired. I want to buy a small house in the country.": { "path": "audio/voice/75366e6ff3bcb65c.mp3", "duration": 5.568707 }, "How much does this house cost?": { "path": "audio/voice/706812dd057de26d.mp3", "duration": 2.779048 }, "£68,500.": { "path": "audio/voice/dcd19d2cda9fc4f7.mp3", "duration": 3.544218 }, "That's a lot of money!": { "path": "audio/voice/5bb0861c7738d34d.mp3", "duration": 2.170295 }, "It's worth every penny of it.": { "path": "audio/voice/3b12b872eb3a2471.mp3", "duration": 2.489116 }, "Well, I like the house, but I can't decide yet. My wife must see it first.": { "path": "audio/voice/abbed946b913a94d.mp3", "duration": 7.068753 }, "Women always have the last word.": { "path": "audio/voice/2b3cb324e33ad85d.mp3", "duration": 2.74907 }, "I believe this house is for sale.": { "path": "audio/voice/aea69bac2a87d19f.mp3", "duration": 2.784082 }, "I've been here since 1976.": { "path": "audio/voice/1669c1c2c1b886a3.mp3", "duration": 3.580907 }, "Poor Ian!": { "path": "audio/voice/613afc84ca13e0d3.mp3", "duration": 1.769388 }, "still": { "path": "audio/voice/94e8566ddfc123ed.mp3", "duration": 1.644399 }, "move": { "path": "audio/voice/683a62ce15fbabb1.mp3", "duration": 1.589433 }, "miss": { "path": "audio/voice/80688fc3d5f88a06.mp3", "duration": 1.589433 }, "neighbour": { "path": "audio/voice/968ccf654c356f62.mp3", "duration": 1.584399 }, "person": { "path": "audio/voice/38a81e87e79631e6.mp3", "duration": 1.79941 }, "people": { "path": "audio/voice/c9022680f888674e.mp3", "duration": 1.574422 }, "poor": { "path": "audio/voice/4e3795d05d9d3ed2.mp3", "duration": 1.504399 }, "Has Ian sold his house yet?": { "path": "audio/voice/6a2adda9e9f95fa5.mp3", "duration": 2.849478 }, "Yes, he has. He sold it last week.": { "path": "audio/voice/ccbb539962b0619b.mp3", "duration": 4.764082 }, "Has he moved to his new house yet?": { "path": "audio/voice/7251c8c50a25d312.mp3", "duration": 2.98907 }, "No, not yet. He's still here. He's going to move tomorrow.": { "path": "audio/voice/a122f413b91037c8.mp3", "duration": 6.458866 }, "When? Tomorrow morning?": { "path": "audio/voice/19fed3b5c3adad49.mp3", "duration": 3.345805 }, "No. Tomorrow afternoon. I'll miss him. He has always been a good neighbour.": { "path": "audio/voice/ada83cac6f3097fb.mp3", "duration": 7.343583 }, "He's a very nice person. We'll all miss him.": { "path": "audio/voice/ee5d7c9e9217f2fc.mp3", "duration": 4.28381 }, "When will the new people move into this house?": { "path": "audio/voice/f479e7c7c6b0468d.mp3", "duration": 3.238912 }, "I think that they'll move in the day after tomorrow.": { "path": "audio/voice/639562a5a3b1e726.mp3", "duration": 3.378912 }, "Will you see Ian today, Jenny?": { "path": "audio/voice/7477224d3bc976bb.mp3", "duration": 3.204172 }, "Yes, I will.": { "path": "audio/voice/ee0cb7d2da68c4f5.mp3", "duration": 2.389297 }, "Please give him my regards.": { "path": "audio/voice/17475164f807d42d.mp3", "duration": 2.559093 }, "Poor Ian! He didn't want to leave this house.": { "path": "audio/voice/8a55b7a5a42149bc.mp3", "duration": 4.338957 }, "No, he didn't want to leave, but his wife did!": { "path": "audio/voice/35c456ae1e37514b.mp3", "duration": 4.30907 }, "He's still here.": { "path": "audio/voice/a146b44aa0b6cc19.mp3", "duration": 1.954286 }, "We'll all miss him.": { "path": "audio/voice/2652dee3998a031b.mp3", "duration": 1.989161 }, "He's going to move tomorrow.": { "path": "audio/voice/4a6f7a7417814956.mp3", "duration": 2.609161 }, "Our new neighbour": { "path": "audio/voice/4ab5bd3ba2f53372.mp3", "duration": 1.849297 }, "pilot": { "path": "audio/voice/07ae38b93d8054d8.mp3", "duration": 1.67941 }, "return": { "path": "audio/voice/7187f0675eb38279.mp3", "duration": 1.659365 }, "New York": { "path": "audio/voice/815eca977c7d75f7.mp3", "duration": 1.73932 }, "Tokyo": { "path": "audio/voice/ec2d191680171ca9.mp3", "duration": 1.584399 }, "Madrid": { "path": "audio/voice/e9c722cbefc2f055.mp3", "duration": 1.659365 }, "next door": { "path": "audio/voice/1a7d306826f9f37d.mp3", "duration": 1.80458 }, "month": { "path": "audio/voice/a5c7d1719e284f2c.mp3", "duration": 1.654422 }, "will": { "path": "audio/voice/bc16f5825a9dafc8.mp3", "duration": 1.47941 }, "Nigel is our new next-door neighbour.": { "path": "audio/voice/bd43726b9da16b47.mp3", "duration": 2.959002 }, "He's a pilot.": { "path": "audio/voice/2c4d5267fe0e9580.mp3", "duration": 1.944308 }, "He was in the R.A.F.": { "path": "audio/voice/663198f65834cca4.mp3", "duration": 2.314195 }, "He will fly to New York next month.": { "path": "audio/voice/d5d6478cc7722f14.mp3", "duration": 3.02898 }, "The month after next he'll fly to Tokyo.": { "path": "audio/voice/7ef4a09e0d7def0f.mp3", "duration": 3.298957 }, "At the moment, he's in Madrid. He flew to Spain a week ago.": { "path": "audio/voice/465a98e6598e10fc.mp3", "duration": 5.228844 }, "He'll return to London the week after next.": { "path": "audio/voice/57dff9503666b62c.mp3", "duration": 3.328889 }, "He's only forty-one years old, and he has already been to nearly every country in the world.": { "path": "audio/voice/4c9b524fc5b70862.mp3", "duration": 6.298322 }, "Nigel is a very lucky man. But his wife isn't very lucky. She usually stays at home!": { "path": "audio/voice/43bb4de735d83096.mp3", "duration": 7.658594 }, "He has already been to nearly every country.": { "path": "audio/voice/82e0d508c6ab4bfb.mp3", "duration": 3.408798 }, "Tickets, please.": { "path": "audio/voice/80300fd78aeb5a04.mp3", "duration": 2.554286 }, "return ticket": { "path": "audio/voice/87434e26e856f77a.mp3", "duration": 1.929252 }, "platform": { "path": "audio/voice/d294fcce0cc88587.mp3", "duration": 1.939365 }, "plenty": { "path": "audio/voice/82b5f7770097973f.mp3", "duration": 1.61941 }, "bar": { "path": "audio/voice/fcde2b2edba56bf4.mp3", "duration": 1.504399 }, "station": { "path": "audio/voice/9b4ef3e5b7b4d175.mp3", "duration": 1.91932 }, "catch": { "path": "audio/voice/9f925cdc4feedda4.mp3", "duration": 1.589433 }, "train": { "path": "audio/voice/116f54c41d0405db.mp3", "duration": 1.63941 }, "had better": { "path": "audio/voice/d957eb3c4d23bf80.mp3", "duration": 1.714376 }, "Two return tickets to London, please.": { "path": "audio/voice/be39e149a5107f09.mp3", "duration": 3.639093 }, "What time will the next train leave?": { "path": "audio/voice/6bf22e81777b5443.mp3", "duration": 2.889025 }, "At nineteen minutes past eight.": { "path": "audio/voice/fff2bb22f65d6e99.mp3", "duration": 2.814104 }, "Which platform?": { "path": "audio/voice/26b7ab2a632176c7.mp3", "duration": 2.065805 }, "Platform Two. Over the bridge.": { "path": "audio/voice/8cad43b96333c9e2.mp3", "duration": 3.804263 }, "We've got plenty of time.": { "path": "audio/voice/45497209fa8d3e78.mp3", "duration": 2.509887 }, "It's only three minutes past eight.": { "path": "audio/voice/826020fd88ff9ab0.mp3", "duration": 2.884036 }, "Let's go and have a drink. There's a bar next door to the station.": { "path": "audio/voice/643237462fe65bd6.mp3", "duration": 5.183673 }, "We had better go back to the station now, Ken.": { "path": "audio/voice/a4e8e4f96a10ec1c.mp3", "duration": 3.914014 }, "We want to catch the eight nineteen to London.": { "path": "audio/voice/e891aa394d85a169.mp3", "duration": 3.388889 }, "You've just missed it!": { "path": "audio/voice/cf7b9bf41cce4a0e.mp3", "duration": 2.059138 }, "We had better go back to the station now.": { "path": "audio/voice/97c82f7d93964ba0.mp3", "duration": 3.14907 }, "A small blue case": { "path": "audio/voice/597516ed476bf33e.mp3", "duration": 2.300907 }, "describe": { "path": "audio/voice/c52028f34e378d1e.mp3", "duration": 1.824354 }, "zip": { "path": "audio/voice/4a70fe9aa6436e02.mp3", "duration": 1.51941 }, "label": { "path": "audio/voice/1aca80e8b55c802f.mp3", "duration": 1.57941 }, "handle": { "path": "audio/voice/c2a116aa910d147b.mp3", "duration": 1.614376 }, "address": { "path": "audio/voice/d80c9bf910f14473.mp3", "duration": 1.754422 }, "belong": { "path": "audio/voice/6d38f6d6072843ee.mp3", "duration": 1.644399 }, "pence": { "path": "audio/voice/c74276c1d69805cd.mp3", "duration": 1.649433 }, "I left a suitcase on the train to London the other day.": { "path": "audio/voice/3d08e324349c9117.mp3", "duration": 3.843855 }, "Can you describe it, sir?": { "path": "audio/voice/8c389fa42b8c288e.mp3", "duration": 2.929206 }, "It's a small blue case and it's got a zip.": { "path": "audio/voice/e8af6fc2c176c554.mp3", "duration": 3.253968 }, "There's a label on the handle with my name and address on it.": { "path": "audio/voice/a51a6688e6b04876.mp3", "duration": 3.848844 }, "Is this case yours?": { "path": "audio/voice/96fab6f1e4b2eb12.mp3", "duration": 2.300907 }, "No, that's not mine.": { "path": "audio/voice/f3d4984951be4251.mp3", "duration": 2.684308 }, "What about this one? This one's got a label.": { "path": "audio/voice/c4041cf7ef92646b.mp3", "duration": 4.188798 }, "Let me see it.": { "path": "audio/voice/1d36cdb977a8f286.mp3", "duration": 1.929297 }, "What's your name and address?": { "path": "audio/voice/658e665612d1a109.mp3", "duration": 2.504127 }, "David Hall, 83, Bridge Street.": { "path": "audio/voice/e04341bc05ec5d80.mp3", "duration": 3.984172 }, "That's right. D.N. Hall, 83, Bridge Street.": { "path": "audio/voice/305a121d980f45a3.mp3", "duration": 5.4639 }, "Three pounds and fifty pence, please.": { "path": "audio/voice/5ead5828d9917a7b.mp3", "duration": 3.679093 }, "Hey!": { "path": "audio/voice/b57c370a0fcc7045.mp3", "duration": 1.419456 }, "What's the matter?": { "path": "audio/voice/1bf3c67c9272590c.mp3", "duration": 1.91932 }, "This case doesn't belong to me! You've given me the wrong case!": { "path": "audio/voice/fd5ecb1a64f14631.mp3", "duration": 5.093741 }, "This case doesn't belong to you!": { "path": "audio/voice/9ac785a47b7166c5.mp3", "duration": 2.744989 }, "Can you describe it?": { "path": "audio/voice/22f1ddcfb2bdbbff.mp3", "duration": 2.099229 }, "This case doesn't belong to me!": { "path": "audio/voice/54152ebe78031d20.mp3", "duration": 2.734104 }, "Ow!": { "path": "audio/voice/628ff19832ac5b71.mp3", "duration": 1.299456 }, "slip": { "path": "audio/voice/1c1480e67eee52c1.mp3", "duration": 1.65941 }, "fall": { "path": "audio/voice/2dc46af1b78c32df.mp3", "duration": 1.61941 }, "downstairs": { "path": "audio/voice/8eeafca9de6477b8.mp3", "duration": 2.104399 }, "hurt": { "path": "audio/voice/49002d515d1605d8.mp3", "duration": 1.514422 }, audio/voice/0b514913789f890c.mp3", "duration": 2.184308 }, "soon": { "path": "audio/voice/4a754148b88a68e1.mp3", "duration": 1.664444 }, "write": { "path": "audio/voice/10fd874b68dad080.mp3", "duration": 1.524399 }, "Read Jimmy's card to me please, Mary.": { "path": "audio/voice/036c57b7577972c0.mp3", "duration": 3.644036 }, "“I have just arrived in Scotland and I'm staying at a Youth Hostel.”": { "path": "audio/voice/850625ccc508f8e9.mp3", "duration": 4.423764 }, "Eh?": { "path": "audio/voice/b85749c36fbf710a.mp3", "duration": 1.299456 }, "He says he's just arrived in Scotland. He says he's staying at a Youth Hostel.": { "path": "audio/voice/8af3198f670734d2.mp3", "duration": 6.138685 }, "You know he's a member of the Y.H.A.": { "path": "audio/voice/c860830865f2c247.mp3", "duration": 3.019048 }, "The what?": { "path": "audio/voice/a67fd36fe1eb31b0.mp3", "duration": 1.624354 }, "The Y.H.A., mother. The Youth Hostels Association.": { "path": "audio/voice/cca6ae47df2c045a.mp3", "duration": 5.318957 }, "What else does he say?": { "path": "audio/voice/03f8b034db3ff24a.mp3", "duration": 2.279229 }, "“I'll write a letter soon. I hope you are all well.”": { "path": "audio/voice/6956c5f0aee57d4c.mp3", "duration": 4.463946 }, "Is that all? He doesn't say very much, does he?": { "path": "audio/voice/8bee681221ab7d0a.mp3", "duration": 4.848934 }, "He can't write very much on a card, mother.": { "path": "audio/voice/ee33b69139791255.mp3", "duration": 3.728889 }, "He says he's just arrived in Scotland.": { "path": "audio/voice/1728e0d487219931.mp3", "duration": 3.304036 }, "He says he's staying at a Youth Hostel.": { "path": "audio/voice/5adea769fb59db48.mp3", "duration": 3.08458 }, "He will write a letter soon.": { "path": "audio/voice/a8e63e41a8aa71ee.mp3", "duration": 2.424172 }, "He says he'll write a letter soon.": { "path": "audio/voice/660540c2a3600019.mp3", "duration": 2.77415 }, "The French test": { "path": "audio/voice/6e6f4a206727b1d7.mp3", "duration": 2.049297 }, "ex badly.": { "path": "audio/voice/599caf2db959db7f.mp3", "duration": 4.918912 }, "The man next to me wrote his name at the top of the paper.": { "path": "audio/voice/f686fdf99877f5c5.mp3", "duration": 3.898821 }, "And then he sat there and looked at it for three hours!": { "path": "audio/voice/9edc21d6f60a6a6a.mp3", "duration": 3.543719 }, "I think I passed.": { "path": "audio/voice/e88914893bc6cdb3.mp3", "duration": 2.13932 }, "The English paper wasn't easy enough for me.": { "path": "audio/voice/0430e2ceac0465ac.mp3", "duration": 3.418912 }, "The paper wasn't easy enough for me.": { "path": "audio/voice/16678d66153ab805.mp3", "duration": 2.980091 }, "Full of mistakes": { "path": "audio/voice/ef291688786a033c.mp3", "duration": 2.15424 }, "spell": { "path": "audio/voice/8f4a0aaa62c4ceef.mp3", "duration": 1.674422 }, "intelligently": { "path": "audio/voice/214de98f6423190f.mp3", "duration": 1.924354 }, "mistake": { "path": "audio/voice/1b34ffb5e8ddb2c9.mp3", "duration": 1.809388 }, "correct": { "path": "audio/voice/15a596e3c98c407e.mp3", "duration": 1.649388 }, "present": { "path": "audio/voice/4d4c7eee2e28d03c.mp3", "duration": 1.726213 }, "dictionary": { "path": "audio/voice/177ca70f42def123.mp3", "duration": 1.764399 }, "Where's Sandra, Bob? I want her.": { "path": "audio/voice/333dc1c4e3ad8c57.mp3", "duration": 4.184127 }, "Do you want to see her?": { "path": "audio/voice/3f5b6c87e27682a6.mp3", "duration": 2.304218 }, "Yes, I do. I want her to come to my office. Tell her to come at once.": { "path": "audio/voice/60710f0cf45a7260.mp3", "duration": 7.073651 }, "Did you want to see me, sir?": { "path": "audio/voice/bdf6fa85154a6331.mp3", "duration": 3.099229 }, "Ah, yes, Sandra. How do you spell “intelligent”? Can you tell me?": { "path": "audio/voice/d24165ca61bb3200.mp3", "duration": 7.318776 }, "I-N-T-E-L-L-I-G-E-N-T.": { "path": "audio/voice/f53d4cbeca1dbb89.mp3", "duration": 3.17415 }, "That's right. You've typed it with only one “L”. This letter's full of mistakes. I want you to type it again.": { "path": "audio/voice/54ac2b009781b5aa.mp3", "duration": 9.043129 }, "Yes, I'll do that. I'm sorry about that.": { "path": "audio/voice/6882f85af0855168.mp3", "duration": 4.658957 }, "And here's a little present for you.": { "path": "audio/voice/9ee4ac00e2978cbd.mp3", "duration": 2.764082 }, "What is it?": { "path": "audio/voice/bbff7b98d6da7061.mp3", "duration": 1.609342 }, "It's a dictionary. I hope it'll help you.": { "path": "audio/voice/f1988912e69c5c7b.mp3", "duration": 4.013923 }, "I want her to type this letter again.": { "path": "audio/voice/f3a7001fb19c14d3.mp3", "duration": 2.973968 }, "You've made seventeen mistakes.": { "path": "audio/voice/b9060482840df30a.mp3", "duration": 2.764172 }, "Here's a present for you.": { "path": "audio/voice/95e2a3a389db8092.mp3", "duration": 2.354195 }, "Tell her to come at once.": { "path": "audio/voice/30d2a32e32b24c02.mp3", "duration": 2.429206 }, "It's too small.": { "path": "audio/voice/22e98d982e651b07.mp3", "duration": 1.979274 }, "madam": { "path": "audio/voice/765cc52b3dbc1bb8.mp3", "duration": 1.694376 }, "pretty": { "path": "audio/voice/77049f6f8893dd97.mp3", "duration": 1.494422 }, "suit": { "path": "audio/voice/21839e0eb260dda7.mp3", "duration": 1.619456 }, "short": { "path": "audio/voice/f9b0078b5df596d2.mp3", "duration": 1.63941 }, "long": { "path": "audio/voice/fc66f021c67d064c.mp3", "duration": 1.554422 }, "prettier": { "path": "audio/voice/3def7343c32c5c7b.mp3", "duration": 1.609342 }, "smaller": { "path": "audio/voice/e823da61abfbd317.mp3", "duration": 1.700091 }, "bigger": { "path": "audio/voice/9e5db53b5cf0dace.mp3", "duration": 1.504399 }, "Do you like this dress, madam?": { "path": "audio/voice/851c07907ae09baf.mp3", "duration": 3.264082 }, "I like the colour very much. It's a lovely dress, but it's too small for me.": { "path": "audio/voice/42dff612c800402c.mp3", "duration": 6.308617 }, "What about this one? It's a lovely dress. It's very smart. Short skirts are in fashion now. Would you like to try it?": { "path": "audio/voice/d71cf67abcbe4a4a.mp3", "duration": 10.487982 }, "All right.": { "path": "audio/voice/6cdbc2f5a8795c92.mp3", "duration": 1.709388 }, "I'm afraid this green dress is too short as well.": { "path": "audio/voice/4d898cb46c3f880d.mp3", "duration": 3.66381 }, "I'm afraid it's too small for me.": { "path": "audio/voice/255b32e68522c724.mp3", "duration": 2.819093 }, "This one's prettier than that one.": { "path": "audio/voice/aee5e948682d9082.mp3", "duration": 2.723991 }, "It's a lovely dress, but it's too small for me.": { "path": "audio/voice/4ab3dc1dbda789cb.mp3", "duration": 3.963946 }, "Short skirts are in fashion now.": { "path": "audio/voice/cbbab02e76cc9397.mp3", "duration": 2.819048 }, "A good idea": { "path": "audio/voice/23c411c993827707.mp3", "duration": 1.889297 }, "idea": { "path": "audio/voice/ae0a9ad3227c5420.mp3", "duration": 1.579365 }, "teaspoonful": { "path": "audio/voice/498ce9c040ba1979.mp3", "duration": 2.004308 }, "less": { "path": "audio/voice/4fdd3b6201a22c78.mp3", "duration": 1.589433 }, "a few": { "path": "audio/voice/90290ad775ac38d9.mp3", "duration": 1.564444 }, "pity": { "path": "audio/voice/8c0706c0a8dcb82c.mp3", "duration": 1.49941 }, "instead": { "path": "audio/voice/99262a0284ae7670.mp3", "duration": 1.784399 }, "advice": { "path": "audio/voice/02c97447687b4871.mp3", "duration": 1.694422 }, "milk": { "path": "audio/voice/8825e76530f87ff5.mp3", "duration": 1.504354 }, "Shall I make some coffee, Jane?": { "path": "audio/voice/97eab4793fc9e884.mp3", "duration": 3.399184 }, "That's a good idea, Charlotte.": { "path": "audio/voice/6ba071237cecc12b.mp3", "duration": 3.059048 }, "It's ready. Do you want any milk?": { "path": "audio/voice/cedf70f48f36eb1b.mp3", "duration": 3.724127 }, "Just a little, please.": { "path": "audio/voice/7f21bf736d00f0fd.mp3", "duration": 2.789206 }, "What about some sugar? Two teaspoonfuls?": { "path": "audio/voice/19b6d814d754a89e.mp3", "duration": 4.30898 }, "No, less than that. One and a half teaspoonfuls, please. That's enough for me.": { "path": "audio/voice/892fe89525def8e8.mp3", "duration": 7.728526 }, "Would you like some more?": { "path": "audio/voice/6b1628e3f0ef2746.mp3", "duration": 2.239184 }, "Yes, please. I'd like a cigarette, too. May I have one?": { "path": "audio/voice/6ea975cf514473b5.mp3", "duration": 6.843855 }, "Of course. I think there are a few in that box.": { "path": "audio/voice/6cc7eeb9299e8a9b.mp3", "duration": 4.488844 }, "I'm afraid it's empty.": { "path": "audio/voice/3b37a4571a393b05.mp3", "duration": 2.179184 }, "What a pity!": { "path": "audio/voice/7bb1972913b74053.mp3", "duration": 1.73932 }, "It doesn't matter.": { "path": "audio/voice/fc3b4ba310f81bef.mp3", "duration": 1.994286 }, "Have a biscuit instead. Eat more and smoke less!": { "path": "audio/voice/736b9bc5a94c2af6.mp3", "duration": 4.588934 }, "That's very good advice!": { "path": "audio/voice/8684a79a0a123115.mp3", "duration": 2.429116 }, "That's a good idea.": { "path": "audio/voice/009109285a1ef639.mp3", "duration": 2.109161 }, "The most expensive model": { "path": "audio/voice/603c6a4ef8ac308c.mp3", "duration": 2.539184 }, "model": { "path": "audio/voice/9372c470eeadd5ec.mp3", "duration": 1.574376 }, "afford": { "path": "audio/voice/f901528b18bc7e90.mp3", "duration": 1.674422 }, "deposit": { "path": "audio/voice/c3b9fb78a452ce2f.mp3", "duration": 1.744308 }, "instalment": { "path": "audio/voice/4b7997bc4033f2c8.mp3", "duration": 1.904308 }, "price": { "path": "audio/voice/683b531f41ec88a2.mp3", "duration": 1.674422 }, "millionaire": { "path": "audio/voice/725544de96fa7e38.mp3", "duration": 1.799274 }, "expensive": { "path": "audio/voice/f3cca575ff7e90bd.mp3", "duration": 1.894331 }, "pay": { "path": "audio/voice/9350872d712a127c.mp3", "duration": 1.384444 }, "cheap": { "path": "audio/voice/c6f556046e0c0046.mp3", "duration": 1.574422 }, "I like this television very much. How much does it cost?": { "path": "audio/voice/16a4f8271e604c79.mp3", "duration": 5.168798 }, "It's the most expensive model in the shop. It costs five hundred pounds.": { "path": "audio/voice/c143ed1d2ca0ad0d.mp3", "duration": 6.063537 }, "That's too expensive for us. We can't afford all that money.": { "path": "audio/voice/d2bfbd2140791df3.mp3", "duration": 5.03356 }, "This model's less expensive than that one. It's only three hundred pounds. But, of course, it's not as good as the expensive one.": { "path": "audio/voice/f138cc91f1016a2f.mp3", "duration": 10.294376 }, "I don't like this model. The other model's more expensive, but it's worth the money.": { "path": "audio/voice/1733c36e4ad589e9.mp3", "duration": 6.403401 }, "Can we buy it on instalments?": { "path": "audio/voice/fc35817d31f481b7.mp3", "duration": 2.754104 }, "Yes, of course. You can pay a deposit of thirty pounds, and then fourteen pounds a month for three years.": { "path": "audio/voice/e6fc1f908391b49c.mp3", "duration": 8.353243 }, "It costs five hundred pounds.": { "path": "audio/voice/61f039338d7ce3b7.mp3", "duration": 2.980091 }, "It's the most expensive model in the shop.": { "path": "audio/voice/b91ac5d42184b07e.mp3", "duration": 3.333878 }, "We can't afford all that money.": { "path": "audio/voice/2258e6b47f5a5ba9.mp3", "duration": 2.619048 }, "This model's less expensive than that one.": { "path": "audio/voice/6181a94567cb0925.mp3", "duration": 3.248934 }, "Small change": { "path": "audio/voice/8380f542dad92d73.mp3", "duration": 2.170295 }, "conductor": { "path": "audio/voice/0380db97ec507816.mp3", "duration": 1.764354 }, "fare": { "path": "audio/voice/eaa8b6e89fcb020d.mp3", "duration": 1.55941 }, "note": { "path": "audio/voice/edb465624291e405.mp3", "duration": 1.504444 }, "passenger": { "path": "audio/voice/bf816809a4d8aa98.mp3", "duration": 1.834331 }, "none": { "path": "audio/voice/140bedbf9c3f6d56.mp3", "duration": 1.549433 }, "neither": { "path": "audio/voice/02566ed5f41493c2.mp3", "duration": 1.529388 }, "tramp": { "path": "audio/voice/12246ef4801bc0ca.mp3", "duration": 1.669388 }, "get off": { "path": "audio/voice/2ea2021be0859652.mp3", "duration": 1.59941 }, "Fares, please!": { "path": "audio/voice/098d383f7536896f.mp3", "duration": 2.514331 }, "Trafalgar Square, please.": { "path": "audio/voice/70b544aa588028c2.mp3", "duration": 3.259138 }, "I'm sorry, sir. I can't change a ten-pound note. Haven't you got any small change?": { "path": "audio/voice/9037eef2770ca233.mp3", "duration": 8.068753 }, "I've got no small change, I'm afraid.": { "path": "audio/voice/a712f1c5c5207b47.mp3", "duration": 3.734059 }, "Neither have I.": { "path": "audio/voice/ae05fca123a9ebe7.mp3", "duration": 1.794376 }, "I haven't got any either.": { "path": "audio/voice/c17769e250543306.mp3", "duration": 2.379274 }, "I can't change a ten-pound note.": { "path": "audio/voice/5adf350ef8d07521.mp3", "duration": 2.889161 }, "Neither can I.": { "path": "audio/voice/1d629b7aa8d26eab.mp3", "duration": 1.80458 }, "Haven't you got any small change?": { "path": "audio/voice/88a42050ece946ba.mp3", "duration": 3.009161 }, "Knock, knock!": { "path": "audio/voice/1b674b1eae47584f.mp3", "duration": 2.269297 }, "knock": { "path": "audio/voice/392245974134021a.mp3", "duration": 1.51941 }, "everything": { "path": "audio/voice/a0a44ed8cfc32b7e.mp3", "duration": 1.809433 }, "quiet": { "path": "audio/voice/008f0747f4e27c84.mp3", "duration": 1.639365 }, "impossible": { "path": "audio/voice/1298a63b90dc1097.mp3", "duration": 1.879365 }, "invite": { "path": "audio/voice/5014f9af3a684fdd.mp3", "duration": 1.604399 }, "joke": { "path": "audio/voice/a2fa4cfad054c30d.mp3", "duration": 1.634422 }, "asleep": { "path": "audio/voice/ea51ae6e548ffbb8.mp3", "duration": 1.719365 }, "anyone": { "path": "audio/voice/12ed8d14a55fdb47.mp3", "duration": 1.684354 }, "Isn't there anyone at home?": { "path": "audio/voice/77e9b50ccc2fcdc6.mp3", "duration": 2.51415 }, "I'll knock again, Helen.": { "path": "audio/voice/7fc8457733db6b4b.mp3", "duration": 2.779184 }, "Everything's very quiet. I'm sure there's no one at home.": { "path": "audio/voice/31b0b461d0d7aa81.mp3", "duration": 4.943764 }, "But that's impossible. Carol and Tom invited us to lunch. Look through the window.": { "path": "audio/voice/ac83f530f25c79fc.mp3", "duration": 6.963447 }, "Can you see anything?": { "path": "audio/voice/850baa45f2b62669.mp3", "duration": 2.23424 }, "Nothing at all.": { "path": "audio/voice/8cb20516bc78850c.mp3", "duration": 1.884263 }, "Let's try the back door.": { "path": "audio/voice/8a3781793861c131.mp3", "duration": 2.439138 }, "Look! Everyone's in the garden.": { "path": "audio/voice/2fcbda82cc08e7af.mp3", "duration": 3.58907 }, "Hello, Helen. Hello, Jim.": { "path": "audio/voice/098e7fba5c567be5.mp3", "duration": 4.384172 }, "Everybody wants to have lunch in the garden. It's nice and warm out here.": { "path": "audio/voice/9329141a6ccfc525.mp3", "duration": 5.543492 }, "Come and have something to drink.": { "path": "audio/voice/3ab843ba693e17cc.mp3", "duration": 2.654104 }, "Thanks, Carol. May I have a glass of beer please?": { "path": "audio/voice/33c37ad3a14ae455.mp3", "duration": 5.259048 }, "Beer? There's none left. You can have some lemonade.": { "path": "audio/voice/6f01f18abfd5f57f.mp3", "duration": 5.435601 }, "Lemonade!": { "path": "audio/voice/fdbe693d7dac6d64.mp3", "duration": 1.644399 }, "Don't believe her, Jim. She's only joking. Have some beer!": { "path": "audio/voice/33d7321f20f9f4e5.mp3", "duration": 6.388798 }, "Everything's very quiet.": { "path": "audio/voice/7394e3a8b9125692.mp3", "duration": 2.444127 }, "There's no one at home.": { "path": "audio/voice/adca11929d9f7986.mp3", "duration": 2.300907 }, "Everyone's in the garden.": { "path": "audio/voice/736c84a78ee2a348.mp3", "duration": 2.319138 }, "Tommy's breakfast": { "path": "audio/voice/53bf31136e1b3583.mp3", "duration": 2.170295 }, "dining room": { "path": "audio/voice/13c0c8fa4c514c35.mp3", "duration": 1.794331 }, "coin": { "path": "audio/voice/b3a1984ba0b1d8ad.mp3", "duration": 1.554422 }, "swallow": { "path": "audio/voice/7276e0a742cf9880.mp3", "duration": 1.694376 }, "later": { "path": "audio/voice/1d9283d848ea941a.mp3", "duration": 1.529433 }, "toilet": { "path": "audio/voice/74f7fd1cf08b145c.mp3", "duration": 1.669388 }, "while": { "path": "audio/voice/07a8750738828ffd.mp3", "duration": 1.529388 }, "When my husband was going into the dining room this morning, he dropped some coins on the floor.": { "path": "audio/voice/33364f95c238a0d4.mp3", "duration": 6.118367 }, "There were coins everywhere.": { "path": "audio/voice/0a80e79c64327782.mp3", "duration": 2.369161 }, "We looked for them, but while we were having breakfast, Tommy found two small coins on the floor.": { "path": "audio/voice/871a31331a45c6fd.mp3", "duration": 6.778277 }, "He put them both into his mouth. We both tried to get the coins, but it was too late. Tommy had already swallowed them!": { "path": "audio/voice/af419af9090c72dc.mp3", "duration": 9.387937 }, "Late that morning, when I was doing the housework, my husband phoned me from the office.": { "path": "audio/voice/354bd348ed79bc98.mp3", "duration": 6.208481 }, "“How's Tommy?” he asked. “I don't know,” I answered, “Tommy's been to the toilet three times this morning, but I haven't seen any coins!”": { "path": "audio/voice/a371774d95d4d138.mp3", "duration": 10.343084 }, "When my husband was going into the dining room, he dropped some coins.": { "path": "audio/voice/006f6f60356105dd.mp3", "duration": 5.143583 }, "What were you doing while we were having breakfast?": { "path": "audio/voice/3f6979bf60c8f3c8.mp3", "duration": 3.468844 }, "While we were having breakfast, Tommy found two small coins.": { "path": "audio/voice/2cf3f518cbe27fa6.mp3", "duration": 4.903764 }, "A true story": { "path": "audio/voice/7fc9d19515c9d9b0.mp3", "duration": 1.935193 }, "true": { "path": "audio/voice/b5bea41b6c623f7c.mp3", "duration": 1.474422 }, "story": { "path": "audio/voice/c478361e6869af25.mp3", "duration": 1.649388 }, "happen": { "path": "audio/voice/9ecfb3a042a271f4.mp3", "duration": 1.684399 }, "thief": { "path": "audio/voice/8dd29add9992f700.mp3", "duration": 1.639456 }, "enter": { "path": "audio/voice/e08d706b3e4ce964.mp3", "duration": 1.51941 }, "dark": { "path": "audio/voice/e6bb5689beec52c4.mp3", "duration": 1.534376 }, "torch": { "path": "audio/voice/37bf51bfba4699a9.mp3", "duration": 1.604399 }, "voice": { "path": "audio/voice/c57d7e92019708b6.mp3", "duration": 1.700091 }, "parrot": { "path": "audio/voice/4488b8b86b1ac061.mp3", "duration": 1.634376 }, "Do you like stories? I want to tell you a true story. It happened to a friend of mine a year ago.": { "path": "audio/voice/5eda2db38608ec77.mp3", "duration": 7.70839 }, "While my friend, George, was reading in bed, two thieves climbed into his kitchen.": { "path": "audio/voice/e5f599d59cc6acd5.mp3", "duration": 6.454376 }, "After they went into the house, they went into the dining room. It was very dark, so they turned on a torch.": { "path": "audio/voice/5c4f9d51a3b4105c.mp3", "duration": 8.028299 }, "Suddenly, they heard a voice behind them. “What's up? What's up?” someone called.": { "path": "audio/voice/7770099d1a101b3f.mp3", "duration": 7.708526 }, "The thieves dropped the torch and ran away as quickly as they could.": { "path": "audio/voice/e60667cddc456a88.mp3", "duration": 4.343764 }, "George heard the noise and came downstairs quickly.": { "path": "audio/voice/2e5ce626bb2b7891.mp3", "duration": 3.734014 }, "He turned on the light, but he couldn't see anyone. The thieves had already gone.": { "path": "audio/voice/c987baabe5e61475.mp3", "duration": 6.25356 }, "But George's parrot, Henry, was still there.": { "path": "audio/voice/844329ad53fad002.mp3", "duration": 4.155601 }, "“What's up, George?” it called. “Nothing, Henry,” George said and smiled. “Go back to sleep.”": { "path": "audio/voice/f36912ccc5e65bd5.mp3", "duration": 9.29356 }, "It happened to a friend of mine a year ago.": { "path": "audio/voice/dc2f03e675da2235.mp3", "duration": 3.119048 }, "Suddenly, they heard a voice behind them.": { "path": "audio/voice/dea81578376df56e.mp3", "duration": 3.599002 }, "The thieves ran away as quickly as they could.": { "path": "audio/voice/ace606c2a859608f.mp3", "duration": 3.349116 }, "They ran away as quickly as they could.": { "path": "audio/voice/2362935563dc6d1b.mp3", "duration": 3.044218 }, "What's up?": { "path": "audio/voice/834032dfb827138e.mp3", "duration": 1.649342 }, "The man in a hat": { "path": "audio/voice/241700b2780aceee.mp3", "duration": 2.069388 }, "customer": { "path": "audio/voice/b6c45863875e3448.mp3", "duration": 1.734376 }, "forget": { "path": "audio/voice/babc1bd8ec812c74.mp3", "duration": 1.689388 }, "manager": { "path": "audio/voice/6ee4a469cd4e9105.mp3", "duration": 1.669342 }, "serve": { "path": "audio/voice/24c458cfb46d9a45.mp3", "duration": 1.644444 }, "counter": { "path": "audio/voice/efe899c74558f20b.mp3", "duration": 1.63941 }, "recognize": { "path": "audio/voice/1b00de68c4c9617c.mp3", "duration": 1.839274 }, "hour": { "path": "audio/voice/9ac0add475dd38e6.mp3", "duration": 1.474376 }, "I bought two expensive dictionaries here half an hour ago, but I forgot to take them with me.": { "path": "audio/voice/8b11a44cd9c4df9b.mp3", "duration": 6.168481 }, "Who served you, sir?": { "path": "audio/voice/1ca45b3442b4d9ba.mp3", "duration": 2.771111 }, "The lady who is standing behind the counter.": { "path": "audio/voice/47479b11fd7df427.mp3", "duration": 3.2439 }, "Which books did you buy?": { "path": "audio/voice/ef2e3bed13fedae4.mp3", "duration": 2.269206 }, "The books which are on the counter.": { "path": "audio/voice/0c211f4fc2f0eb41.mp3", "duration": 2.604082 }, "Did you serve this gentleman half an hour ago, Caroline?": { "path": "audio/voice/5ace6e6266b11945.mp3", "duration": 4.508707 }, "He says he's the man who bought these books.": { "path": "audio/voice/c44cff96c87edffc.mp3", "duration": 3.299048 }, "I can't remember.": { "path": "audio/voice/d12e8fd90a387c9f.mp3", "duration": 2.049252 }, "The man who I served was wearing a hat.": { "path": "audio/voice/5e289b71879f748f.mp3", "duration": 3.12907 }, "Have you got a hat, sir?": { "path": "audio/voice/d0f4ba88bbc3ae7a.mp3", "duration": 2.969161 }, "Would you put it on, please?": { "path": "audio/voice/5064102347ec1c95.mp3", "duration": 2.974195 }, "Is this the man that you served, Caroline?": { "path": "audio/voice/399995d4baaf5dd9.mp3", "duration": 3.699002 }, "Yes.": { "path": "audio/voice/5f9a2b795615ba6a.mp3", "duration": 1.589433 }, "I recognize him now.": { "path": "audio/voice/53e8bd68fc2bf183.mp3", "duration": 2.274785 }, "I forgot to take them with me.": { "path": "audio/voice/eb03ffaf66a3b071.mp3", "duration": 2.554059 }, "A trip to Australia": { "path": "audio/voice/72ee30d29fbc67e9.mp3", "duration": 2.379274 }, "Australia": { "path": "audio/voice/c1ef40ce0484c698.mp3", "duration": 1.824263 }, "during": { "path": "audio/voice/76678e40cf8bdb8a.mp3", "duration": 1.649433 }, "trip": { "path": "audio/voice/34a389d790fc2bdd.mp3", "duration": 1.609388 }, "travel": { "path": "audio/voice/0209442e115ad7bc.mp3", "duration": 1.609342 }, "offer": { "path": "audio/voice/988180bf0c9328c9.mp3", "duration": 1.589433 }, "guess": { "path": "audio/voice/f1abe1b083d12d18.mp3", "duration": 1.584444 }, "grow": { "path": "audio/voice/adca5146416ee419.mp3", "duration": 1.444444 }, "beard": { "path": "audio/voice/941192abb086502a.mp3", "duration": 1.49941 }, "shave": { "path": "audio/voice/14b42c3e81f60c0d.mp3", "duration": 1.639456 }, "Look, Scott.": { "path": "audio/voice/7199ff6690175990.mp3", "duration": 2.329297 }, "This is a photograph I took during my trip to Australia.": { "path": "audio/voice/3ef658f0815244e8.mp3", "duration": 4.103673 }, "Let me see it, Mike.": { "path": "audio/voice/9a575bd87dc83c41.mp3", "duration": 2.69424 }, "This is a good photograph.": { "path": "audio/voice/b767c72da8eabc4e.mp3", "duration": 2.464172 }, "Who are these people?": { "path": "audio/voice/9e0d2f0b3d5d7c49.mp3", "duration": 2.119274 }, "They're people I met during the trip.": { "path": "audio/voice/8c32a6ea1372d925.mp3", "duration": 2.819093 }, "That's the ship we travelled on.": { "path": "audio/voice/8ffea16f1041672a.mp3", "duration": 2.67415 }, "What a beautiful ship!": { "path": "audio/voice/a3da97de9aae2df5.mp3", "duration": 2.224172 }, "Who's this?": { "path": "audio/voice/f7fb3ce4f833b17e.mp3", "duration": 1.684399 }, "That's the man I told you about.": { "path": "audio/voice/258ef9fd92852e79.mp3", "duration": 2.75415 }, "Remember?": { "path": "audio/voice/0f4ce1caca38a288.mp3", "duration": 1.644263 }, "Ah yes.": { "path": "audio/voice/541a9feedbddcf97.mp3", "duration": 1.644399 }, "The one who offered you a job in Australia.": { "path": "audio/voice/31bff7bc9bc18895.mp3", "duration": 3.263946 }, "Guess!": { "path": "audio/voice/4f9d981ced60c90f.mp3", "duration": 1.584444 }, "It's not you, is it?": { "path": "audio/voice/822a937e3f2ec364.mp3", "duration": 2.524263 }, "I grew a beard during the trip, but I shaved it off when I came home.": { "path": "audio/voice/0cb794b6ea2e1a08.mp3", "duration": 4.913741 }, "Why did you shave it off?": { "path": "audio/voice/5566f113f4e91a9a.mp3", "duration": 2.384218 }, "My wife didn't like it!": { "path": "audio/voice/82a1dcf3f46d203f.mp3", "duration": 2.33424 }, "Do you know the man who's standing there?": { "path": "audio/voice/7a083125f8d679e6.mp3", "duration": 2.984036 }, "I grew a beard during the trip.": { "path": "audio/voice/347a261b41ccbb70.mp3", "duration": 2.654104 }, "But I shaved it off when I came home.": { "path": "audio/voice/f1f1d13d8f5667fb.mp3", "duration": 2.999138 }, "Tea for two": { "path": "audio/voice/83e67e9a46934cd0.mp3", "duration": 1.924354 }, "terribly": { "path": "audio/voice/a6513a114ac02daf.mp3", "duration": 1.63932 }, "dry": { "path": "audio/voice/b755cb248c3c4a7d.mp3", "duration": 1.444444 }, "nuisance": { "path": "audio/voice/8b302a2fab5b8226.mp3", "duration": 1.909342 }, "mean": { "path": "audio/voice/82523faea1b0f2da.mp3", "duration": 1.55941 }, "have to": { "path": "audio/voice/2c9f6f9e513d3255.mp3", "duration": 1.634376 }, "needn't": { "path": "audio/voice/baeff0252bc89746.mp3", "duration": 1.644399 }, "Can't you come in and have tea now, Peter?": { "path": "audio/voice/d933a0e16653a812.mp3", "duration": 3.539048 }, "Not yet, dear. I must water the garden first.": { "path": "audio/voice/a6c8385133fe1305.mp3", "duration": 5.028753 }, "Do you have to water it now?": { "path": "audio/voice/4dbd71e60823b636.mp3", "duration": 2.519138 }, "I'm afraid I do. It's terribly dry.": { "path": "audio/voice/a36d2f873acbce8b.mp3", "duration": 3.903991 }, "What a nuisance!": { "path": "audio/voice/81602396c1162709.mp3", "duration": 1.964218 }, "Last summer it was very dry, too. Don't you remember? I had to water it every day.": { "path": "audio/voice/385975750c476e65.mp3", "duration": 7.563537 }, "Well, I'll have tea ready for you when you come in.": { "path": "audio/voice/75da4b0b36ea1e97.mp3", "duration": 3.933968 }, "Good heavens! It's raining. That means I needn't water the garden!": { "path": "audio/voice/bf4f616bd10575e5.mp3", "duration": 5.968753 }, "Do you have to water the garden every day?": { "path": "audio/voice/695e90ee7ffbb12d.mp3", "duration": 3.099093 }, "It's terribly dry.": { "path": "audio/voice/840bf64a41024fae.mp3", "duration": 2.149206 }, "You needn't water the garden now.": { "path": "audio/voice/581ba7bc88de15dd.mp3", "duration": 2.629116 }, "You needn't water the garden.": { "path": "audio/voice/3ad1e6aa8cee1bf7.mp3", "duration": 2.464127 }, "A famous actress": { "path": "audio/voice/2dfdb5c29b68ad57.mp3", "duration": 2.254286 }, "famous": { "path": "audio/voice/79b1bc81314de30f.mp3", "duration": 1.81941 }, "actress": { "path": "audio/voice/dbc2c9ff59b9a02c.mp3", "duration": 1.854422 }, "actor": { "path": "audio/voice/50c9c4aeb40b5b20.mp3", "duration": 1.574422 }, "at least": { "path": "audio/voice/e9213756a2e67dcb.mp3", "duration": 1.669342 }, "opinion": { "path": "audio/voice/4379105aca40fc3c.mp3", "duration": 1.794331 }, "thirty": { "path": "audio/voice/aca5fb59db69e5df.mp3", "duration": 1.55941 }, "forty": { "path": "audio/voice/9cee2304bd633d42.mp3", "duration": 1.564399 }, "Can you recognize that woman, Liz?": { "path": "audio/voice/f7405ec416138bd9.mp3", "duration": 3.479002 }, "I think I can, Kate.": { "path": "audio/voice/2891229913a53aa0.mp3", "duration": 2.809297 }, "It must be Karen Marsh, the actress.": { "path": "audio/voice/1eced8aae03d1fff.mp3", "duration": 3.60898 }, "I thought so.": { "path": "audio/voice/ded1bbdd6c1ff648.mp3", "duration": 1.839365 }, "Who's that beside her?": { "path": "audio/voice/9c22bcfcc40099db.mp3", "duration": 2.199229 }, "That must be Conrad Reeves.": { "path": "audio/voice/b91e653f41f6e86c.mp3", "duration": 2.654059 }, "Conrad Reeves, the actor?": { "path": "audio/voice/d545aa33b4b086c4.mp3", "duration": 2.999093 }, "It can't be.": { "path": "audio/voice/8a4771a035bae579.mp3", "duration": 1.814286 }, "Let me have another look.": { "path": "audio/voice/2e4c7cde8a6fc48b.mp3", "duration": 2.31415 }, "I think you're right!": { "path": "audio/voice/5e40de071e34fab7.mp3", "duration": 2.184263 }, "Isn't he her third husband?": { "path": "audio/voice/9045b3af8da057f9.mp3", "duration": 2.464218 }, "No. He must be her fourth or fifth.": { "path": "audio/voice/900650f28c959cc0.mp3", "duration": 3.920499 }, "Doesn't Karen Marsh look old!": { "path": "audio/voice/b5a758e88bdab91b.mp3", "duration": 2.68907 }, "She does, doesn't she!": { "path": "audio/voice/9dd4d8da5aead84e.mp3", "duration": 2.774286 }, "I read she's twenty-nine, but she must be at least forty.": { "path": "audio/voice/6285216ee684a1b2.mp3", "duration": 4.528571 }, "I'm sure she is.": { "path": "audio/voice/b0fad3a3f498e00a.mp3", "duration": 2.164399 }, "She was a famous actress when I was still at school.": { "path": "audio/voice/f044f33ca5e0e7c7.mp3", I was doing eighty when I overtook you.": { "path": "audio/voice/7c54df7db743264d.mp3", "duration": 2.980091 }, "You must have been speeding.": { "path": "audio/voice/ecc37c642fc7329a.mp3", "duration": 2.339093 }, "Don't be so sure!": { "path": "audio/voice/7f91d75c02c0fa96.mp3", "duration": 2.164354 }, "worry": { "path": "audio/voice/6de2f53e03e93dff.mp3", "duration": 1.51941 }, "Egypt": { "path": "audio/voice/557c1599d9a04895.mp3", "duration": 1.664354 }, "abroad": { "path": "audio/voice/a6278590a4ba1f3c.mp3", "duration": 1.61941 }, "sea": { "path": "audio/voice/4a69f19c8c264850.mp3", "duration": 1.439456 }, "might": { "path": "audio/voice/f23be8eed45492f4.mp3", "duration": 1.51941 }, "look after": { "path": "audio/voice/2f68f7a0fa3b500c.mp3", "duration": 1.734286 }, "Where are you going to spend your holidays this year, Tom?": { "path": "audio/voice/bafa2d9a433e1ef5.mp3", "duration": 4.44381 }, "We may go abroad.": { "path": "audio/voice/951ce3fe73e653e7.mp3", "duration": 2.089206 }, "My wife wants to go to Egypt, so I may go there. We may travel by sea.": { "path": "audio/voice/091b300176c943b9.mp3", "duration": 6.443537 }, "We may not go anywhere. My wife always worries too much. Who's going to look after the dog?": { "path": "audio/voice/4ac2f54a179d5cb1.mp3", "duration": 7.463401 }, "I'm not sure.": { "path": "audio/voice/1438ebe71a34e577.mp3", "duration": 1.93932 }, "My wife always worries too much.": { "path": "audio/voice/0ae992839d77e018.mp3", "duration": 2.904127 }, "My wife wants to go to Egypt, so I may go there.": { "path": "audio/voice/74046996ffe0eb32.mp3", "duration": 4.318821 }, "Sensational news!": { "path": "audio/voice/5f4820d2daad4b42.mp3", "duration": 2.359229 }, "reporter": { "path": "audio/voice/41d6d5322a9b546a.mp3", "duration": 1.729342 }, "sensational": { "path": "audio/voice/979c4b8a301d4b86.mp3", "duration": 1.97424 }, "mink coat": { "path": "audio/voice/f85dcc316a18a294.mp3", "duration": 1.784354 }, "wonder": { "path": "audio/voice/36296059cca8b7c7.mp3", "duration": 1.584354 }, "interview": { "path": "audio/voice/02540942346fdfbf.mp3", "duration": 1.679274 }, "Have you just made a new film, Miss Marsh?": { "path": "audio/voice/bfdbecd7f590265f.mp3", "duration": 3.759048 }, "Are you going to make another?": { "path": "audio/voice/b13db8cf4304890b.mp3", "duration": 2.414195 }, "No, I'm not. I'm going to retire. I feel very tired. I don't want to make another film for a long time.": { "path": "audio/voice/97feb2885681ff55.mp3", "duration": 9.783356 }, "Let's buy a newspaper, Kate. Listen to this!": { "path": "audio/voice/59fe687a59055f4e.mp3", "duration": 4.798912 }, "“Karen Marsh: Sensational News! By our reporter, Alan Jones. Miss Marsh arrived at London Airport this morning. She was wearing a mink coat and she said she was going to retire.”": { "path": "audio/voice/e5627963b0bce4ed.mp3", "duration": 14.202086 }, "I wonder why!": { "path": "audio/voice/145f98cef0cbecd2.mp3", "duration": 1.864308 }, "She said she was not going to make another.": { "path": "audio/voice/2920a1f8a8c4ff6e.mp3", "duration": 3.263991 }, "She said she was going to retire.": { "path": "audio/voice/2521ced844ae15f0.mp3", "duration": 2.98907 }, "The latest report": { "path": "audio/voice/8e51e456e5f0a616.mp3", "duration": 2.149161 }, "latest": { "path": "audio/voice/5e1e2bcac305958b.mp3", "duration": 1.809433 }, "future": { "path": "audio/voice/ebb3de8a3d9a4036.mp3", "duration": 1.700091 }, "get married": { "path": "audio/voice/d7cf448a36272f58.mp3", "duration": 1.759365 }, "introduce": { "path": "audio/voice/0fee7196f6817d6f.mp3", "duration": 1.739274 }, "report": { "path": "audio/voice/845e91831319e89c.mp3", "duration": 1.634331 }, "would": { "path": "audio/voice/c6323a2117013ed6.mp3", "duration": 1.469433 }, "Are you really going to retire, Miss Marsh?": { "path": "audio/voice/b266c20975dee31a.mp3", "duration": 3.774104 }, "Well, I may. I can't make up my mind. I shall have to ask my future husband. He won't let me make another film.": { "path": "audio/voice/95d842060573d65e.mp3", "duration": 10.203175 }, "Your future husband, Miss Marsh?": { "path": "audio/voice/7c38907032d6d19d.mp3", "duration": 3.34907 }, "Yes. Let me introduce him to you.": { "path": "audio/voice/7f9f65c18f5a907e.mp3", "duration": 3.823991 }, "Listen to this! “Karen Marsh: The Latest Report. Miss Marsh told reporters this morning that she might retire. She said she couldn't make up her mind. She said she would have to ask her future husband. She said her future husband would not let her make another film.”": { "path": "audio/voice/17bbf49296935597.mp3", "duration": 19.361315 }, "Good heavens! That reporter is her future husband!": { "path": "audio/voice/1b9c3d53dd4ff28e.mp3", "duration": 4.625805 }, "Are you really going to retire?": { "path": "audio/voice/9718ec76da81bbc0.mp3", "duration": 2.669206 }, "She said she would have to ask her future husband.": { "path": "audio/voice/845283971fb4859b.mp3", "duration": 3.688889 }, "The latest report!": { "path": "audio/voice/25ce63b5fdc527aa.mp3", "duration": 2.149161 }, "I can't make up my mind.": { "path": "audio/voice/24ef5844b8f5c1d4.mp3", "duration": 2.536009 }, "A pleasant dream": { "path": "audio/voice/1f30a02c6f7cb6a0.mp3", "duration": 2.079274 }, "football": { "path": "audio/voice/6382deaf1f5dc6e7.mp3", "duration": 1.700091 }, "pool": { "path": "audio/voice/27cac5503836765c.mp3", "duration": 1.504399 }, "win": { "path": "audio/voice/823a3180dad3c9c3.mp3", "duration": 1.554422 }, "world": { "path": "audio/voice/486ea46224d1bb4f.mp3", "duration": 1.574376 }, "depend": { "path": "audio/voice/d05c4354368a975e.mp3", "duration": 1.649388 }, "if": { "path": "audio/voice/935f68319d4f227e.mp3", "duration": 1.499456 }, "round": { "path": "audio/voice/a97b0931730e83fb.mp3", "duration": 1.574422 }, "Do you do the football pools, Harry?": { "path": "audio/voice/f43021d04c1786c8.mp3", "duration": 3.439048 }, "Yes, I do. Every week, but I never win anything.": { "path": "audio/voice/b521c1a9be2e07cf.mp3", "duration": 5.428934 }, "What will you do if you win a lot of money?": { "path": "audio/voice/2c929e630d29ad76.mp3", "duration": 2.973968 }, "If I win a lot of money I'll buy you a mink coat.": { "path": "audio/voice/257ca860a1ab123e.mp3", "duration": 3.624036 }, "I don't want a mink coat. I want to see the world.": { "path": "audio/voice/2514099f45fcb1b8.mp3", "duration": 4.593878 }, "All right. If we win a lot of money, we'll travel round the world and we'll stay at the best hotels. Then we'll return home and buy a big house in the country. We'll have a beautiful garden and…": { "path": "audio/voice/0ea841cf75a9b9bd.mp3", "duration": 13.362494 }, "But if we spend all that money we'll be poor again. What will we do then?": { "path": "audio/voice/057cdc4d5eba7beb.mp3", "duration": 5.348617 }, "If we spend all the money we'll try and win the football pools again!": { "path": "audio/voice/15b0522358015b0f.mp3", "duration": 4.54381 }, "If we win the football pools, we'll travel round the world.": { "path": "audio/voice/af1cb407a4b94848.mp3", "duration": 4.473741 }, "It's only a pleasant dream.": { "path": "audio/voice/f485f55c84f220f8.mp3", "duration": 2.524127 }, "If we win the pools, we'll travel round the world.": { "path": "audio/voice/be71c40ead723d16.mp3", "duration": 3.988889 }, "If we spend all the money we'll be poor again.": { "path": "audio/voice/6d6321389546da3a.mp3", "duration": 3.329025 }, "Is that you, John?": { "path": "audio/voice/98e705e361883ec5.mp3", "duration": 2.51932 }, "extra": { "path": "audio/voice/c8dee78f8c7b466c.mp3", "duration": 1.764399 }, "overseas": { "path": "audio/voice/4240e31b6a90fc54.mp3", "duration": 1.814286 }, "engineering": { "path": "audio/voice/8c85b6639e62e10b.mp3", "duration": 1.849252 }, "company": { "path": "audio/voice/f168ccdd91548c5a.mp3", "duration": 1.604399 }, "line": { "path": "audio/voice/38a9c1e721584da2.mp3", "duration": 1.55941 }, "speaking": { "path": "audio/voice/875c34e615c2d
