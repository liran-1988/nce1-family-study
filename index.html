ate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"I want some envelopes, please.","cn":"请给我拿几个信封。","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Do you want the large size or the small size?","cn":"您要大号的还是要小号的？","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The large size, please. And do you have any writing paper?","cn":"请拿大号的。你们有信纸吗？","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, we do. I don't have any small pads. I only have large ones. Do you want a pad?","cn":"有。我没有小本的信纸簿，只有大本的。您要一本吗？","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, please. And I want a bottle of glue.","cn":"好的，麻烦你。我还要一瓶胶水。","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"A bottle of glue.","cn":"一瓶胶水。","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"And I want a large box of chalk, too.","cn":"我还要一大盒粉笔。","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I only have small boxes. Do you want one?","cn":"我只有小盒的。您要一盒吗？","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, thank you.","cn":"不了，谢谢。","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Is that all?","cn":"就这些吗？","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"That's all, thank you.","cn":"就这些，谢谢。","source":"adaptation","pdfPage":121,"printedPage":117,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"购物：I want some…","chat":"买东西时说要什么：I want some envelopes, please.（请给我些信封）。店员问规格：the large size or the small size?（大的还是小的？）——or 连接的叫「选择疑问句」。买完说 That's all, thank you.","formula":"I want some…, please. ｜ A or B? （选哪个？）","examples":[{"en":"I want some envelopes, please.","cn":"我要买些信封。","source":"supplement"},{"en":"Do you want the large size or the small size?","cn":"您要大号的还是小号的？","source":"supplement"},{"en":"Is that all?","cn":"就这些吗？","source":"supplement"}],"watch":"选择疑问句不用 Yes/No 回答，直接选一个：The large size, please.！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":121,"printedPage":117,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"I want ___ envelopes, please.","opts":["some","any","a","an"],"a":"some","why":"肯定句用 some。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":121,"printedPage":117,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"Do you want the large size ___ the small size?","opts":["or","and","but","so"],"a":"or","why":"选择疑问句用 or。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":121,"printedPage":117,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"女士要的信封是什么规格？","opts":["大号","小号","两种都要","不要"],"a":"大号","hint":"The large size, please.","why":"选了大号。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":121,"printedPage":117,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"大盒粉笔她买到了吗？","opts":["没有，只有小盒","买到了","店里没粉笔","买了两盒"],"a":"没有，只有小盒","hint":"I only have small boxes.","why":"她回答 No, thank you.，所以小盒粉笔她没有买。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":121,"printedPage":117,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":60,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":59},{"id":61,"title":"A bad cold","titleCn":"重感冒","kind":"text","words":[{"en":"feel","ipa":"/fiːl/","cn":"v. 感觉","source":"supplement"},{"en":"look","ipa":"/lʊk/","cn":"v. 看起来（系动词）","source":"supplement"},{"en":"call","ipa":"/kɔːl/","cn":"v. 叫，请（医生）；打电话","source":"supplement"},{"en":"doctor","ipa":"/ˈdɒktə/","cn":"n. 医生","source":"supplement"},{"en":"telephone","ipa":"/ˈtelɪfəʊn/","cn":"v. 打电话；n. 电话","source":"supplement"},{"en":"remember","ipa":"/rɪˈmembə/","cn":"v. 记得，想起","source":"supplement"},{"en":"cold","ipa":"/kəʊld/","cn":"n. 感冒；adj. 冷的","source":"supplement"},{"en":"mouth","ipa":"/maʊθ/","cn":"n. 嘴","source":"supplement"},{"en":"tongue","ipa":"/tʌŋ/","cn":"n. 舌头","source":"supplement"},{"en":"news","ipa":"/njuːz/","cn":"n. 消息（不可数）","source":"supplement"}],"patterns":[{"en":"He feels ill.","cn":"他觉得不舒服。（feel 系动词）","source":"adaptation"},{"en":"We must call the doctor.","cn":"我们得去请医生。","source":"adaptation"},{"en":"He has a bad cold.","cn":"他得了重感冒。","source":"adaptation"}],"grammar":"feel / look 是系动词，后面接形容词：feel ill, look well；have a cold 感冒是固定搭配。","tip":"感冒了说 I have a cold.，重感冒 a bad cold；听到好消息说 That's good news（news 不可数，不加 s）。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":125,"printedPage":121,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Where's Jimmy?","cn":"吉米在哪儿？","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He's in bed.","cn":"他躺在床上。","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What's the matter with him?","cn":"他怎么啦？","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He feels ill. He looks ill.","cn":"他觉得不舒服。他看上去也确实病了。","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"We must call the doctor.","cn":"我们得去请医生。","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, we must.","cn":"是的，一定得请。","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Can you remember the doctor's telephone number?","cn":"你还记得医生的电话号码吗？","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes. It's 09754.","cn":"记得，是09754。","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Open your mouth, Jimmy. Show me your tongue. Say, “Ah”.","cn":"吉米，张开嘴，让我看看你的舌头。说“啊”。","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He has a bad cold, Mr. Williams, so he must stay in bed for a week.","cn":"威廉斯先生，他得了重感冒，因此他必须卧床一周。","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"That's good news for Jimmy.","cn":"对吉米来说，这可是个好消息。","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Good news? Why?","cn":"好消息？为什么？","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Because he doesn't like school!","cn":"因为他不喜欢上学！","source":"adaptation","pdfPage":125,"printedPage":121,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"系动词：feel 和 look","chat":"feel（感觉起来）和 look（看起来）是「系动词」，像小桥一样连接主语和形容词：He feels ill.（他觉得病了）He looks ill.（他看上去病了）。「感冒」是固定搭配 have a cold。","formula":"主语 + feel/look + 形容词 ｜ have a cold 感冒","examples":[{"en":"He feels ill. He looks ill.","cn":"他觉得不舒服，看上去也病了。","source":"supplement"},{"en":"We must call the doctor.","cn":"我们得请医生。","source":"supplement"},{"en":"He has a bad cold.","cn":"他得了重感冒。","source":"supplement"}],"watch":"系动词后面跟形容词，不跟副词：look well ✓（well 这里是「健康的」这个形容词）","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":125,"printedPage":121,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"He ___ ill.","opts":["feels","feel","feel to","is feel"],"a":"feels","why":"三单 feels；feel 是系动词。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":125,"printedPage":121,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"We must ___ the doctor.","opts":["call","calls","calling","called"],"a":"call","why":"must 后面跟动词原形。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":125,"printedPage":121,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"吉米怎么了？","opts":["重感冒","牙疼","摔伤了背","发烧"],"a":"重感冒","hint":"He has a bad cold.","why":"重感冒，要卧床一周。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":125,"printedPage":121,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"为什么说这对吉米是好消息？","opts":["因为他不喜欢上学","因为他喜欢医生","因为他能看电视","因为他有礼物"],"a":"因为他不喜欢上学","hint":"Because he doesn't like school!","why":"不用上学啦，当然是好消息！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":125,"printedPage":121,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":62,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":61},{"id":63,"title":"Thank you, doctor.","titleCn":"谢谢你，医生。","kind":"text","words":[{"en":"better","ipa":"/ˈbetə/","cn":"adj. 好些了（well 的比较级）","source":"supplement"},{"en":"certainly","ipa":"/ˈsɜːtnli/","cn":"adv. 当然","source":"supplement"},{"en":"get up","ipa":"/ɡet ʌp/","cn":"phr. 起床","source":"supplement"},{"en":"yet","ipa":"/jet/","cn":"adv. 还（用于否定句和疑问句）","source":"supplement"},{"en":"rich","ipa":"/rɪtʃ/","cn":"adj. 油腻的；富有的","source":"supplement"},{"en":"food","ipa":"/fuːd/","cn":"n. 食物","source":"supplement"},{"en":"play","ipa":"/pleɪ/","cn":"v. 玩，踢（球）","source":"supplement"},{"en":"match","ipa":"/mætʃ/","cn":"n. 比赛","source":"supplement"},{"en":"talk","ipa":"/tɔːk/","cn":"v. 谈话","source":"supplement"}],"patterns":[{"en":"How's Jimmy today?","cn":"吉米今天怎么样了？","source":"adaptation"},{"en":"Must he stay in bed?","cn":"他还必须卧床吗？","source":"adaptation"},{"en":"He mustn't get up yet.","cn":"他还不该起床。","source":"adaptation"}],"grammar":"mustn't 表示“禁止、千万别”，与 must（必须）对应；表示“不必”要用 needn't。","tip":"better 是 well（身体好）的比较级：I'm better now. 我现在好些了。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":129,"printedPage":125,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"How's Jimmy today?","cn":"吉米今天怎么样了？","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Better. Thank you, doctor.","cn":"好些了。谢谢您，医生。","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Can I see him please, Mrs. Williams?","cn":"威廉斯太太，我可以看看他吗？","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Certainly, doctor. Come upstairs.","cn":"当然可以，医生。上楼看看吧。","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"You look very well, Jimmy. You look better now, but you mustn't get up yet. You must stay in bed for another two days.","cn":"吉米，你看上去很好。你现在好些了，但你还不应该起床。你必须再卧床两天。","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The boy mustn't go to school yet, Mrs. Williams. And he mustn't eat rich food.","cn":"这孩子还不能去上学，威廉斯太太，而且他不能吃油腻的食物。","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Has he a temperature, doctor?","cn":"医生，他发烧吗？","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, he hasn't.","cn":"不，他不发烧。","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Must he stay in bed?","cn":"他还必须卧床吗？","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes. He must remain in bed for another two days. He can get up for about two hours each day, but you must keep the room warm.","cn":"是的，他还必须卧床两天。他每天可以起来两个小时左右，但您必须保持房间温暖。","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Where's Mr. Williams this evening?","cn":"威廉斯先生今晚在哪儿？","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He's in bed, doctor. Can you see him please? He has a bad cold, too!","cn":"他在床上呢，医生。您能去看看他吗？他也得了重感冒！","source":"adaptation","pdfPage":129,"printedPage":125,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"mustn't 不是「不必」！","chat":"must 表示「必须」。它的否定 mustn't 不是「不必」，而是「禁止、千万不要」！真正的「不必」是 needn't。这对孪生兄弟是考试最爱，千万别认错！","formula":"must = 必须 ｜ mustn't = 千万不要 ｜ needn't = 不必","examples":[{"en":"He mustn't get up yet.","cn":"他还不该起床。","source":"supplement"},{"en":"He mustn't eat rich food.","cn":"他不能吃油腻的食物。","source":"supplement"},{"en":"He must stay in bed for another two days.","cn":"他必须再卧床两天。","source":"supplement"}],"watch":"Must I…? 的否定回答是 No, you needn't.（你不必），说 No, you mustn't. 就变成「禁止」啦！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":129,"printedPage":125,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"He ___ get up yet.","opts":["mustn't","needn't","don't","doesn't"],"a":"mustn't","why":"「还不许起床」用 mustn't。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":129,"printedPage":125,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"He can get up ___ two hours each day.","opts":["for","since","at","on"],"a":"for","why":"for + 一段时间。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":129,"printedPage":125,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"吉米今天怎么样？","opts":["好些了","更糟了","还是病重","完全好了"],"a":"好些了","hint":"Better. Thank you, doctor.","why":"better = 好些了。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":129,"printedPage":125,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"威廉斯先生今晚在哪儿？","opts":["躺在床上","上班","在花园","在看医生"],"a":"躺在床上","hint":"He's in bed, doctor. He has a bad cold, too!","why":"他也得了重感冒——课文的大笑话！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":129,"printedPage":125,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":64,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":63},{"id":65,"title":"Not a baby","titleCn":"不是小孩子","kind":"text","words":[{"en":"key","ipa":"/kiː/","cn":"n. 钥匙","source":"supplement"},{"en":"baby","ipa":"/ˈbeɪbi/","cn":"n. 婴儿","source":"supplement"},{"en":"hear","ipa":"/hɪə/","cn":"v. 听见","source":"supplement"},{"en":"fun","ipa":"/fʌn/","cn":"n. 乐趣，有趣的事","source":"supplement"},{"en":"enjoy","ipa":"/ɪnˈdʒɔɪ/","cn":"v. 玩得快活","source":"supplement"},{"en":"yourself","ipa":"/jɔːˈself/","cn":"pron. 你自己（反身代词）","source":"supplement"},{"en":"ourselves","ipa":"/ˌaʊəˈselvz/","cn":"pron. 我们自己（反身代词）","source":"supplement"},{"en":"half","ipa":"/hɑːf/","cn":"n. 一半（half past ten 十点半）","source":"supplement"},{"en":"past","ipa":"/pɑːst/","cn":"prep. 过（几点）","source":"supplement"}],"patterns":[{"en":"Can I have the key to the front door, Dad?","cn":"爸爸，我能拿前门的钥匙吗？","source":"adaptation"},{"en":"You mustn't come home late.","cn":"你不许回来太晚。","source":"adaptation"},{"en":"Enjoy yourself!","cn":"玩得开心！","source":"adaptation"}],"grammar":"反身代词 yourself / ourselves；enjoy oneself = 玩得开心；时刻表达：half past ten 十点半，a quarter past ten 十点一刻。","tip":"key to the front door 用 to 不用 of；have fun = enjoy oneself = have a good time。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":133,"printedPage":129,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"What are you going to do this evening, Jill?","cn":"今晚你打算做什么，吉尔？","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm going to meet some friends, Dad.","cn":"我打算去看几个朋友，爸爸。","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"You mustn't come home late. You must be home at half past ten.","cn":"你不许回来太晚，你必须在十点半到家。","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I can't get home so early, Dad! Can I have the key to the front door, please?","cn":"可我到家不会那么早，爸爸！请把前门的钥匙给我行吗？","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, you can't.","cn":"不行，不能给你。","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Jill's eighteen years old, Tom. She's not a baby. Give her the key. She always comes home early.","cn":"吉尔都18岁了，汤姆，她不是小孩子了。把钥匙给她吧，她总是早早地回家的。","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Oh, all right!","cn":"哦，那好吧！","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Here you are. But you mustn't come home after a quarter past eleven. Do you hear?","cn":"给你。但你不许超过十一点一刻才回家，听见了吗？","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, Dad. Thanks, Mum.","cn":"听见了，爸爸。谢谢妈妈。","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"That's all right. Goodbye. Enjoy yourself!","cn":"不用谢。再见吧，好好玩！","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"We always enjoy ourselves, Mum. Bye-bye.","cn":"我们总是玩得很开心的，妈妈。再见。","source":"adaptation","pdfPage":133,"printedPage":129,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"反身代词与 half past","chat":"自己「玩得开心」是 enjoy oneself—— oneself 就是反身代词：yourself（你自己）、ourselves（我们自己）。说「几点半」用 half past + 数字：half past ten 十点半。","formula":"enjoy oneself = 玩得开心 ｜ half past + 数字 = ……点半","examples":[{"en":"Enjoy yourself!","cn":"玩得开心！","source":"supplement"},{"en":"We always enjoy ourselves.","cn":"我们总是玩得很开心。","source":"supplement"},{"en":"You must be home at half past ten.","cn":"你必须十点半到家。","source":"supplement"}],"watch":"门钥匙说 the key to the door——用 to 表示「配套的」，不用 of！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":133,"printedPage":129,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"Enjoy ___!","opts":["yourself","yours","herself","themselves"],"a":"yourself","why":"对吉尔一个人说，用 yourself。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":133,"printedPage":129,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"You must be home ___ half past ten.","opts":["at","in","on","by"],"a":"at","why":"几点几分前用 at。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":133,"printedPage":129,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"吉尔多少岁了？","opts":["18岁","8岁","80岁","10岁"],"a":"18岁","hint":"Jill's eighteen years old.","why":"所以妈妈说她不是小孩子了。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":133,"printedPage":129,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"吉尔向爸爸要什么？","opts":["前门的钥匙","一条新裙子","生日蛋糕","零花钱"],"a":"前门的钥匙","hint":"Can I have the key to the front door?","why":"晚归要开门，所以想要钥匙。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":133,"printedPage":129,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":66,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":65},{"id":67,"title":"The weekend","titleCn":"周末","kind":"text","words":[{"en":"absent","ipa":"/ˈæbsənt/","cn":"adj. 缺席的","source":"supplement"},{"en":"Monday","ipa":"/ˈmʌndi/","cn":"n. 星期一","source":"supplement"},{"en":"Tuesday","ipa":"/ˈtjuːzdi/","cn":"n. 星期二","source":"supplement"},{"en":"Wednesday","ipa":"/ˈwenzdi/","cn":"n. 星期三","source":"supplement"},{"en":"Friday","ipa":"/ˈfraɪdi/","cn":"n. 星期五","source":"supplement"},{"en":"Saturday","ipa":"/ˈsætədi/","cn":"n. 星期六","source":"supplement"},{"en":"Sunday","ipa":"/ˈsʌndi/","cn":"n. 星期日","source":"supplement"},{"en":"weekend","ipa":"/ˌwiːkˈend/","cn":"n. 周末","source":"supplement"},{"en":"keep","ipa":"/kiːp/","cn":"v. 保持","source":"supplement"},{"en":"spend","ipa":"/spend/","cn":"v. 度过；花费","source":"supplement"}],"patterns":[{"en":"Were you at the butcher's last Monday?","cn":"上星期一你去过肉店吗？","source":"adaptation"},{"en":"He was absent on Monday.","cn":"他星期一没来（缺席）。","source":"adaptation"},{"en":"How are you all keeping?","cn":"你们身体都好吗？","source":"adaptation"}],"grammar":"be 的过去式：was（单数）/ were（复数）；在具体某天用介词 on（on Monday）；last week 上周。","tip":"“在周末”英式说 at the weekend，美式说 on the weekend；spend the weekend 度周末。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":137,"printedPage":133,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Hello. Were you at the butcher's?","cn":"你好。刚才你在肉店里吗？","source":"adaptation","pdfPage":137,"printedPage":133,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I was. Were you at the butcher's, too?","cn":"是的，我在。你也在肉店里吗？","source":"adaptation","pdfPage":137,"printedPage":133,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, I wasn't. I was at the greengrocer's. How's Jimmy today?","cn":"不，我不在。我在蔬菜水果店里。吉米今天怎么样？","source":"adaptation","pdfPage":137,"printedPage":133,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He's very well, thank you.","cn":"他很好，谢谢。","source":"adaptation","pdfPage":137,"printedPage":133,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Was he absent from school last week?","cn":"上星期他没上学吧？","source":"adaptation","pdfPage":137,"printedPage":133,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, he was. He was absent on Monday, Tuesday, Wednesday and Thursday. How are you all keeping?","cn":"是的，他没上学。他星期一、星期二、星期三和星期四都没去上学。你们身体都好吗？","source":"adaptation","pdfPage":137,"printedPage":133,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Very well, thank you. We're going to spend three days in the country. We're going to stay at my mother's for the weekend.","cn":"都很好，谢谢。我们打算到乡下去三天，在我母亲家过周末。","source":"adaptation","pdfPage":137,"printedPage":133,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Friday, Saturday and Sunday in the country! Aren't you lucky!","cn":"星期五、星期六和星期日在乡下过！你们真幸运啊！","source":"adaptation","pdfPage":137,"printedPage":133,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"be 动词的过去式：was / were","chat":"说「过去」的事，be 动词要换衣服：am/is → was，are → were。星期几前面用 on：on Monday（在星期一）。看到 last week（上周）、yesterday（昨天），就要想到过去式！","formula":"I/he/she → was ｜ you/we/they → were ｜ on + 星期几","examples":[{"en":"Were you at the butcher's?","cn":"你刚才在肉店吗？","source":"supplement"},{"en":"He was absent on Monday.","cn":"他星期一缺席了。","source":"supplement"},{"en":"We're going to stay at my mother's for the weekend.","cn":"我们要去我妈妈家过周末。","source":"supplement"}],"watch":"my mother's 后面省略了 house：'s 也能代替「某人的家」哦！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":137,"printedPage":133,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"___ you at the butcher's?","opts":["Were","Was","Are","Is"],"a":"Were","why":"you 配 were。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":137,"printedPage":133,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"He was absent ___ Monday.","opts":["on","in","at","for"],"a":"on","why":"星期几前面用 on。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":137,"printedPage":133,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"第二个人刚才在哪儿？","opts":["蔬菜水果店","肉店","家里","学校"],"a":"蔬菜水果店","hint":"No, I wasn't. I was at the greengrocer's.","why":"第一位在肉店，第二位在蔬果店。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":137,"printedPage":133,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"他们打算在乡下待几天？","opts":["3天","一周","1天","一个月"],"a":"3天","hint":"We're going to spend three days in the country.","why":"周五、六、日三天。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":137,"printedPage":133,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":68,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":67},{"id":69,"title":"The car race","titleCn":"汽车比赛","kind":"text","words":[{"en":"race","ipa":"/reɪs/","cn":"n. 比赛，竞赛","source":"supplement"},{"en":"town","ipa":"/taʊn/","cn":"n. 城镇","source":"supplement"},{"en":"crowd","ipa":"/kraʊd/","cn":"n. 人群","source":"supplement"},{"en":"stand","ipa":"/stænd/","cn":"v. 站立；n. 看台","source":"supplement"},{"en":"exciting","ipa":"/ɪkˈsaɪtɪŋ/","cn":"adj. 激动人心的","source":"supplement"},{"en":"handsome","ipa":"/ˈhænsəm/","cn":"adj. 漂亮的（男子）","source":"supplement"},{"en":"finish","ipa":"/ˈfɪnɪʃ/","cn":"n. 结尾，终点；v. 完成","source":"supplement"},{"en":"winner","ipa":"/ˈwɪnə/","cn":"n. 获胜者","source":"supplement"},{"en":"hundred","ipa":"/ˈhʌndrəd/","cn":"num. 百","source":"supplement"},{"en":"year","ipa":"/jɪə/","cn":"n. 年","source":"supplement"}],"patterns":[{"en":"In 1995, there was a very big race.","cn":"1995年举行了一次盛大的比赛。","source":"textbook","pdfPage":141,"printedPage":137,"verification":"verified","translationSource":"supplement"},{"en":"There were hundreds of people there.","cn":"那里有成百上千的人。","source":"textbook","pdfPage":141,"printedPage":137,"verification":"verified","translationSource":"supplement"},{"en":"The winner was Billy Stewart.","cn":"获胜者是比利·斯图尔特。","source":"textbook","pdfPage":141,"printedPage":137,"verification":"verified","translationSource":"supplement"}],"grammar":"there was / there were 是 there is / there are 的过去式；hundreds of 表示“成百上千”（不确指数字时用复数 + of）。","tip":"exciting 形容事物“令人激动”，excited 形容人“感到激动”——Lesson 141 还会遇到。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":141,"printedPage":137,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}],"teachingSource":"supplement","text":[{"en":"There is a car race near our town every year.","cn":"我们镇子附近每年都有一场汽车比赛。","source":"textbook","pdfPage":141,"printedPage":137,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"In 1995, there was a very big race.","cn":"1995年举行了一次盛大的比赛。","source":"textbook","pdfPage":141,"printedPage":137,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"There were hundreds of people there.","cn":"那里有成百上千的人。","source":"textbook","pdfPage":141,"printedPage":137,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"My wife and I were at the race. Our friends Julie and Jack were there, too.","cn":"我和我妻子也去了赛场，我们的朋友朱莉和杰克也去了。","source":"textbook","pdfPage":141,"printedPage":137,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"You can see us in the crowd. We are standing on the left.","cn":"你可以在人群中看到我们。我们站在照片的左边。","source":"textbook","pdfPage":141,"printedPage":137,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"There were twenty cars in the race. There were English cars, French cars, German cars, Italian cars, American cars and Japanese cars.","cn":"参加比赛的有20辆汽车，有英国、法国、德国、意大利、美国和日本的汽车。","source":"textbook","pdfPage":141,"printedPage":137,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It was an exciting finish. The winner was Billy Stewart.","cn":"比赛的结尾是激动人心的，获胜者是比利·斯图尔特。","source":"textbook","pdfPage":141,"printedPage":137,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"He was in car number fifteen. Five other cars were just behind him.","cn":"他在第15号车里，其他5辆汽车紧随其后。","source":"textbook","pdfPage":141,"printedPage":137,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"On the way home, my wife said to me, “Don't drive so quickly! You're not Billy Stewart!”","cn":"回家的路上，妻子对我说：“别开这么快！你可不是比利·斯图尔特！”","source":"textbook","pdfPage":141,"printedPage":137,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"}],"teach":{"title":"there was / there were","chat":"过去「存在有」，There is/are 也要换过去式：There was（过去有一个）、There were（过去有一些）。hundred 前有具体数字不加 s：five hundred；不确指时才说 hundreds of（成百上千）。","formula":"There was + 单数 ／ There were + 复数（过去有……）","examples":[{"en":"There was a very big race in 1995.","cn":"1995年有一场盛大的比赛。","source":"supplement"},{"en":"There were hundreds of people there.","cn":"那里有成百上千的人。","source":"supplement"},{"en":"There were twenty cars in the race.","cn":"比赛有20辆车。","source":"supplement"}],"watch":"exciting 形容事物「令人激动」：an exciting finish 激动人心的结尾！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":141,"printedPage":137,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},"ex":{"g":[{"q":"In 1995, there ___ hundreds of people there.","opts":["were","was","is","are"],"a":"were","why":"In 1995 指过去；people 是复数，所以用 were。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":141,"printedPage":137,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""},{"q":"In 1995, the winner ___ Billy Stewart.","opts":["was","were","is","are"],"a":"was","why":"In 1995 指过去；the winner 是单数，所以用 was。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":141,"printedPage":137,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""}],"c":[{"q":"获胜的车是几号车？","opts":["15号","5号","50号","14号"],"a":"15号","hint":"He was in car number fifteen.","why":"比利·斯图尔特驾驶15号车。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":141,"printedPage":137,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},{"q":"回家路上妻子提醒丈夫什么？","opts":["别开太快","开快一点","走路回家","加油加满"],"a":"别开太快","hint":"Don't drive so quickly! You're not Billy Stewart!","why":"妻子说 Don’t drive so quickly!，提醒丈夫别开这么快；课文没有提供限速或超速证据。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":141,"printedPage":137,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}}]}},{"id":70,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":69},{"id":71,"title":"He's awful!","titleCn":"他讨厌透了！","kind":"text","words":[{"en":"awful","ipa":"/ˈɔːfʊl/","cn":"adj. 讨厌的，糟糕的","source":"supplement"},{"en":"time","ipa":"/taɪm/","cn":"n. 次（数）；时间","source":"supplement"},{"en":"answer","ipa":"/ˈɑːnsə/","cn":"v. 接（电话）；回答","source":"supplement"},{"en":"last","ipa":"/lɑːst/","cn":"adj. 上一个的，最后的","source":"supplement"},{"en":"phone","ipa":"/fəʊn/","cn":"n. 电话（telephone 的缩略）","source":"supplement"},{"en":"again","ipa":"/əˈɡen/","cn":"adv. 又一次，再一次","source":"supplement"},{"en":"say","ipa":"/seɪ/","cn":"v. 说","source":"supplement"},{"en":"yesterday","ipa":"/ˈjestədi/","cn":"adv. 昨天","source":"supplement"}],"patterns":[{"en":"What's Ron Marston like, Pauline?","cn":"罗恩·马斯顿是个怎样的人，波琳？","source":"textbook","pdfPage":145,"printedPage":141,"verification":"verified","translationSource":"supplement"},{"en":"He telephoned me four times yesterday.","cn":"他昨天给我打了四次电话。","source":"adaptation"},{"en":"Did he telephone again?","cn":"他又打电话了吗？","source":"textbook","pdfPage":145,"printedPage":141,"verification":"verified","translationSource":"supplement"}],"grammar":"规则动词过去式加 -ed：telephoned, answered；次数表达：一次 once，两次 twice，三次以上 数字 + times。","tip":"过去时疑问句用 did 提问、动词还原：Did he telephone? 不能说 Did he telephoned?","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":145,"printedPage":141,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}],"teachingSource":"supplement","text":[{"en":"What's Ron Marston like, Pauline?","cn":"罗恩·马斯顿是个怎样的人，波琳？","speaker":"JANE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"He's awful!","cn":"他讨厌透了！","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"He telephoned me four times yesterday, and three times the day before yesterday.","cn":"他昨天给我打了四次电话，前天打了三次。","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"He telephoned the office yesterday morning and yesterday afternoon.","cn":"他昨天上午和下午都打电话到办公室。","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"My boss answered the telephone.","cn":"我的老板接了电话。","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"What did your boss say to him?","cn":"你老板对他说了什么？","speaker":"JANE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"He said, 'Pauline is typing letters. She can't speak to you now!'","cn":"他说：‘波琳正在打信，她现在不能和你讲话！’","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Then I arrived home at six o'clock yesterday evening.","cn":"后来，我昨天傍晚六点到家。","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"He telephoned again.","cn":"他又打来了电话。","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"But I didn't answer the phone!","cn":"但我没接电话！","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Did he telephone again last night?","cn":"他昨晚又打电话了吗？","speaker":"JANE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Yes, he did.","cn":"是的。","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"He telephoned at nine o'clock.","cn":"他九点钟打来的。","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"What did you say to him?","cn":"你对他说了什么？","speaker":"JANE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I said, 'This is Pauline's mother. Please don't telephone my daughter again!'","cn":"我说：‘我是波琳的母亲，请不要再给我女儿打电话了！’","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Did he telephone again?","cn":"他又打电话了吗？","speaker":"JANE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"No, he didn't!","cn":"不，他没有！","speaker":"PAULINE","pdfPage":145,"printedPage":141,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"}],"teach":{"title":"动词过去式：加 ed","chat":"规则动词的过去式直接加 ed：telephoned、answered、typed。说「几次」用 times：一次 once、两次 twice、四次 four times。问过去的事用 did 开头，后面的动词变回原形！","formula":"动词 + ed = 过去式 ｜ once 一次 → twice 两次 → …times","examples":[{"en":"He telephoned me four times yesterday.","cn":"他昨天给我打了4次电话。","source":"supplement"},{"en":"My boss answered the telephone.","cn":"我老板接了电话。","source":"supplement"},{"en":"Did he telephone again?","cn":"他又打电话了吗？","source":"supplement"}],"watch":"did 后面的动词要「脱掉」ed 变回原形：Did he telephoned ❌ → Did he telephone ✓！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":145,"printedPage":141,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}},"ex":{"g":[{"q":"He telephoned me four ___ yesterday.","opts":["times","time","some time","timing"],"a":"times","why":"四次 = four times。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":145,"printedPage":141,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"},"hint":""},{"q":"Did he ___ again?","opts":["telephone","telephoned","telephones","telephoning"],"a":"telephone","why":"did 后面动词用原形。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":145,"printedPage":141,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"},"hint":""}],"c":[{"q":"根据课文，罗恩前天给波琳打了几次电话？","opts":["3次","4次","2次","1次"],"a":"3次","hint":"three times the day before yesterday","why":"昨天4次，前天3次。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":145,"printedPage":141,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}},{"q":"办公室里是谁接的电话？","opts":["老板","波琳","简","罗恩"],"a":"老板","hint":"My boss answered the telephone.","why":"波琳说 My boss answered the telephone.；老板告诉罗恩，波琳正在打信。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":145,"printedPage":141,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}}]}},{"id":72,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":71},{"id":73,"title":"The way to King Street","titleCn":"到国王街的走法","kind":"text","words":[{"en":"week","ipa":"/wiːk/","cn":"n. 星期，周","source":"supplement"},{"en":"London","ipa":"/ˈlʌndən/","cn":"n. 伦敦","source":"supplement"},{"en":"suddenly","ipa":"/ˈsʌdnli/","cn":"adv. 突然地","source":"supplement"},{"en":"smile","ipa":"/smaɪl/","cn":"v. 微笑","source":"supplement"},{"en":"pleasantly","ipa":"/ˈplezntli/","cn":"adv. 愉快地","source":"supplement"},{"en":"understand","ipa":"/ˌʌndəˈstænd/","cn":"v. 懂，理解","source":"supplement"},{"en":"speak","ipa":"/spiːk/","cn":"v. 讲（语言），说话","source":"supplement"},{"en":"pocket","ipa":"/ˈpɒkɪt/","cn":"n. 衣袋","source":"supplement"},{"en":"phrasebook","ipa":"/ˈfreɪzbʊk/","cn":"n. 短语手册，常用语手册","source":"supplement"},{"en":"slowly","ipa":"/ˈsləʊli/","cn":"adv. 缓慢地","source":"supplement"}],"patterns":[{"en":"Last week Mrs. Mills went to London.","cn":"上星期米尔斯夫人去了伦敦。","source":"adaptation"},{"en":"She lost her way.","cn":"她迷路了。","source":"adaptation"},{"en":"Can you tell me the way to King Street, please?","cn":"请问到国王街怎么走？","source":"adaptation"}],"grammar":"不规则动词过去式：go→went, lose→lost, see→saw, speak→spoke, take→took；the way to... 表示“去……的路”。","tip":"问路句型：Can you tell me the way to...? / How can I get to...?；副词多由形容词加 -ly 构成：slow→slowly。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":153,"printedPage":149,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Last week Mrs. Mills went to London. She does not know London very well, and she lost her way.","cn":"上星期米尔斯夫人去了伦敦。她对伦敦不很熟悉，因此迷了路。","source":"adaptation","pdfPage":153,"printedPage":149,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Suddenly, she saw a man near a bus stop. “I can ask him the way,” she said to herself.","cn":"突然，她在公共汽车站附近看到一个男人。“我可以向他问路，”她想。","source":"adaptation","pdfPage":153,"printedPage":149,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“Excuse me,” she said. “Can you tell me the way to King Street, please?”","cn":"“对不起，”她说，“您能告诉我到国王街怎么走吗？”","source":"adaptation","pdfPage":153,"printedPage":149,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The man smiled pleasantly. He did not understand English! He spoke German. He was a tourist.","cn":"这人友好地笑了笑。他不懂英语！他讲德语，他是个游客。","source":"adaptation","pdfPage":153,"printedPage":149,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Then he put his hand into his pocket, and took out a phrasebook.","cn":"然后他把手伸进了衣袋，掏出了一本常用语手册。","source":"adaptation","pdfPage":153,"printedPage":149,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He opened the book and found a phrase. He read the phrase slowly.","cn":"他翻开书找到了一条短语，他缓慢地读着这条短语。","source":"adaptation","pdfPage":153,"printedPage":149,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“I am sorry,” he said. “I do not speak English.”","cn":"“很抱歉，”他说，“我不会讲英语。”","source":"adaptation","pdfPage":153,"printedPage":149,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"不规则动词家族","chat":"英语有一批「不规则动词」，过去式要单独记，像记名字一样：go→went、lose→lost、see→saw、speak→spoke、take→took。问路句型 Can you tell me the way to…? 也超实用！","formula":"go→went ｜ lose→lost ｜ see→saw ｜ speak→spoke ｜ take→took","examples":[{"en":"Last week Mrs. Mills went to Lond :"adaptation","pdfPage":161,"printedPage":157,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"That's very late. Can't the dentist see me now?","cn":"那就太晚了。牙医现在就不能看一下吗？","source":"adaptation","pdfPage":161,"printedPage":157,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm afraid that he can't, Mr. Croft. Can't you wait till this afternoon?","cn":"恐怕不行，克罗夫特先生。您就不能等到今天下午吗？","source":"adaptation","pdfPage":161,"printedPage":157,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I can wait, but my toothache can't!","cn":"我可以等，可我的牙痛等不了啊！","source":"adaptation","pdfPage":161,"printedPage":157,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"否定疑问句的语气","chat":"Can't you…? 是否定疑问句，带着「你就不能……吗？」的语气（有点不耐烦或惊讶）。till = until，表示「直到……」。看病先问：Do you have an appointment?（您预约了吗？）","formula":"Can't you + 动词…? （你就不能……吗？）｜ wait till… 等到……","examples":[{"en":"Do you have an appointment?","cn":"您预约了吗？","source":"supplement"},{"en":"Is it urgent?","cn":"急吗？","source":"supplement"},{"en":"Can't you wait till this afternoon?","cn":"您就不能等到今天下午吗？","source":"supplement"}],"watch":"牙疼是 have a toothache；看牙医是 see the dentist——两个固定搭配一起记！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":161,"printedPage":157,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"Do you have an ___?","opts":["appointment","urgent","till","dentist"],"a":"appointment","why":"have an appointment 有预约。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":161,"printedPage":157,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"Can't you wait ___ this afternoo ek.","cn":"这里期我们需要很多东西。","source":"adaptation"},{"en":"I hope you've got some money.","cn":"我希望你带了钱。","source":"adaptation"}],"grammar":"need 后接名词或 to do；a lot of + 复数或不可数名词；have got = have（英式口语）：We haven't got much tea.","tip":"go shopping 去购物；money 不可数——much money / a lot of money，不能说 many moneys。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":165,"printedPage":161,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"I'm making a shopping list, Tom.","cn":"我在拟一张购物单，汤姆。","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What do we need?","cn":"我们需要买些什么？","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"We need a lot of things this week.","cn":"这里期我们需要很多东西。","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I must go to the grocer's. We haven't got much tea or coffee, and we haven't got any sugar or jam.","cn":"我得到食品店去一趟。我们的茶叶和咖啡不多了，糖和果酱也没有了。","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What about vegetables?","cn":"蔬菜呢？","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I must go to the greengrocer's. We haven't got many tomatoes, but we've got a lot of potatoes.","cn":"我也得到蔬菜水果店去一趟。我们的西红柿不多了，但土豆还有不少。","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I must go to the butcher's, too. We need some meat. We haven't got any meat at all.","cn":"我还要到肉店去一下。我们需要些肉，我们一点肉也没有了。","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Have we got any beer and wine?","cn":"我们还有啤酒和果酒吗？","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, we haven't. And I'm not going to get any!","cn":"没有了。不过，我也不打算去买！","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I hope that you've got some money.","cn":"我希望你带钱了。","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I haven't got much.","cn":"我的钱不多。","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Well, I haven't got much either!","cn":"唉，我的钱也不多！","source":"adaptation","pdfPage":165,"printedPage":161,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"have got 与 much/many","chat":"have got 就是 have 的口语版：We haven't got much tea.（我们的茶不多了）。量词怎么选？much 配「数不清」的（much money），many 配「数得清」的（many eggs），a lot of 两者通吃！","formula":"haven't got = don't have ｜ much + 不可数 ／ many + 可数 ／ a lot of 都可以","examples":[{"en":"We haven't got much tea or coffee.","cn":"我们的茶和咖啡不多了。","source":"supplement"},{"en":"We need a lot of things this week.","cn":"这里期我们需要很多东西。","source":"supplement"},{"en":"Have we got any beer and wine?","cn":"我们还有啤酒和果酒吗？","source":"supplement"}],"watch":"money 数不清：much money ✓ many money ❌！tomatoes 数得清：many tomatoes ✓","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":165,"printedPage":161,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"We haven't got ___ tea.","opts":["much","many","a lot","lot"],"a":"much","why":"tea 不可数，用 much。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":165,"printedPage":161,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"We haven't got ___ tomatoes.","opts":["many","much","much of","a lot"],"a":"many","why":"tomatoes 可数，用 many。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":165,"printedPage":161,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"卡罗尔正在写什么？","opts":["购物单","一封信","一张贺卡","菜单"],"a":"购物单","hint":"I'm making a shopping list.","why":"本周要买很多东西。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":165,"printedPage":161,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"他们还有啤酒吗？","opts":["没有了，也不打算买","还有很多","只剩一点","汤姆去买"],"a":"没有了，也不打算买","hint":"And I'm not going to get any!","why":"卡罗尔赌气说不去买。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":165,"printedPage":161,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":80,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":79},{"id":81,"title":"Roast beef and potatoes","titleCn":"烤牛肉和土豆","kind":"text","words":[{"en":"bath","ipa":"/bɑːθ/","cn":"n. 洗澡（have a bath）；浴缸","source":"supplement"},{"en":"nearly","ipa":"/ˈnɪəli/","cn":"adv. 几乎，差不多","source":"supplement"},{"en":"ready","ipa":"/ˈredi/","cn":"adj. 准备好的","source":"supplement"},{"en":"dinner","ipa":"/ˈdɪnə/","cn":"n. 正餐，晚餐","source":"supplement"},{"en":"restaurant","ipa":"/ˈrestrɒnt/","cn":"n. 餐馆","source":"supplement"},{"en":"roast","ipa":"/rəʊst/","cn":"adj. 烤的","source":"supplement"},{"en":"breakfast","ipa":"/ˈbrekfəst/","cn":"n. 早饭","source":"supplement"},{"en":"haircut","ipa":"/ˈheəkʌt/","cn":"n. 理发","source":"supplement"},{"en":"party","ipa":"/ˈpɑːti/","cn":"n. 聚会","source":"supplement"}],"patterns":[{"en":"Where's Tom? He's having a bath.","cn":"汤姆在哪儿？他在洗澡。","source":"adaptation"},{"en":"We had roast beef and potatoes.","cn":"我们吃了烤牛肉和土豆。","source":"adaptation"},{"en":"What did you have for lunch?","cn":"你们午饭吃了什么？","source":"adaptation"}],"grammar":"have + 名词 = 做某事：have a bath 洗澡 / have lunch 吃饭 / have a haircut 理发；have 的过去式是 had。","tip":"这里的 have 表示“从事、进行”而不是“拥有”，所以能有进行时：He's having a bath.","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":169,"printedPage":165,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Hi, Carol! Where's Tom?","cn":"嗨，卡罗尔！汤姆在哪儿？","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He's upstairs. He's having a bath.","cn":"他在楼上，他正在洗澡。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Tom!","cn":"汤姆！","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes?","cn":"什么事？","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Sam's here.","cn":"萨姆来了。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm nearly ready.","cn":"我就好。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Hello, Sam. Have a cigarette.","cn":"你好，萨姆。请抽烟。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, thanks, Tom.","cn":"不抽了，谢谢，汤姆。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Have a glass of whisky then.","cn":"那么，来杯威士忌吧。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"OK. Thanks.","cn":"好的，谢谢。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Is dinner ready, Carol?","cn":"卡罗尔，饭好了吗？","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"It's nearly ready. We can have dinner at seven o'clock.","cn":"马上就好。7点钟我们可以吃饭。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Sam and I had lunch together today. We went to a restaurant.","cn":"今天我和萨姆一起吃的午饭，我们去了一家餐馆。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What did you have?","cn":"你们吃的什么？","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"We had roast beef and potatoes.","cn":"我们吃的是烤牛肉和土豆。","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Oh!","cn":"噢！","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What's the matter, Carol?","cn":"怎么了，卡罗尔？","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Well, you're going to have roast beef and potatoes again tonight!","cn":"唉，今晚你们又要吃烤牛肉和土豆了！","source":"adaptation","pdfPage":169,"printedPage":165,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"have 不只是「有」","chat":"have + 名词 = 「做某件事」：have a bath 洗澡、have lunch 吃午饭、have a haircut 理发。因为是「做事」，它能用进行时：He's having a bath.（他正在洗澡）。have 的过去式是 had！","formula":"have a bath / have lunch / have a haircut ｜ What did you have?（你们吃了什么？）","examples":[{"en":"He's upstairs. He's having a bath.","cn":"他在楼上洗澡呢。","source":"supplement"},{"en":"What did you have for lunch?","cn":"你们午饭吃了什么？","source":"supplement"},{"en":"We had roast beef and potatoes.","cn":"我们吃了烤牛肉和土豆。","source":"supplement"}],"watch":"问句里已经有 did，动词用原形：What did you had ❌ → What did you have ✓！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":169,"printedPage":165,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"He's ___ a bath.","opts":["having","have","has","had"],"a":"having","why":"现在进行时 be + having。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":169,"printedPage":165,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"What did you ___ for lunch?","opts":["have","had","has","having"],"a":"have","why":"did 后面用动词原形。","source":"supplement","basedOn":{"sou 3,"printedPage":169,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Hello, Sam. Come in.","cn":"你好，萨姆，进来吧。","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Hi, Sam. We're having lunch. Do you want to have lunch with us?","cn":"嗨，萨姆。我们正在吃午饭，你跟我们一起吃好吗？","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, thank you, Tom. I've already had lunch. I had lunch at half past twelve.","cn":"不，汤姆，谢谢。我已经吃过午饭了。我在12点半吃的。","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Have a cup of coffee then.","cn":"那么喝杯咖啡吧。","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I've just had a cup, thank you. I had one after my lunch.","cn":"我刚喝了一杯，谢谢。我吃完午饭就喝了一杯。","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Let's go into the living room, Carol. We can have our coffee there.","cn":"我们到客厅去，卡罗尔，我们可以在那里喝咖啡。","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Excuse the mess, Sam. This room's very untidy. We're packing our suitcases. We're going to leave tomorrow. Tom and I are going to have a holiday.","cn":"屋子很乱，请原谅，萨姆。房间里乱七八糟。我们正在收拾手提箱，明天我们就要走了。我和汤姆准备去度假。","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Aren't you lucky!","cn":"你们真幸运啊！","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"When are you going to have a holiday, Sam?","cn":"萨姆，你打算什么时候度假？","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I don't know. I've already had my holiday this year.","cn":"我不知道。今年我已经度过假了。","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Where did you go?","cn":"你去了哪儿？","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I stayed at home!","cn":"我呆在家里！","source":"adaptation","pdfPage":173,"printedPage":169,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"现在完成时登场","chat":"现在完成时 = have/has + 过去分词，表示「已经做完，跟现在有关系」。already（已经）放在句中；yet（还）放在句尾，只出现在疑问句和否定句里。","formula":"主语 + have/has + 过去分词 ｜ Have you…yet? → I've already…","examples":[{"en":"Have you packed your suitcase yet?","cn":"你行李箱收拾好了吗？","source":"supplement"},{"en":"I've already packed it.","cn":"我已经收拾好了。","source":"supplement"},{"en":"I've just had a cup of coffee.","cn":"我刚喝了一杯咖啡。","source":"supplement"}],"watch":"pack→packed，have→had；go 的过去分词是 gone：be→was/were→been。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":173,"printedPage":169,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"Have you packed your suitcase ___?","opts":["yet","already","just","still"],"a":"yet","why":"疑问句句尾用 yet。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":173,"printedPage":169,"status":"candidate","verified":fals 来），have gone to 去了（还没回来）；ever / never 用于完成时谈论经历。","tip":"谈“去过某地”的经历用完成时：Have you ever been to Paris?；What's on? 问“上演什么”。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":177,"printedPage":173,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Have you just been to the cinema?","cn":"你刚去过电影院吗？","source":"adaptation","pdfPage":177,"printedPage":173,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I have.","cn":"是的，我刚去过。","source":"adaptation","pdfPage":177,"printedPage":173,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What's on?","cn":"上映什么片子？","source":"adaptation","pdfPage":177,"printedPage":173,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“Paris in the Spring”.","cn":"《巴黎之春》。","source":"adaptation","pdfPage":177,"printedPage":173,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Oh, I've already seen it. I saw it on television last year. It's an old film, but it's very good.","cn":"噢，我已经看过了。我是去年在电视上看的。这是老片子，但影片很好。","source":"adaptation","pdfPage":177,"printedPage":173,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Paris is a beautiful city.","cn":"巴黎是座美丽的城市。","source":"adaptation","pdfPage":177,"printedPage":173,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I've never been there. Have you ever been there, Ken?","cn":"我从未去过。肯，你去过吗？","source":"adaptation","pdfPage":177,"printedPage":173,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I have. I was there in April.","cn":"去过，我是4月份去的。","source":"adaptation","p
