<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="新概念英语第一册 144 课在线学习手册：重点词汇、核心句型、语法要点，离线可用">
<title>新概念英语 · 家庭离线学习</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f6ef7">
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#25314d; --muted:#7a8699; --line:#e6e9f2;
  --brand:#4f6ef7; --brand-2:#8f5bf7; --ok:#22c07a; --warn:#f59e0b; --drill:#9aa5b8;
  --radius:14px; --shadow:0 6px 24px rgba(37,49,77,.08);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151f; --card:#1b2030; --ink:#e8ecf5; --muted:#8b95a9; --line:#2a3145;
    --drill:#6b7488; --shadow:0 6px 24px rgba(0,0,0,.35); }
}
html[data-theme="dark"]{ --bg:#12151f; --card:#1b2030; --ink:#e8ecf5; --muted:#8b95a9; --line:#2a3145; --drill:#6b7488; --shadow:0 6px 24px rgba(0,0,0,.35); }
html[data-theme="light"]{ --bg:#f6f7fb; --card:#ffffff; --ink:#25314d; --muted:#7a8699; --line:#e6e9f2; --drill:#9aa5b8; --shadow:0 6px 24px rgba(37,49,77,.08); }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;white-space:nowrap;font-size:17px}
.brand .sub{font-weight:400;color:var(--muted);font-size:12px}
#search{flex:1;min-width:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none;transition:.2s}
#search:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,110,247,.15)}
#jumpForm{display:flex;gap:4px}
#jumpNo{width:62px;padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none;text-align:center}
#jumpNo:focus{border-color:var(--brand)}
.icon-btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:17px;display:flex;align-items:center;justify-content:center}
#menuBtn{display:none}

/* ===== 布局 ===== */
.layout{display:flex;align-items:stretch}
#nav{width:270px;flex:none;position:sticky;top:59px;height:calc(100vh - 59px);overflow-y:auto;padding:10px 10px 48px;border-right:1px solid var(--line);background:var(--card)}
#view{flex:1;min-width:0;padding:22px 18px 90px}
#view article{max-width:860px;margin:0 auto}
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:30;opacity:0;pointer-events:none;transition:.25s}
.scrim.show{opacity:1;pointer-events:auto}

/* ===== 课程导航 ===== */
.nav-sep{margin:12px 6px 6px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px}
.nav-count{font-size:12px;color:var(--muted);padding:6px 8px}
.nav-empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:2}
.nav-item{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;margin-bottom:2px;transition:.15s}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.nav-item .no{flex:none;min-width:32px;text-align:center;font-size:12px;font-weight:700;color:var(--brand);background:rgba(79,110,247,.12);border-radius:8px;padding:2px 4px}
.nav-item.drill .no{color:var(--muted);background:var(--bg)}
.nav-item.active .no{color:#fff;background:rgba(255,255,255,.22)}
.nav-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.nav-item .t i{display:block;font-style:normal;color:var(--muted);font-size:11px}
.nav-item.active .t i{color:rgba(255,255,255,.75)}
.nav-item.drill .t{color:var(--muted);font-size:13px}
.nav-item .tick{color:var(--ok);font-weight:800}
.nav-item.active .tick{color:#fff}

/* ===== 课程页 ===== */
.l-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;padding:4px 14px;border-radius:999px;font-size:14px;letter-spacing:.5px}
.chip{font-size:12px;color:var(--brand);border:1px solid currentColor;padding:1px 9px;border-radius:999px}
.chip.drill-chip{color:var(--drill)}
.l-head h1{font-size:clamp(22px,4vw,30px);margin:12px 0 2px;line-height:1.3}
.l-head .sub{margin:0;color:var(--muted);font-size:15px}
.l-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sec{margin-top:28px}
.sec h2{font-size:17px;margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
.sec h2 small{font-weight:400;color:var(--muted);font-size:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.sec-head h2{margin:0}
.note{border-radius:var(--radius);padding:14px 16px;font-size:15px;line-height:1.9}
.note.grammar{background:rgba(79,110,247,.08);border-left:4px solid var(--brand)}
.note.tip{background:rgba(245,158,11,.12);border-left:4px solid var(--warn)}
.note.drill-note{background:var(--card);border:1px dashed var(--drill);color:var(--muted)}
.l-foot{display:flex;justify-content:space-between;gap:10px;margin-top:36px;flex-wrap:wrap}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:999px;transition:.2s;user-select:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:none}
.btn.brand{background:linear-gradient(135deg,var(--brand),var(--brand-2));border:none;color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.tiny{padding:4px 10px;font-size:12px}
.btn.big{padding:12px 22px;font-size:16px}

/* ===== 词汇翻转卡 ===== */
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.word-card{position:relative;perspective:800px;height:98px;cursor:pointer}
.w-inner{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.word-card.flipped .w-inner{transform:rotateY(180deg)}
.w-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;box-shadow:var(--shadow)}
.w-front{background:var(--card);border:1px solid var(--line)}
.w-front b{font-size:17px}
.w-front .ipa{color:var(--muted);font-size:12px;margin-top:2px}
.w-front .flip-hint{position:absolute;bottom:7px;font-size:10px;color:var(--muted);opacity:.7;font-style:normal}
.w-back{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;transform:rotateY(180deg);font-size:14px;text-align:center}
.w-actions{position:absolute;top:4px;left:5px;right:5px;display:flex;justify-content:space-between;z-index:2}
.w-btn{border:none;background:transparent;font-size:14px;padding:2px 5px;border-radius:6px;filter:grayscale(1);opacity:.55;transition:.15s}
.w-btn:hover{opacity:1;filter:none;background:var(--bg)}
.w-btn.star.on{filter:none;opacity:1}

/* ===== 句型卡 ===== */
.pat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.p-en{font-size:16.5px;font-weight:600;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-cn{margin:6px 0 0;color:var(--muted);font-size:14px;transition:.2s;cursor:pointer}
.p-cn.blurred{filter:blur(6px);cursor:pointer;user-select:none}
.p-cn.blurred:hover{filter:blur(4px)}
.p-cn.reveal{filter:none}

/* ===== 课文原文 ===== */
.text-box{display:flex;flex-direction:column;gap:8px}
.text-line{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.text-line:hover{border-color:var(--brand)}
.tl-en{margin:0;font-size:15.5px;line-height:1.7;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tl-cn{margin:6px 0 0;color:var(--muted);font-size:14px;display:none}
.text-line.show .tl-cn{display:block}
/* ===== 错题本 ===== */
.mist-item{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.m-main{flex:1;min-width:0}
.m-main b{font-size:16px}
.m-main span{display:block;color:var(--muted);font-size:13px}
.m-main i{color:var(--brand);font-size:11px;font-style:normal}
.m-side{display:flex;align-items:center;gap:2px;flex:none}
.dots{display:flex;gap:3px;margin-right:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.mcount{background:var(--warn);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:auto}
.mist-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);border-radius:var(--radius);padding:14px 18px;font-size:14.5px;color:var(--ink)}
/* ===== 提示气泡 ===== */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:60;box-shadow:var(--shadow);pointer-events:none;font-size:14px;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ===== 老师讲语法 ===== */
.teach-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.t-chat{margin:0;font-size:15.5px;line-height:2}
.t-chat::before{content:"👩‍🏫 "}
.t-formula{margin:12px 0;padding:10px 14px;background:rgba(79,110,247,.08);border:1.5px dashed var(--brand);border-radius:10px;font-weight:600;color:var(--brand);font-size:14.5px;line-height:1.9}
.t-ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:.15s}
.t-ex:hover{background:var(--bg)}
.t-ex .e-en{font-weight:600;font-size:15px}
.t-ex .e-cn{color:var(--muted);font-size:13px;text-align:right}
.t-ex .e-say{flex:none;opacity:.55}
.t-watch{margin-top:10px;padding:10px 14px;background:rgba(239,68,68,.07);border-left:4px solid #ef4444;border-radius:8px;font-size:14px;line-height:1.9}
.t-watch::before{content:"⚠️ "}

/* ===== 随堂练/模式/听写/报告 ===== */
.mode-grid{display:grid;gap:10px;margin-top:8px}
.mode-btn{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:left;transition:.15s;color:var(--ink)}
.mode-btn:hover{border-color:var(--brand)}
.mode-btn b{display:block;font-size:16px}
.mode-btn span{color:var(--muted);font-size:12.5px}
.q-why{margin-top:10px;padding:9px 12px;background:rgba(34,192,122,.1);border-left:3px solid var(--ok);border-radius:8px;font-size:13.5px;line-height:1.7;color:var(--ink)}
.q-hint{margin:8px 0 0;color:var(--muted);font-size:12.5px;text-align:center}
.spell-row{display:flex;gap:8px;margin-top:6px}
.spell-input{flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px;outline:none}
.spell-input:focus{border-color:var(--brand)}
.text-line.reading{border-color:var(--brand);background:rgba(79,110,247,.08)}
.topbar-btn{flex:none;height:38px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink)}

/* ===== 首页 ===== */
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:20px;padding:34px 26px;box-shadow:var(--shadow)}
.hero .emoji{font-size:42px;line-height:1}
.hero h1{margin:10px 0 4px;font-size:clamp(24px,4.5vw,34px)}
.hero p{margin:0 0 18px;opacity:.92}
.prog{max-width:430px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .6s}
.prog span{font-size:13px;opacity:.92;display:block;margin-top:6px}
.hero-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.hero .btn.ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.how{list-style:none;padding:0;margin:0}
.how li{padding:5px 0;color:var(--muted);font-size:14.5px}

/* ===== 测验弹层 ===== */
.quiz-wrap{position:fixed;inset:0;z-index:50;background:rgba(15,20,35,.55);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.video-card{width:min(920px,100%);max-width:920px}.video-part-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pdf-frame{width:100%;height:min(72vh,640px);margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.video-parts{display:flex;flex-direction:column;gap:8px;margin:12px 0}#webVideo{width:100%;max-height:min(70vh,520px);margin-top:12px;background:#000;border-radius:12px;display:block}
.quiz-card{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:rise .3s both}
.q-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.q-word{font-size:26px;font-weight:800;text-align:center;margin:16px 0 22px;display:flex;align-items:center;justify-content:center;gap:10px}
.q-opts{display:grid;gap:10px}
.q-opt{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;transition:.15s;color:var(--ink)}
.q-opt:hover{border-color:var(--brand)}
.q-opt.good{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .4s}
.q-opt.bad{background:#ef4444;border-color:#ef4444;color:#fff;animation:shake .4s}
.q-end{text-align:center;padding:14px 0}
.q-end .face{font-size:46px;line-height:1}
.q-end h3{font-size:26px;margin:10px 0 4px}
.q-end p{color:var(--muted);margin:0 0 4px}
.q-end-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* ===== 动画 ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .4s both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ===== 响应式 ===== */
@media (max-width:1023px){
  #menuBtn{display:flex}
  #nav{position:fixed;left:0;top:0;bottom:0;z-index:40;height:auto;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  #nav.open{transform:none}
  #view{padding:16px 14px 90px}
}
@media (max-width:600px){
  .topbar{padding:8px 10px;gap:8px;flex-wrap:wrap;row-gap:8px}
  #search{order:10;flex-basis:100%}
  #rateBtn{font-size:12px;padding:0 8px}
  .brand .sub{display:none}
  .brand{font-size:15px}
  #jumpNo{width:54px;padding:7px 6px}
  .word-grid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
  .hero{padding:26px 18px}
  .hero .btn.big{padding:10px 16px;font-size:14px}
  .l-foot .btn{padding:8px 12px;font-size:14px}
}
.drill-tag{display:inline-block;font-style:normal;background:#eef4ff;color:#4d7dff;border:1px solid #b9ccff;border-radius:6px;font-size:11px;padding:1px 5px;margin-right:4px;vertical-align:2px;}

/*__CHILD_CSS__*/
html{scroll-padding-top:130px}body{font-size:17px}button,a,input,select{touch-action:manipulation}
.topbar{padding-top:max(8px,env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
#view{padding-bottom:max(80px,calc(20px + env(safe-area-inset-bottom)))}
.btn,.btn.tiny,.w-btn,.icon-btn,.topbar-btn{min-height:44px}.w-btn{min-width:44px;opacity:1;filter:none}.btn.tiny{font-size:14px;padding:8px 12px}
.word-card{height:128px}.w-front b{padding-top:18px}.w-actions{top:2px}.w-front .ipa{font-size:14px}.w-front .flip-hint{font-size:12px}
.p-en,.tl-en{align-items:center}.tl-en span{min-width:0;flex:1}.tl-en .w-btn{flex:none}.speaker{color:var(--brand)}
.source-note,.q-hint{font-size:14px;text-align:left;color:var(--muted)}.native-note{font-size:14px;margin-top:12px;color:var(--muted)}
.quiz-card{max-height:calc(100dvh - 36px);overflow-y:auto}.q-head{gap:8px;align-items:center;flex-wrap:wrap}.q-word{font-size:21px;overflow-wrap:anywhere}.q-opt{min-height:48px}.q-opt:disabled{cursor:default;opacity:1}.q-opt.bad{animation:none}.q-opt.good{animation:none}
.practice-hint{margin-top:16px;padding:12px;background:var(--bg);border-radius:10px}.practice-hint summary{min-height:44px;cursor:pointer}.q-why{font-size:16px;line-height:1.8}.q-why p{margin:8px 0}
.spell-row{flex-wrap:wrap}.spell-input{min-width:0;width:100%;flex:1 1 160px;min-height:48px}.t-ex{flex-wrap:wrap;min-height:48px}.t-ex .e-en{flex-basis:100%}.t-ex .e-cn{text-align:left;font-size:15px}
.rep-row{padding:10px 0;display:flex;gap:14px;justify-content:space-between;border-bottom:1px solid var(--line)}.mist-item{flex-wrap:wrap;overflow-wrap:anywhere}.mist-item .m-main{min-width:170px}.mist-item .m-main i{font-size:13px}
select{max-width:100%;min-height:44px;font-size:16px;padding:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px}.hero p{line-height:1.8}
@media(max-width:600px){.topbar{flex-wrap:wrap}#search{flex-basis:100%;order:10;min-height:44px}.brand{font-size:15px}.sec-head h2{flex-basis:100%}.l-foot{justify-content:flex-start}.l-foot .btn{font-size:15px}.t-chat{font-size:17px;line-height:1.85}.word-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/*__END_CHILD_CSS__*/
</style>
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="icon-btn" data-act="menu" aria-label="打开课程目录">☰</button>
  <a class="brand" href="#/">📖 NCE 1 <span class="sub">144课学习手册</span></a>

fication":"candidate","translationSource":"supplement"},{"en":"I'm very well, thank you. And you?","cn":"很好，谢谢你。你好吗？","source":"adaptation","pdfPage":21,"printedPage":17,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm fine, thanks.","cn":"很好，谢谢。","source":"adaptation","pdfPage":21,"printedPage":17,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"How is Tony?","cn":"托尼好吗？","source":"adaptation","pdfPage":21,"printedPage":17,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He's fine, thanks. How's Emma?","cn":"他很好，谢谢。埃玛好吗？","source":"adaptation","pdfPage":21,"printedPage":17,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"She's very well, too, Helen.","cn":"她也很好，海伦。","source":"adaptation","pdfPage":21,"printedPage":17,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Goodbye, Helen. Nice to see you.","cn":"再见，海伦。见到你真高兴。","source":"adaptation","pdfPage":21,"printedPage":17,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Nice to see you, too, Steven. Goodbye.","cn":"我也很高兴见到你，史蒂文。再见。","source":"adaptation","pdfPage":21,"printedPage":17,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"How are you? 是打招呼","chat":"How are you? 不是真的在问「你怎么样」，它是英语里的打招呼用语，就像「你好吗」。标准回答：I'm fine, thank you. 或 I'm very well, thanks. 然后礼貌地问回去 And you?（你呢？）。","formula":"How are you? → I'm fine / very well, thank you. And you?","examples":[{"en":"How are you today?","cn":"你今天好吗？","source":"supplement"},{"en":"I'm very well, thank you. And you?","cn":"我很好，谢谢。你呢？","source":"supplement"},{"en":"I'm fine, thanks.","cn":"我很好，谢谢。","source":"supplement"}],"watch":"描写人的样子要用形容词：He is fat.（他胖）She is thin.（她瘦）——形容词跟在 is/am/are 后面。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":21,"printedPage":17,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"—How are you? —I'm very ___, thank you.","opts":["well","good","better","best"],"a":"well","why":"形容身体好用 well（形容词）。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":21,"printedPage":17,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"熟人见面说：Nice to ___ you.","opts":["see","meet","look","watch"],"a":"see","why":"初次见面才用 meet，熟人是 see。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":21,"printedPage":17,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"是谁问了「埃玛好吗」（How's Emma?）？","opts":["海伦","史蒂文","托尼","埃玛"],"a":"海伦","hint":"对话一来一回注意说话人。","why":"史蒂文问托尼，海伦接着问埃玛。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":21,"printedPage":17,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"两人最后互相说了什么？","opts":["Goodbye 再见","Sorry 对不起","Pardon 请再说一遍","Thanks 谢谢"],"a":"Goodbye 再见","why":"结尾是道别：Nice to see you. Goodbye.","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":21,"printedPage":17,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}]}},{"id":10,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":9},{"id":11,"title":"Is this your shirt?","titleCn":"这是你的衬衫吗？","kind":"text","words":[{"en":"whose","ipa":"/huːz/","cn":"pron. 谁的","source":"supplement"},{"en":"shirt","ipa":"/ʃɜːt/","cn":"n. 衬衫","source":"supplement"},{"en":"blouse","ipa":"/blaʊz/","cn":"n. 女衬衫","source":"supplement"},{"en":"tie","ipa":"/taɪ/","cn":"n. 领带","source":"supplement"},{"en":"brother","ipa":"/ˈbrʌðə/","cn":"n. 兄，弟","source":"supplement"},{"en":"sister","ipa":"/ˈsɪstə/","cn":"n. 姐，妹","source":"supplement"},{"en":"father","ipa":"/ˈfɑːðə/","cn":"n. 父亲","source":"supplement"},{"en":"mother","ipa":"/ˈmʌðə/","cn":"n. 母亲","source":"supplement"},{"en":"his","ipa":"/hɪz/","cn":"det. 他的","source":"supplement"},{"en":"her","ipa":"/hɜː/","cn":"det. 她的","source":"supplement"}],"patterns":[{"en":"Whose shirt is that?","cn":"那是谁的衬衫？","source":"adaptation"},{"en":"It's Dave's.","cn":"是戴夫的。（人名 + 's 表示所属）","source":"adaptation"},{"en":"Is this your shirt, Dave?","cn":"戴夫，这是你的衬衫吗？","source":"adaptation"}],"grammar":"对物主提问用 Whose：Whose shirt is that?；名词所有格在人名后加 's：Dave's = Dave 的（衬衫），后面名词常省略。","tip":"his / her 的选择看所有者的性别：his shirt（他的），her blouse（她的）；whose 与 who's（who is）读音相同，含义不同。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":25,"printedPage":21,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Whose shirt is that?","cn":"那是谁的衬衫？","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Is that your shirt, Dave?","cn":"戴夫，那是你的衬衫吗？","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, sir. It's not my shirt. This is my shirt. My shirt's blue.","cn":"不，先生。那不是我的衬衫。我的衬衫在这儿，是蓝色的。","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Is this shirt Tim's?","cn":"这件衬衫是蒂姆的吗？","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Perhaps it is, sir. Tim's shirt's white.","cn":"可能是，先生。蒂姆的衬衫是白色的。","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Tim!","cn":"蒂姆！","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, sir?","cn":"什么事，先生？","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Is this your shirt?","cn":"这是你的衬衫吗？","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, sir.","cn":"是的，先生。","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Here you are. Catch!","cn":"给你。接住！","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Thank you, sir.","cn":"谢谢您，先生。","source":"adaptation","pdfPage":25,"printedPage":21,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"Whose 谁的？'s 是名字标签","chat":"想知道东西是谁的，用 Whose（谁的）提问。回答的小秘密：在人名后面加一个小小的 's，表示「某某的」！Dave's 就是「戴夫的」，像给东西贴上主人的名字标签。","formula":"Whose + 东西 is this/that? → It's + 人名 + 's.","examples":[{"en":"Whose shirt is that?","cn":"那是谁的衬衫？","source":"supplement"},{"en":"It's Dave's.","cn":"是戴夫的。","source":"supplement"},{"en":"Is this your shirt, Tim?","cn":"蒂姆，这是你的衬衫吗？","source":"supplement"}],"watch":"his（他的）和 her（她的）看主人性别：his bag 他的包，her bag 她的包，别贴错标签！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":25,"printedPage":21,"status":"candidate","verified":false,"scope":"page-offse 情（the matter 麻烦）","source":"supplement"},{"en":"children","ipa":"/ˈtʃɪldrən/","cn":"n. 孩子们（child 的复数）","source":"supplement"},{"en":"tired","ipa":"/ˈtaɪəd/","cn":"adj. 累的","source":"supplement"},{"en":"thirsty","ipa":"/ˈθɜːsti/","cn":"adj. 渴的","source":"supplement"},{"en":"Mum","ipa":"/mʌm/","cn":"n. 妈妈（口语）","source":"supplement"},{"en":"sit down","ipa":"/ˈsɪt daʊn/","cn":"phr. 坐下","source":"supplement"},{"en":"right","ipa":"/raɪt/","cn":"adj. 好的；右边的","source":"supplement"},{"en":"ice cream","ipa":"/ˈaɪs kriːm/","cn":"n. 冰淇淋","source":"supplement"},{"en":"hot","ipa":"/hɒt/","cn":"adj. 热的","source":"supplement"},{"en":"boy","ipa":"/bɔɪ/","cn":"n. 男孩","source":"supplement"}],"patterns":[{"en":"What's the matter, children?","cn":"怎么啦，孩子们？","source":"textbook","pdfPage":41,"printedPage":37,"verification":"verified","translationSource":"supplement"},{"en":"We're tired and thirsty.","cn":"我们又累又渴。","source":"adaptation"},{"en":"There's an ice cream man.","cn":"有个卖冰淇淋的。（There be 句型）","source":"textbook","pdfPage":41,"printedPage":37,"verification":"verified","translationSource":"supplement"}],"grammar":"What's the matter (with sb)? 用来询问对方怎么了；There be 句型表示“某处存在某物”，be 动词与后面的名词单复数一致（There's / There are）。","tip":"两个形容词并列用 and 连接：tired and thirsty；thirsty 的名词是 thirst（渴），注意 th 要咬舌。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":41,"printedPage":37,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}],"teachingSource":"supplement","text":[{"en":"What's the matter, children?","cn":"孩子们，怎么啦？","speaker":"MOTHER","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"We're tired . . .","cn":"我们累了……","speaker":"GIRL","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":". . . and thirsty, Mum.","cn":"……而且渴了，妈妈。","speaker":"BOY","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Sit down here.","cn":"坐在这儿吧。","speaker":"MOTHER","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Are you all right now?","cn":"你们现在好些了吗？","speaker":"MOTHER","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"No, we aren't.","cn":"不，还没有。","speaker":"BOY","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Look!","cn":"瞧！","speaker":"MOTHER","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"There's an ice cream man.","cn":"有个卖冰淇淋的。","speaker":"MOTHER","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Two ice creams please.","cn":"请拿两个冰淇淋。","speaker":"MOTHER","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Here you are, children.","cn":"拿着，孩子们。","speaker":"MOTHER","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Thanks, Mum.","cn":"谢谢，妈妈。","speaker":"CHILDREN","source":"textbook","pdfPage":41,"printedPage":37,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"These ice creams are nice.","cn":"这些冰淇淋真好吃。","speaker":"GIRL","source":"textbook","pdfPage":41,"printedPage":  is a photograph of our village.","cn":"这是我们村庄的一张照片。","source":"textbook","pdfPage":73,"printedPage":69,"verification":"verified","translationSource":"supplement"},{"en":"It is between two hills.","cn":"它位于两座小山之间。","source":"textbook","pdfPage":73,"printedPage":69,"verification":"verified","translationSource":"supplement"},{"en":"My wife and I are walking along the banks of the river.","cn":"我和妻子正沿着河岸散步。","source":"textbook","pdfPage":73,"printedPage":69,"verification":"verified","translationSource":"supplement"}],"grammar":"between 表示“在两者之间”；along 沿着（静态路径），into 进入（动态方向）；a photograph of... 中 of 表所属。","tip":"bank 既指“河岸”也指“银行”，靠上下文区分；walk along... 沿着走，walk into... 走进。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":73,"printedPage":69,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}],"teachingSource":"supplement","text":[{"en":"This is a photograph of our village.","cn":"这是我们村庄的一张照片。","source":"textbook","pdfPage":73,"printedPage":69,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Our village is in a valley.","cn":"我们的村庄坐落在一个山谷之中。","source":"textbook","pdfPage":73,"printedPage":69,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It is between two hills.","cn":"它位于两座小山之间。","source":"textbook","pdfPage":73,"printedPage":69,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"The village is on a river.","cn":"它靠近一条小河。","source":"textbook","pdfPage":73,"printedPage":69,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Here is another photograph of the village.","cn":"这是我们村庄的另一张照片。","source":"textbook","pdfPage":73,"printedPage":69,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource" -heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}}]}},{"id":36,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":35},{"id":37,"title":"Making a bookcase","titleCn":"做书架","kind":"text","words":[{"en":"work","ipa":"/wɜːk/","cn":"v. 工作","source":"supplement"},{"en":"hard","ipa":"/hɑːd/","cn":"adv. 努力地；adj. 硬的","source":"supplement"},{"en":"make","ipa":"/meɪk/","cn":"v. 做","source":"supplement"},{"en":"bookcase","ipa":"/ˈbʊkkeɪs/","cn":"n. 书架","source":"supplement"},{"en":"hammer","ipa":"/ˈhæmə/","cn":"n. 锤子","source":"supplement"},{"en":"paint","ipa":"/peɪnt/","cn":"v. 刷漆；n. 油漆","source":"supplement"},{"en":"pink","ipa":"/pɪŋk/","cn":"adj. 粉红色的","source":"supplement"},{"en":"favourite","ipa":"/ˈfeɪvərɪt/","cn":"adj. 最喜欢的","source":"supplement"},{"en":"daughter","ipa":"/ˈdɔːtə/","cn":"n. 女儿","source":"supplement"},{"en":"for","ipa":"/fɔː/","cn":"prep. 给，为","source":"supplement"}],"patterns":[{"en":"You're working hard!","cn":"你干得真卖力！","source":"adaptation"},{"en":"I'm making a bookcase.","cn":"我正在做一个书架。","source":"adaptation"},{"en":"What are you going to do?","cn":"你打算做什么？","source":"adaptation"},{"en":"I'm going to paint it pink.","cn":"我打算把它漆成粉红色。","source":"adaptation"}],"grammar":"be going to + 动词原形表示“打算、将要”；paint it pink 是“动词 + 宾语 + 宾语补足语”结构（把它漆成粉色）。","tip":"be doing（正在做）与 be going to do（打算做）只差一个 going，一个看眼前、一个看计划。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":77,"printedPage":73,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"You're working hard, George. What are you doing?","cn":"你干得真卖力，乔治。你在做什么呢？","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm making a bookcase. Give me that hammer, please, Dan.","cn":"我正在做一个书架。请把那把锤子递给我，丹。","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Which hammer? This one?","cn":"哪一把？是这把吗？","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, not that one. The big one.","cn":"不，不是那把，是那把大的。","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Here you are.","cn":"给你。","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Thanks, Dan.","cn":"谢谢，丹。","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What are you going to do now, George?","cn":"你现在打算做什么，乔治？","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm going to paint it.","cn":"我打算给它刷上漆。","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What colour are you going to paint it?","cn":"你打算把它漆成什么颜色？","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm going to paint it pink.","cn":"我想漆成粉红色。","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Pink!","cn":"粉红色！","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"This bookcase isn't for me. It's for my daughter, Susan. Pink's her favourite colour.","cn":"这个书架不是为我做的，是为我女儿苏珊做的。粉红色是她最喜欢的颜色。","source":"adaptation","pdfPage":77,"printedPage":73,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"be going to：打算做的事","chat":"说「打算做某事」（还没做，计划中），用 be going to + 动词原形：I'm going to paint it.（我打算给它刷漆）。问别人打算：What are you going to do?","formula":"主语 + am/is/are going to + 动词原形（打算做……）","examples":[{"en":"I'm going to paint it pink.","cn":"我打算把它漆成粉色。","source":"supplement"},{"en":"What are you going to do now, George?","cn":"乔治，你现在打算做什么？","source":"supplement"},{"en":"This bookcase isn't for me. It's for my daughter.","cn":"这书架不是给我的，是给我女儿的。","source":"supplement"}],"watch":"be doing = 眼前正在做；be going to do = 计划要做——一个是「直播」，一个是「预告片」！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":77,"printedPage":73,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"I'm going ___ it.","opts":["to paint","painting","paint","painted"],"a":"to paint","why":"be going to + 动词原形。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":77,"printedPage":73,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"Give me that ___, please.","opts":["hammer","book","cake","cup"],"a":"hammer","why":"做书架需要锤子。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":77,"printedPage":73,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"乔治正在做什么？","opts":["做书架","刷墙","做桌子","整理花园"],"a":"做书架","hint":"I'm making a bookcase.","why":"making a bookcase。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":77,"printedPage":73,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"书架是给谁做的？","opts":["女儿苏珊","丹","他自己","他妻子"],"a":"女儿苏珊","hint":"It's for my daughter, Susan.","why":"粉红色是苏珊最喜欢的颜色。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":77,"printedPage":73,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":38,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":37},{"id":39,"title":"Don't drop it!","titleCn":"别摔了！","kind":"text","words":[{"en":"front","ipa":"/frʌnt/","cn":"n. 前面（in front of 在……前面）","source":"supplement"},{"en":"careful","ipa":"/ˈkeəfʊl/","cn":"adj. 小心的","source":"supplement"},{"en":"vase","ipa":"/vɑːz/","cn":"n. 花瓶","source":"supplement"},{"en":"drop","ipa":"/drɒp/","cn":"v. 掉落，失手落下","source":"supplement"},{"en":"flower","ipa":"/ˈflaʊə/","cn":"n. 花","source":"supplement"},{"en":"show","ipa":"/ʃəʊ/","cn":"v. 给……看","source":"supplement"},{"en":"send","ipa":"/send/","cn":"v. 寄，送","source":"supplement"},{"en":"take","ipa":"/teɪk/","cn":"v. 拿，带走","source":"supplement"},{"en":"with","ipa":"/wɪð/","cn":"prep. 关于（do with 处理）；和……一起","source":"supplement"}],"patterns":[{"en":"What are you going to do with that vase?","cn":"你打算拿那个花瓶怎么办？","source":"adaptation"},{"en":"Don't drop it!","cn":"别摔了！（祈使句否定式）","source":"adaptation"},{"en":"Be careful!","cn":"小心！","source":"adaptation"},{"en":"I'm going to send it to my mother.","drill":true,"cn":"我准备把它寄给我妈妈。","source":"supplement"}],"grammar":"祈使句的否定式 = Don't + 动词原形：Don't drop it! / Don't do that!；send sth to sb = send sb sth（双宾语）。","tip":"do with 表示“处理、安置”；Be careful! 比 Take care! 更急迫；in front of 指“在某物外部的前面”。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":81,"printedPage":77,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"What are you going to do with that vase, Penny?","cn":"你打算拿那个花瓶怎么办，彭妮？","source":"adaptation","pdfPage":81,"printedPage":77,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm going to put it on this table, Sam.","cn":"我打算把它放在这张桌子上，萨姆。","source":"adaptation","pdfPage":81,"printedPage":77,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Don't do that. Give it to me.","cn":"不要放在那里，把它给我。","source":"adaptation","pdfPage":81,"printedPage":77,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What are you going to do with it?","cn":"你打算拿它怎么办？","source":"adaptation","pdfPage":81,"printedPage":77,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm going to put it here, in front of the window.","cn":"我打算把它放在这儿，放在窗前。","source":"adaptation","pdfPage":81,"printedPage":77,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Be careful! Don't drop it!","cn":"小心点！别摔了！","source":"adaptation","pdfPage":81,"printedPage":77,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Don't put it there, Sam. Put it here, on this shelf.","cn":"别放在那儿，萨姆。放在这儿，放在这个架子上。","source":"adaptation","pdfPage":81,"printedPage":77,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"There we are! It's a lovely vase.","cn":"好了！这是只漂亮的花瓶。","source":"adaptation","pdfPage":81,"printedPage":77,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Those flowers are lovely, too.","cn":"那些花也很漂亮。","source":"adaptation","pdfPage":81,"printedPage":77,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"Don't…!：劝人别做某事","chat":"劝别人「别做某事」，在动词前加 Don't：Don't drop it!（别摔了！）。提醒小心说 Be ":"v. 沸腾，烧开","source":"supplement"},{"en":"water","ipa":"/ˈwɔːtə/","cn":"n. 水","source":"supplement"},{"en":"hurry","ipa":"/ˈhʌri/","cn":"v. 赶快","source":"supplement"}],"patterns":[{"en":"Can you make the tea, Sam?","cn":"萨姆，你会沏茶吗？","source":"adaptation"},{"en":"Is there any water in this kettle?","cn":"这壶里有水吗？（疑问句用 any）","source":"adaptation"},{"en":"Hurry up!","cn":"快点！","source":"adaptation"}],"grammar":"表示“一些”时，肯定句通常用 some，普通疑问句和否定句通常用 any；请求或期待肯定回答的问句也可用 some。There be 的一般疑问句把 be 动词提前：Is there any...?","tip":"water 不可数：一些水说 some water；hurry up 快点，名词短语 in a hurry 表示“匆忙”。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":89,"printedPage":85,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Can you make the tea, Sam?","cn":"你会沏茶吗，萨姆？","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, of course I can, Penny.","cn":"会的，我当然会，彭妮。","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Is there any water in this kettle?","cn":"这水壶里有水吗？","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, there is.","cn":"有。","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Where's the tea?","cn":"茶叶在哪儿？","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"It's there, behind the teapot.","cn":"就在那儿，茶壶后面。","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Can you see it?","cn":"你看见了吗？","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I can see the teapot, but I can't see the tea.","cn":"我看见茶壶了，但没看见茶叶。","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"There it is! It's in front of you!","cn":"那不是嘛！就在你眼前！","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Ah yes, I can see it now.","cn":"噢，是啊，我现在看到了。","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Hurry up, Sam! The kettle's boiling!","cn":"快点，萨姆！水壶开了！","source":"adaptation","pdfPage":89,"printedPage":85,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"some 和 any 的分工","chat":"some 和 any 都可以表示“一些”。本课肯定句用 some（There’s some water.），普通疑问句和否定句用 any（Is there any water? / There isn’t any tea.）。这是常见用法，不是绝对规则；请求、邀请或期待肯定回答时，问句也可以用 some。","formula":"表示“一些”：肯定句通常用 some ｜ 普通疑问句、否定句通常用 any（还要看语境）","examples":[{"en":"Is there any water in this kettle?","cn":"这壶里有水吗？","source":"supplement"},{"en":"Yes, there is.","cn":"是的，有。","source":"supplement"},{"en":"Hurry up! The kettle's boiling!","cn":"快点！水开了！","source":"supplement"}],"watch":"水不可数：说 some water，不能说 a water 或 waters！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":89,"printedPage":85,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"根据本课常见表达，补全原句：Is there ___ water in this kettle?","opts":["any","some","many","a"],"a":"any","why":"本题按本课给出的表达选择 any；some/any 的选择还 tter for the boss, please, Pamela?","cn":"帕梅拉，请你为老板打一下这封信好吗？","source":"adaptation","pdfPage":93,"printedPage":89,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, of course I can.","cn":"当然可以。","source":"adaptation","pdfPage":93,"printedPage":89,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Here you are.","cn":"给您信。","source":"adaptation","pdfPage":93,"printedPage":89,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Thank you, Bob. Bob!","cn":"谢谢你，鲍勃。鲍勃！","source":"adaptation","pdfPage":93,"printedPage":89,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes? What's the matter?","cn":"怎么了？怎么回事？","source":"adaptation","pdfPage":93,"printedPage":89,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I can't type this letter. I can't read it! The boss's handwriting is terrible!","cn":"我打不了这封信，我没法辨认！老板的字迹太糟糕了！","source":"adaptation","pdfPage":93,"printedPage":89,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"can：万能的「能、可以」","chat":"can 表示「能、会、可以」，后面直接跟动词原形，不管我是你还是他，can 都不变！否定是 can't。礼貌请求别人：Can you…, please?","formula":"Can + 主语 + 动词原形? → Yes, …can. ／ No, …can't.","examples":[{"en":"Can you come here a minute, please?","cn":"你能来一下吗？","source":"supplement"},{"en":"Can she type this letter for me?","cn":"她能帮我打这封信吗？","source":"supplement"},{"en":"I can't read it!","cn":"我没法辨认它！","source":"supplement"}],"watch":"can 后面的动词永远用原形：she can types ❌ → she can type ✓（不加 s！）","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":93,"printedPage":89,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"Can she ___ this lette "butter","ipa":"/ˈbʌtə/","cn":"n. 黄油","source":"supplement"},{"en":"honey","ipa":"/ˈhʌni/","cn":"n. 蜂蜜","source":"supplement"},{"en":"jam","ipa":"/dʒæm/","cn":"n. 果酱","source":"supplement"}],"patterns":[{"en":"Do you like coffee?","cn":"你喜欢咖啡吗？（问长期喜好）","source":"adaptation"},{"en":"Do you want a cup?","cn":"你想要一杯吗？（问此刻想要）","source":"adaptation"},{"en":"Yes, please. / No, thank you.","cn":"好的，来一杯。／不用了，谢谢。","source":"adaptation"}],"grammar":"Do you like...? 问习惯性喜好，回答 Yes, I do.；Do you want...? 问此时此刻想要什么；礼貌接受 Yes, please.，婉拒 No, thank you.","tip":"black coffee 指“清咖啡（不加奶）”，与颜色无关；想加奶说 with milk, please.","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":97,"printedPage":93,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Do you like coffee, Ann?","cn":"你喜欢咖啡吗，安？","source":"adaptation","pdfPage":97,"printedPage":93,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I do.","cn":"是的，我喜欢。","source":"adaptation","pdfPage":97,"printedPage":93,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Do you want a cup?","cn":"你想要来一杯吗？","source":"adaptation","pdfPage":97,"printedPage":93,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, please, Christine.","cn":"好的，请来一杯，克里斯廷。","source":"adaptation","pdfPage":97,"printedPage":93,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Do you want any sugar?","cn":"你要加些糖吗？","source":"adaptation","pdfPage":97,"printedPage":93,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, please.","cn":"好的，请加一些。","source":"adaptation","pdfPage":97,"printedPage":93,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candida pplement"},{"en":"mince","ipa":"/mɪns/","cn":"n. 肉馅，绞肉","source":"supplement"},{"en":"chicken","ipa":"/ˈtʃɪkɪn/","cn":"n. 鸡肉；鸡","source":"supplement"},{"en":"either","ipa":"/ˈaɪðə/","cn":"adv. 也（不）（用于否定句）","source":"supplement"},{"en":"cabbage","ipa":"/ˈkæbɪdʒ/","cn":"n. 卷心菜","source":"supplement"}],"patterns":[{"en":"Do you want beef or lamb?","cn":"你要牛肉还是羔羊肉？（选择疑问句）","source":"adaptation"},{"en":"I don't like chicken!","cn":"我不喜欢鸡肉！","source":"adaptation"},{"en":"My husband doesn't like chicken, either.","cn":"我丈夫也不喜欢鸡肉。","source":"adaptation"}],"grammar":"一般现在时否定式用 don't / doesn't + 动词原形；“也不”在否定句句尾用 either，不用 too。","tip":"at the butcher's 中的 's 指“店铺”（肉店）；同样有 at the grocer's 食品店、at the greengrocer's 蔬果店。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":101,"printedPage":97,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Do you want beef or lamb, Mrs. Bird?","cn":"伯德夫人，您要牛肉还是要羔羊肉？","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Beef, please.","cn":"请给我牛肉。","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"This lamb's very good.","cn":"这羔羊肉很好。","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I like lamb, but my husband doesn't.","cn":"我喜欢羔羊肉，可我丈夫不喜欢。","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What about some steak? This is a nice piece.","cn":"来点牛排吗？这块很好。","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Give me that piece, please.","cn":"就请给我那块吧。","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"And a pound of mince, too.","cn":"再来一磅绞肉。","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Do you want a chicken, Mrs. Bird? They're very nice.","cn":"伯德夫人，您要一只鸡吗？这些鸡很好。","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, thank you. My husband likes steak, but he doesn't like chicken!","cn":"不要了，谢谢。我丈夫喜欢牛排，但他不喜欢鸡！","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"To tell you the truth, Mrs. Bird, I don't like chicken either!","cn":"说实在的，伯德夫人，我也不喜欢鸡！","source":"adaptation","pdfPage":101,"printedPage":97,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"doesn't like 与 either","chat":"说「他喜欢」要加 s：He likes steak. 说「他不喜欢」用 doesn't + 动词原形：He doesn't like chicken.（doesn't 已经替你背了 s，后面的动词变回原形）。「我也不喜欢」在句尾用 either！","formula":"He/She + likes… ／ doesn't like… ｜ 句尾 …, either.（也<不>……）","examples":[{"en":"My husband doesn't like chicken.","cn":"我丈夫不喜欢鸡肉。","source":"supplement"},{"en":"I don't like chicken either!","cn":"我也不喜欢鸡肉！","source":"supplement"},{"en":"Do you want beef or lamb?","cn":"你要牛肉还是羔羊肉？","source":"supplement"}],"watch":"too 用在肯定句尾（I like it too 我也喜欢），either 用在否定句尾（I don't like it either 我也不喜欢）！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":101,"printedPage":97,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"___ he like steak?","opts":["Does","Do","Is","Has"],"a":"Does","why":"这是一般现在时、含实义动词 like 的疑问句；he 是第三人称单数，用 Does，like 保持原形。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":101,"printedPage":97,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"I don't like chicken ___.","opts":["either","too","also","neither"],"a":"either","why":"否定句句尾用 either。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":101,"printedPage":97,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"伯德夫人买了什么？","opts":["牛肉和肉馅","羔羊肉和鸡","鸡和牛排","牛肉和鸡"],"a":"牛肉和肉馅","hint":"Beef, please. And a pound of mince, too.","why":"牛肉 + 一磅肉馅。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":101,"printedPage":97,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"肉贩自己喜欢鸡肉吗？","opts":["不喜欢","喜欢","课文没说","特别喜欢"],"a":"不喜欢","hint":"To tell you the truth, I don't like chicken either!","why":"肉贩说He也不喜欢鸡肉。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":101,"printedPage":97,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":50,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":49},{"id":51,"title":"A pleasant climate","titleCn":"宜人的气候","kind":"text","words":[{"en":"Greece","ipa":"/ɡriːs/","cn":"n. 希腊","source":"supplement"},{"en":"climate","ipa":"/ˈklaɪmət/","cn":"n. 气候","source":"supplement"},{"en":"country","ipa":"/ˈkʌntri/","cn":"n. 国家","source":"supplement"},{"en":"pleasant","ipa":"/ˈpleznt/","cn":"adj. 宜人的","source":"supplement"},{"en":"weather","ipa":"/ˈweðə/","cn":"n. 天气","source":"supplement"},{"en":"spring","ipa":"/sprɪŋ/","cn":"n. 春天","source":"supplement"},{"en":"windy","ipa":"/ˈwɪndi/","cn":"adj. 有风的","source":"supplement"},{"en":"warm","ipa":"/wɔːm/","cn":"adj. 温暖的","source":"supplement"},{"en":"rain","ipa":"/reɪn/","cn":"v. 下雨；n. 雨","source":"supplement"},{"en":"sometimes","ipa":"/ˈsʌmtaɪmz/","cn":"adv. 有时","source":"supplement"}],"patterns":[{"en":"What's the climate like in your country?","cn":"你们国家的气候怎么样？","source":"textbook","pdfPage":105,"printedPage":101,"verification":"verified","translationSource":"supplement"},{"en":"It's often windy in March.","cn":"三月里常常刮风。","source":"textbook","pdfPage":105,"printedPage":101,"verification":"verified","translationSource":"supplement"},{"en":"Does it often rain?","drill":true,"cn":"这儿常下雨吗？","source":"supplement"}],"grammar":"What's ... like? 用来问性质特点；季节、月份前用介词 in（in spring / in March）；rain 和 snow 可作动词：It often rains here.","tip":"climate 指长期的“气候”，weather 指短期的“天气”；聊天气是英语最常用的开场白。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":105,"printedPage":101,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}],"teachingSource":"supplement","text":[{"en":"Where do you come from?","cn":"你是哪国人？","speaker":"HANS","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I come from Greece.","cn":"我来自希腊。","speaker":"DIMITRI","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"What's the climate like in your country?","cn":"你们国家的气候怎么样？","speaker":"HANS","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It's very pleasant.","cn":"气候非常宜人。","speaker":"DIMITRI","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"What's the weather like in spring?","cn":"春天的天气怎么样？","speaker":"HANS","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It's often windy in March. It's always warm in April and May, but it rains sometimes.","cn":"三月里常常刮风。四月和五月天气总是暖洋洋的，但有时下雨。","speaker":"DIMITRI","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"What's it like in summer?","cn":"夏天的天气如何呢？","speaker":"HANS","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It's always hot in June, July and August. The sun shines every day.","cn":"六月、七月和八月的天气总是炎热的，每天都出太阳。","speaker":"DIMITRI","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Is it cold or warm in autumn?","cn":"秋季的天气是冷还是暖呢？","speaker":"HANS","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It's always warm in September and October. It's often cold in November and it rains sometimes.","cn":"九月和十月总是很暖和。十一月常常就冷了，而且有时下雨。","speaker":"DIMITRI","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Is it very cold in winter?","cn":"冬季的天气很冷吗？","speaker":"HANS","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It's often cold in December, January and February. It snows sometimes.","cn":"十二月、一月和二月常常很冷，有时下雪。","speaker":"DIMITRI","source":"textbook","pdfPage":105,"printedPage":101,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"}],"teach":{"title":"What's the weather like?","chat":"问天气的专用句：What's the weather like?（天气怎么样？）——这里的 like 是「像……样子」，不是「喜欢」！季节、月份前面用 in：in spring、in March。雨和雪还能当动词：It rains. It snows.","formula":"What's the weather like in + 季节/月份? → It's windy / warm / hot.","examples":[{"en":"What's the climate like in your country?","cn":"你们国家气候怎么样？","source":"supplement"},{"en":"It's often windy in March.","cn":"三月常刮风。","source":"supplement"},{"en":"It's always hot in June, July and August.","cn":"六、七、八月总是很热。","source":"supplement"}],"watch":"climate 指一个地方长期的气候特点；weather 指天气情况，可以说今天、某一天，也可以说某个季节的天气，并不只限今天。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":105,"printedPage":101,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},"ex":{"g":[{"q":"It's often windy ___ March.","opts":["in","on","at","of"],"a":"in","why":"月份前用 in。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":105,"printedPage":101,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""},{"q":"___ it often rain here?","opts":["Does","Do","Is","Are"],"a":"Does","why":"这是一般现在时、含实义动词 rain 的疑问句；it 是第三人称单数，用 Does，rain 保持原形。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":105,"printedPage":101,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""}],"c":[{"q":"根据课文，迪米特里（Dimitri）来自哪里？","opts":["希腊","英国","美国","中国"],"a":"希腊","hint":"I come from Greece.","why":"Dimitri 说 I come from Greece.（我来自希腊）。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":105,"printedPage":101,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},{"q":"根据课文描述，希腊夏天天气如何？","opts":["总是炎热","常常寒冷","常刮大风","总是下雨"],"a":"总是炎热","hint":"It's always hot in June, July and August.","why":"夏天每天出太阳、总是热。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":105,"printedPage":101,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}}]}},{"id":52,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":51},{"id":53,"title":"An interesting climate","titleCn":"有趣的气候","kind":"text","words":[{"en":"England","ipa":"/ˈɪŋɡlənd/","cn":"n. 英格兰，（泛指）英国","source":"supplement"},{"en":"mild","ipa":"/maɪld/","cn":"adj. 温和的","source":"supplement"},{"en":"always","ipa":"/ˈɔːlweɪz/","cn":"adv. 总是","source":"supplement"},{"en":"north","ipa":"/nɔːθ/","cn":"n. 北方","source":"supplement"},{"en":"east","ipa":"/iːst/","cn":"n. 东方","source":"supplement"},{"en":"south","ipa":"/saʊθ/","cn":"n. 南方","source":"supplement"},{"en":"west","ipa":"/west/","cn":"n. 西方","source":"supplement"},{"en":"season","ipa":"/ˈsiːzn/","cn":"n. 季节","source":"supplement"},{"en":"best","ipa":"/best/","cn":"adv. 最好地；adj. 最好的","source":"supplement"},{"en":"night","ipa":"/naɪt/","cn":"n. 夜晚","source":"supplement"}],"patterns":[{"en":"It's mild, but it's not always pleasant.","cn":"气候温和，但不总是宜人。","source":"adaptation"},{"en":"The weather's often cold in the North and windy in the East.","cn":"北部天气常常寒冷，东部则常常刮风。","source":"adaptation"},{"en":"It's our favourite subject of conversation.","cn":"它是我们最喜欢谈论的话题。","source":"adaptation"}],"grammar":"方位名词前加 the：in the North / in the East；favourite 本身就含“最”的意味，不用再加 most。","tip":"谈论天气的万能句：What's the weather like today?；四方位 north/east/south/west 成对记。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":109,"printedPage":105,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Where do you come from?","cn":"你是哪国人？","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I come from England.","cn":"我来自英国。","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What's the climate like in your country?","cn":"你们国家的气候怎么样？","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"It's mild, but it's not always pleasant.","cn":"气候温和，但也不总是宜人的。","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What's the weather like in summer?","cn":"夏季的天气怎么样？","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"It's often cold in the North and windy in the East. It's often wet in the West and sometimes warm in the South.","cn":"北部常冷，东部常刮风。西部常下雨，南部有时则很暖和。","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Which seasons do you like best?","cn":"你最喜欢哪些季节？","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I like spring and summer. The days are long and the nights are short. The sun rises early and sets late.","cn":"我喜欢春季和夏季。此时白天长而夜晚短，太阳升得早而落得晚。","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I don't like autumn and winter. The days are short and the nights are long. The sun rises late and sets early.","cn":"我不喜欢秋季和冬季。此时白天短而夜晚长，太阳升得迟而落得早。","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Our climate is not very good, but it's interesting. It's our favourite subject of conversation.","cn":"我们的气候不是很好，但很有意思。它是我最喜欢谈论的话题。","source":"adaptation","pdfPage":109,"printedPage":105,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"方位与 favourite","chat":"说一个国家的方位要加 the：in the North（在北方）、in the East（在东方）。说「最喜欢的」用 favourite，它天生带着「最」字，前面不能再加 most！","formula":"in the North / East / South / West ｜ favourite + 名词 = 最喜欢的……","examples":[{"en":"It's often cold in the North.","cn":"北方常常很冷。","source":"supplement"},{"en":"I like spring and summer best.","cn":"我最喜欢春天和夏天。","source":"supplement"},{"en":"It's our favourite subject of conversation.","cn":"这是我们最爱聊的话题。","source":"supplement"}],"watch":"favourite = 最喜欢的：不说 most favourite，「最」已经包含在里面了！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":109,"printedPage":105,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"It's often cold in ___ North.","opts":["the","不填","a","an"],"a":"the","why":"方位名词前要加 the。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":109,"printedPage":105,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"The sun rises ___ and sets late.","opts":["early","late","slowly","well"],"a":"early","why":"升得早落得晚 = 白天长。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":109,"printedPage":105,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"说话人最喜欢哪几个季节？","opts":["春季和夏季","秋季和冬季","三月和四月","六月和七月"],"a":"春季和夏季","hint":"I like spring and summer.","why":"因为白天长、夜晚短。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":109,"printedPage":105,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"英国的气候怎么样？","opts":["温和但不总是宜人","非常糟糕","总是寒冷","总是炎热"],"a":"温和但不总是宜人","hint":"It's mild, but it's not always pleasant.","why":"mild 温和。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":109,"printedPage":105,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":54,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":53},{"id":55,"title":"The Sawyer family","titleCn":"索耶一家人","kind":"text","words":[{"en":"live","ipa":"/lɪv/","cn":"v. 住，居住","source":"supplement"},{"en":"stay","ipa":"/steɪ/","cn":"v. 呆在，停留","source":"supplement"},{"en":"home","ipa":"/həʊm/","cn":"n. 家；adv. 在家","source":"supplement"},{"en":"housework","ipa":"/ˈhaʊswɜːk/","cn":"n. 家务","source":"supplement"},{"en":"lunch","ipa":"/lʌntʃ/","cn":"n. 午饭","source":"supplement"},{"en":"usually","ipa":"/ˈjuːʒʊəli/","cn":"adv. 通常","source":"supplement"},{"en":"together","ipa":"/təˈɡeðə/","cn":"adv. 一起","source":"supplement"},{"en":"evening","ipa":"/ˈiːvnɪŋ/","cn":"n. 傍晚，晚上","source":"supplement"},{"en":"arrive","ipa":"/əˈraɪv/","cn":"v. 到达","source":"supplement"},{"en":"late","ipa":"/leɪt/","cn":"adv. 晚地；adj. 迟的","source":"supplement"}],"patterns":[{"en":"The Sawyers live at 87 King Street.","cn":"索耶一家住在国王街87号。","source":"adaptation"},{"en":"She stays at home every day.","cn":"她每天呆在家里。","source":"adaptation"},{"en":"Mr. Sawyer arrives home late.","cn":"索耶先生到家很晚。","source":"adaptation"}],"grammar":"一般现在时表示习惯性动作，含实义动词的肯定句中，第三人称单数动词通常加 -s/-es（goes, does, watches）；always/usually/often 通常放在实义动词前、be 动词后。","tip":"arrive home 到家（home 是副词，前面不加 to）；go to bed 上床睡觉，go to sleep 入睡。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":113,"printedPage":109,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"The Sawyers live at 87 King Street.","cn":"索耶一家住在国王街87号。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"In the morning, Mr. Sawyer goes to work and the children go to school.","cn":"早上，索耶先生去上班，孩子们去上学。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Their father takes them to school every day.","cn":"父亲每天送孩子们去上学。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Mrs. Sawyer stays at home every day.","cn":"索耶太太每天呆在家里。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"She does the housework.","cn":"她操持家务。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"She always eats her lunch at noon.","cn":"她总是在正午吃午饭。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"In the afternoon, she usually sees her friends.","cn":"下午，她通常会见朋友。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"They often drink tea together.","cn":"她们经常在一起喝茶。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"In the evening, the children come home from school.","cn":"傍晚，孩子们放学回家。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"They arrive home early.","cn":"他们到家很早。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Mr. Sawyer comes home from work.","cn":"索耶先生下班回家。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He arrives home late.","cn":"他到家很晚。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"At night, the children always do their homework.","cn":"晚上，孩子们总是做作业。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Then they go to bed.","cn":"然后他们去睡觉。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Mr. Sawyer usually reads his newspaper, but sometimes he and his wife watch television.","cn":"索耶先生通常在晚上看报，但有时他和妻子一起看电视。","source":"adaptation","pdfPage":113,"printedPage":109,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"一般现在时与动词的 s","chat":"讲每天的习惯动作，用一般现在时。含实义动词的肯定句中，主语是 he/she/it 等第三人称单数时，动词通常加 s 或 es：goes、does、watches、stays。always（总是）、usually（通常）、often（经常）通常放在实义动词前、be 动词后。","formula":"He/She + 实义动词s/es + 时间. ｜ always/usually/often 通常在实义动词前、be 动词后","examples":[{"en":"Mr. Sa
