rintedPage":229,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"___ can I.","opts":["Neither","So","Too","Also"],"a":"Neither","why":"回应否定用 Neither + 倒装。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":233,"printedPage":229,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"根据本课常见表达，补全原句：Haven't you got ___ small change?","opts":["any","some","many","a"],"a":"any","why":"本题按本课给出的表达选择 any；some/any 的选择还受语境影响，不能把疑问句或否定句一律当作排除 some 的依据。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":233,"printedPage":229,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"售票员做不了什么事？","opts":["找开10英镑钞票","开车","开门","停车"],"a":"找开10英镑钞票","hint":"I can't change a ten-pound note.","why":"没有零钱找。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":233,"printedPage":229,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"这位乘客要去哪儿？","opts":["特拉法加广场","国王街","伦敦桥","火车站"],"a":"特拉法加广场","hint":"Trafalgar Square, please.","why":"车费付不出零钱闹了笑话。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":233,"printedPage":229,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":114,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":113},{"id":115,"title":"Knock, knock!","titleCn":"敲敲门！","kind":"text","words":[{"en":"knock","ipa":"/nɒk/","cn":"v. 敲（门）","source":"supplement"},{"en":"everything","ipa":"/ˈevriθɪŋ/","cn":"pron. 一切事物","source":"supplement"},{"en":"quiet","ipa":"/ˈkwaɪət/","cn":"adj. 安静的","source":"supplement"},{"en":"impossible","ipa":"/ɪmˈpɒsəbl/","cn":"adj. 不可能的","source":"supplement"},{"en":"invite","ipa":"/ɪnˈvaɪt/","cn":"v. 邀请","source":"supplement"},{"en":"joke","ipa":"/dʒəʊk/","cn":"v. 开玩笑；n. 玩笑","source":"supplement"},{"en":"asleep","ipa":"/əˈsliːp/","cn":"adj. 睡着的","source":"supplement"},{"en":"anyone","ipa":"/ˈeniwʌn/","cn":"pron. 任何人","source":"supplement"}],"patterns":[{"en":"Isn't there anyone at home?","cn":"家里没有人吗？","source":"textbook","pdfPage":237,"printedPage":233,"verification":"verified","translationSource":"supplement"},{"en":"Everything's very quiet.","cn":"四周静悄悄的。","source":"textbook","pdfPage":237,"printedPage":233,"verification":"verified","translationSource":"supplement"},{"en":"There's no one at home.","cn":"家里一个人也没有。","source":"adaptation"}],"grammar":"不定代词 anyone / nobody / no one / everything / nothing 都按单数对待，谓语动词用单数；Isn't there...? 否定疑问句表示惊讶。","tip":"形容词修饰本课复合不定代词时放在后面：something nice。everyone、anything 写成一个词；no one 通常写成两个词。some/any 的选择还要看语境，疑问句并非只能用 any。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":237,"printedPage":233,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}],"teachingSource":"supplement","text":[{"en":"Isn't there anyone at home?","cn":"家里没有人吗？","speaker":"HELEN","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I'll knock again, Helen.","cn":"海伦，我再敲一次。","speaker":"JIM","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Everything's very quiet. I'm sure there's no one at home.","cn":"毫无动静，我肯定家里没有人。","speaker":"JIM","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"But that's impossible. Carol and Tom invited us to lunch. Look through the window.","cn":"但这不可能。卡罗尔和汤姆请我们来吃午饭。从窗子往里看看。","speaker":"HELEN","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Can you see anything?","cn":"你能看见什么吗？","speaker":"HELEN","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Nothing at all.","cn":"什么也看不见。","speaker":"JIM","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Let's try the back door.","cn":"让我们试试后门。","speaker":"HELEN","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Look! Everyone's in the garden.","cn":"瞧！大家都在花园里呢。","speaker":"JIM","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Hello, Helen. Hello, Jim.","cn":"你好，海伦。你好，吉姆。","speaker":"CAROL","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Everybody wants to have lunch in the garden. It's nice and warm out here.","cn":"大家都想在花园里吃午饭。这外面挺暖和。","speaker":"TOM","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Come and have something to drink.","cn":"来喝点什么吧。","speaker":"CAROL","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Thanks, Carol. May I have a glass of beer please?","cn":"谢谢，卡罗尔。给我一杯啤酒好吗？","speaker":"JIM","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Beer? There's none left. You can have some lemonade.","cn":"啤酒？全喝光了。你可以喝点柠檬水！","speaker":"CAROL","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Lemonade!","cn":"柠檬水！","speaker":"JIM","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Don't believe her, Jim. She's only joking. Have some beer!","cn":"吉姆，别信她的，她只是在开玩笑。喝点啤酒吧！","speaker":"TOM","source":"textbook","pdfPage":237,"printedPage":233,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"}],"teach":{"title":"复合不定代词都是「单数」","chat":"anyone（任何人）、nobody（没人）、everything（一切）这些词虽然意思像「很多」，但都当单数用：Everything's quiet.（一切都很安静）。修饰它们的词要放在后面。","formula":"everyone / anyone / nobody / nothing + 单数动词 ｜ 修饰语后置","examples":[{"en":"Isn't there anyone at home?","cn":"家里没有人吗？","source":"supplement"},{"en":"Everything's very quiet.","cn":"四周静悄悄的。","source":"supplement"},{"en":"Everyone's in the garden.","cn":"大家都在花园里。","source":"supplement"}],"watch":"形容词后置：something nice（好东西）。anyone 常用于疑问、否定语境，someone 也可用于期待肯定回答的问句；本课原句用 anyone，不是说所有问句都必须用它。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":237,"printedPage":233,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},"ex":{"g":[{"q":"根据课文原句：Isn’t there ___ at home?","opts":["anyone","someone","no one","everyone"],"a":"anyone","why":"PDF237 原句用 anyone。someone 在其他期待肯定回答的问句中也可能成立，不能仅凭“疑问句”排除它。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":237,"printedPage":233,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""},{"q":"___ wants to have lunch in the garden.","opts":["Everyone","All","Every","Nothing"],"a":"Everyone","why":"everyone 按单数对待。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":237,"printedPage":233,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""}],"c":[{"q":"大家都在哪儿？","opts":["花园里","电影院","厨房","聚会上"],"a":"花园里","hint":"Everyone's in the garden.","why":"外面又好又暖和。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":237,"printedPage":233,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},{"q":"汤姆说卡罗尔在做什么？","opts":["开玩笑","生气了","睡着了","说对了"],"a":"开玩笑","hint":"She's only joking.","why":"其实啤酒还有，别信她的。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":237,"printedPage":233,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}}]}},{"id":116,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":115},{"id":117,"title":"Tommy's breakfast","titleCn":"汤米的早餐","kind":"text","words":[{"en":"dining room","ipa":"/ˈdaɪnɪŋ ruːm/","cn":"n. 餐厅","source":"supplement"},{"en":"coin","ipa":"/kɔɪn/","cn":"n. 硬币","source":"supplement"},{"en":"swallow","ipa":"/ˈswɒləʊ/","cn":"v. 吞下","source":"supplement"},{"en":"later","ipa":"/ˈleɪtə/","cn":"adv. 后来","source":"supplement"},{"en":"toilet","ipa":"/ˈtɔɪlət/","cn":"n. 厕所","source":"supplement"},{"en":"while","ipa":"/waɪl/","cn":"conj. 当……的时候","source":"supplement"}],"patterns":[{"en":"When my husband was going into the dining room, he dropped some coins.","cn":"我丈夫走进餐厅的时候，把一些硬币掉在了地上。","source":"adaptation"},{"en":"What were you doing while we were having breakfast?","cn":"我们吃早饭时你在干什么？","source":"adaptation"}],"grammar":"过去进行时 was/were + doing 表示过去某时正在进行的动作；when / while 引导时间状语从句。","tip":"叙事经典结构：长动作用进行时（was going into...），短动作用过去时（dropped），while 后多用进行时。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":241,"printedPage":237,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"When my husband was going into the dining room this morning, he dropped some coins on the floor.","cn":"今天早晨我丈夫走进饭厅时，把一些硬币掉在地上了。","source":"adaptation","pdfPage":241,"printedPage":237,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"There were coins everywhere.","cn":"到处都是硬币。","source":"adaptation","pdfPage":241,"printedPage":237,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"We looked for them, but while we were having breakfast, Tommy found two small coins on the floor.","cn":"我们虽然找了，但我们吃早饭的时候，汤米在地板上找到了两枚小硬币。","source":"adaptation","pdfPage":241,"printedPage":237,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He put them both into his mouth. We both tried to get the coins, but it was too late. Tommy had already swallowed them!","cn":"他把这两枚硬币都放进了嘴里。我们俩都试图把硬币拿出来，但太迟了，汤米已经把硬币咽了下去！","source":"adaptation","pdfPage":241,"printedPage":237,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Late that morning, when I was doing the housework, my husband phoned me from the office.","cn":"那天晚些时候，当我正做家务时，我丈夫从办公室打来电话。","source":"adaptation","pdfPage":241,"printedPage":237,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“How's Tommy?” he asked. “I don't know,” I answered, “Tommy's been to the toilet three times this morning, but I haven't seen any coins!”","cn":"“汤米怎么样？”他问。“我不知道，”我回答说，“今天上午汤米去了3次厕所了，但我还没看到硬币！”","source":"adaptation","pdfPage":241,"printedPage":237,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"过去进行时：过去的「直播」","chat":"过去进行时 = was/were + 动词ing，表示「过去那一刻正在做」。讲故事时：长动作用进行时当背景，短动作用过去式突然打断——when/while 负责报时！","formula":"was/were + 动词ing（过去正在……）｜ when/while + 从句","examples":[{"en":"When my husband was going into the dining room, he dropped some coins.","cn":"丈夫走进饭厅时，硬币掉在了地上。","source":"supplement"},{"en":"While we were having breakfast, Tommy found two small coins.","cn":"我们吃早饭时，汤米找到了两枚硬币。","source":"supplement"}],"watch":"长动作（was going）当背景，短动作（dropped）是主角——进行时负责「画面」，过去式负责「事件」！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":241,"printedPage":237,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"When my husband ___ going into the dining room, he dropped some coins.","opts":["was","were","is","has"],"a":"was","why":"过去进行时 was going。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":241,"printedPage":237,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"Tommy had already ___ them!","opts":["swallowed","swallow","swallows","swallowing"],"a":"swallowed","why":"过去完成时 had + 过去分词。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":241,"printedPage":237,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"汤米把硬币怎么了？","opts":["吞下去了","买了糖","交给了妈妈","藏起来了"],"a":"吞下去了","hint":"Tommy had already swallowed them!","why":"放进嘴里拿不出来了。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":241,"printedPage":237,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"丈夫打电话时在哪儿？","opts":["办公室","家里","街上","医院"],"a":"办公室","hint":"my husband phoned me from the office","why":"他上班时打电话问汤米。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":241,"printedPage":237,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":118,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":117},{"id":119,"title":"A true story","titleCn":"一个真实的故事","kind":"text","words":[{"en":"true","ipa":"/truː/","cn":"adj. 真实的","source":"supplement"},{"en":"story","ipa":"/ˈstɔːri/","cn":"n. 故事","source":"supplement"},{"en":"happen","ipa":"/ˈhæpən/","cn":"v. 发生","source":"supplement"},{"en":"thief","ipa":"/θiːf/","cn":"n. 贼（复数 thieves）","source":"supplement"},{"en":"enter","ipa":"/ˈentə/","cn":"v. 进入","source":"supplement"},{"en":"dark","ipa":"/dɑːk/","cn":"adj. 黑暗的","source":"supplement"},{"en":"torch","ipa":"/tɔːtʃ/","cn":"n. 手电筒","source":"supplement"},{"en":"voice","ipa":"/vɔɪs/","cn":"n. 说话声，嗓音","source":"supplement"},{"en":"parrot","ipa":"/ˈpærət/","cn":"n. 鹦鹉","source":"supplement"}],"patterns":[{"en":"It happened to a friend of mine a year ago.","cn":"这是一年前发生在我一个朋友身上的事。","source":"adaptation"},{"en":"Suddenly, they heard a voice behind them.","cn":"突然，他们听到身后有声音。","source":"adaptation"},{"en":"The thieves ran away as quickly as they could.","cn":"小偷们拼命地跑掉了。","source":"adaptation"}],"grammar":"happen to sb 发生在某人身上（不及物动词，没有被动语态）；as ... as one can/could 表示“尽可能……”。","tip":"讲故事的经典开头：It happened to...；吓跑小偷的正是鹦鹉 Henry 那句 What's up?","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":245,"printedPage":241,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Do you like stories? I want to tell you a true story. It happened to a friend of mine a year ago.","cn":"你喜欢听故事吗？我要告诉你一个真实的故事。这是一年前发生在我一个朋友身上的事。","source":"adaptation","pdfPage":245,"printedPage":241,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"While my friend, George, was reading in bed, two thieves climbed into his kitchen.","cn":"当我的朋友乔治在床上看书时，两个小偷爬进了他的厨房。","source":"adaptation","pdfPage":245,"printedPage":241,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"After they went into the house, they went into the dining room. It was very dark, so they turned on a torch.","cn":"他们进了屋子后，走进了饭厅。饭厅非常黑暗，于是他们打开了手电筒。","source":"adaptation","pdfPage":245,"printedPage":241,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Suddenly, they heard a voice behind them. “What's up? What's up?” someone called.","cn":"突然，他们听到身后有声音。“什么事？什么事？”有人喊叫着。","source":"adaptation","pdfPage":245,"printedPage":241,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The thieves dropped the torch and ran away as quickly as they could.","cn":"小偷扔下了手电筒，飞快地逃走了。","source":"adaptation","pdfPage":245,"printedPage":241,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"George heard the noise and came downstairs quickly.","cn":"乔治听到了响声，迅速地下了楼。","source":"adaptation","pdfPage":245,"printedPage":241,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He turned on the light, but he couldn't see anyone. The thieves had already gone.","cn":"他打开了灯，但看不到一个人，小偷们已经逃走了。","source":"adaptation","pdfPage":245,"printedPage":241,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"But George's parrot, Henry, was still there.","cn":"但是乔治的鹦鹉亨利还在那里。","source":"adaptation","pdfPage":245,"printedPage":241,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“What's up, George?” it called. “Nothing, Henry,” George said and smiled. “Go back to sleep.”","cn":"“什么事，乔治？”鹦鹉喊着。“没事，亨利。”乔治笑着说，“接着睡觉吧。”","source":"adaptation","pdfPage":245,"printedPage":241,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"happen to 与 as…as","chat":"happen（发生）后面用 to 接人：It happened to me.（发生在我身上）。「尽可能快」= as quickly as they could（as…as 中间放副词）。happen 没有被动语态！","formula":"happen to sb 发生在某人身上 ｜ as + 副词 + as one can = 尽可能……","examples":[{"en":"It happened to a friend of mine a year ago.","cn":"这是一年前发生在我朋友身上的事。","source":"supplement"},{"en":"They ran away as quickly as they could.","cn":"他们飞快地逃走了。","source":"supplement"},{"en":"What's up?","cn":"怎么回事？","source":"supplement"}],"watch":"happen 不能用被动：It was happened ❌ → It happened ✓！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":245,"printedPage":241,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"The thieves ran away as ___ as they could.","opts":["quickly","quick","quicker","quickest"],"a":"quickly","why":"修饰 ran 用副词。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":245,"printedPage":241,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"It ___ to a friend of mine.","opts":["happened","happen","happening","happens"],"a":"happened","why":"一年前的事，用过去式。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":245,"printedPage":241,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"是谁吓跑了小偷？","opts":["一只鹦鹉","警察","乔治的狗","一位邻居"],"a":"一只鹦鹉","hint":"George's parrot, Henry","why":"鹦鹉喊 What's up? 小偷以为有人。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":245,"printedPage":241,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"小偷逃跑时丢下了什么？","opts":["手电筒","钱","鞋子","包"],"a":"手电筒","hint":"The thieves dropped the torch","why":"慌忙逃走顾不上了。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":245,"printedPage":241,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":120,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":119},{"id":121,"title":"The man in a hat","titleCn":"戴帽子的男士","kind":"text","words":[{"en":"customer","ipa":"/ˈkʌstəmə/","cn":"n. 顾客","source":"supplement"},{"en":"forget","ipa":"/fəˈɡet/","cn":"v. 忘记（forgot）","source":"supplement"},{"en":"manager","ipa":"/ˈmænɪdʒə/","cn":"n. 经理","source":"supplement"},{"en":"serve","ipa":"/sɜːv/","cn":"v. 接待（顾客），服务","source":"supplement"},{"en":"counter","ipa":"/ˈkaʊntə/","cn":"n. 柜台","source":"supplement"},{"en":"recognize","ipa":"/ˈrekəɡnaɪz/","cn":"v. 认出","source":"supplement"},{"en":"hour","ipa":"/ˈaʊə/","cn":"n. 小时","source":"supplement"}],"patterns":[{"en":"I forgot to take them with me.","cn":"我忘了把它们带走。","source":"textbook","pdfPage":249,"printedPage":245,"verification":"verified","translationSource":"supplement"},{"en":"Who served you, sir?","cn":"先生，是谁接待您的？","source":"textbook","pdfPage":249,"printedPage":245,"verification":"verified","translationSource":"supplement"},{"en":"The lady who is standing behind the counter.","cn":"站在柜台后面的那位女士。","source":"textbook","pdfPage":249,"printedPage":245,"verification":"verified","translationSource":"supplement"}],"grammar":"forget to do sth 忘记去做某事；定语从句补充说明人或物：the lady who is standing behind the counter（站在柜台后面的女士）。","tip":"本课用 who/that 说明人，用 which 说明物；从句紧跟它所修饰的名词。戴帽子的是顾客，不是接待他的卡罗琳。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":249,"printedPage":245,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}],"teachingSource":"supplement","text":[{"en":"I bought two expensive dictionaries here half an hour ago, but I forgot to take them with me.","cn":"半小时前我在这里买了两本很贵的词典，但忘了带走。","speaker":"CUSTOMER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Who served you, sir?","cn":"先生，是谁接待您的？","speaker":"MANAGER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"The lady who is standing behind the counter.","cn":"站在柜台后面的那位女士。","speaker":"CUSTOMER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Which books did you buy?","cn":"您买的是哪几本书？","speaker":"MANAGER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"The books which are on the counter.","cn":"柜台上的那些书。","speaker":"CUSTOMER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Did you serve this gentleman half an hour ago, Caroline?","cn":"卡罗琳，半小时前是你接待的这位先生吗？","speaker":"MANAGER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"He says he's the man who bought these books.","cn":"他说他就是买这些书的人。","speaker":"MANAGER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I can't remember.","cn":"我想不起来了。","speaker":"CAROLINE","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"The man who I served was wearing a hat.","cn":"我接待的那个人戴着帽子。","speaker":"CAROLINE","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Have you got a hat, sir?","cn":"先生，您有帽子吗？","speaker":"MANAGER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Yes, I have.","cn":"是的，我有。","speaker":"CUSTOMER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Would you put it on, please?","cn":"请您把帽子戴上好吗？","speaker":"MANAGER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"All right.","cn":"好的。","speaker":"CUSTOMER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Is this the man that you served, Caroline?","cn":"卡罗琳，这就是你接待的那个人吗？","speaker":"MANAGER","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Yes.","cn":"是的。","speaker":"CAROLINE","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I recognize him now.","cn":"我现在认出他来了。","speaker":"CAROLINE","pdfPage":249,"printedPage":245,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"}],"teach":{"title":"定语从句：贴在名词后的说明","chat":"想给名词加一段说明（……的那个人/东西），用定语从句。本课用 who/that 说明人、which 说明物：The lady who is standing behind the counter.（站在柜台后面的女士。）接待顾客的是卡罗琳，戴帽子的是顾客。","formula":"本课：人 + who/that + 说明 ｜ 物 + which + 说明","examples":[{"en":"Who served you, sir?","cn":"先生，是谁接待您的？","source":"supplement"},{"en":"The lady who is standing behind the counter.","cn":"站在柜台后面的那位女士。","source":"supplement"},{"en":"The books which are on the counter.","cn":"柜台上的那些书。","source":"supplement"}],"watch":"从句是名词的「小尾巴」，必须紧贴在名词后面，不能甩到句尾哦！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":249,"printedPage":245,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}},"ex":{"g":[{"q":"The lady ___ is standing behind the counter.","opts":["who","which","what","whose"],"a":"who","why":"这里用 who 引导说明 lady 的定语从句；接待顾客的是站在柜台后的女士。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":249,"printedPage":245,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"},"hint":""},{"q":"I forgot ___ them with me.","opts":["to take","taking","took","take"],"a":"to take","why":"forget to do 忘记去做。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":249,"printedPage":245,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"},"hint":""}],"c":[{"q":"顾客买了什么？","opts":["两本很贵的词典","两顶帽子","几本杂志","两本相册"],"a":"两本很贵的词典","hint":"I bought two expensive dictionaries","why":"顾客买了两本很贵的词典，但忘了带走。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":249,"printedPage":245,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}},{"q":"卡罗琳在顾客做什么后认出了他？","opts":["戴上帽子","买一顶新帽子","站到柜台后","打电话"],"a":"戴上帽子","hint":"Would you put it on, please? / I recognize him now.","why":"卡罗琳记得自己接待的人戴着帽子；顾客戴上帽子后，她才认出他。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":249,"printedPage":245,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}}]}},{"id":122,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":121},{"id":123,"title":"A trip to Australia","titleCn":"澳大利亚之行","kind":"text","words":[{"en":"Australia","ipa":"/ɒˈstreɪliə/","cn":"n. 澳大利亚","source":"supplement"},{"en":"during","ipa":"/ˈdjʊərɪŋ/","cn":"prep. 在……期间","source":"supplement"},{"en":"trip","ipa":"/trɪp/","cn":"n. 旅行","source":"supplement"},{"en":"travel","ipa":"/ˈtrævl/","cn":"v. 旅行","source":"supplement"},{"en":"offer","ipa":"/ˈɒfə/","cn":"v. 提供","source":"supplement"},{"en":"guess","ipa":"/ɡes/","cn":"v. 猜","source":"supplement"},{"en":"grow","ipa":"/ɡrəʊ/","cn":"v. 长，留（胡子）（grew）","source":"supplement"},{"en":"beard","ipa":"/bɪəd/","cn":"n. （下巴上的）胡须","source":"supplement"},{"en":"shave","ipa":"/ʃeɪv/","cn":"v. 刮（胡子）","source":"supplement"}],"patterns":[{"en":"This is a photograph I took during my trip to Australia.","cn":"这是我在澳大利亚旅行期间拍的一张照片。","source":"textbook","pdfPage":253,"printedPage":249,"verification":"verified","translationSource":"supplement"},{"en":"Do you know the man who's standing there?","drill":true,"cn":"你认识站在那儿的那个人吗？","source":"supplement"},{"en":"I grew a beard during the trip, but I shaved it off when I came home.","cn":"我旅行时留了胡子，但我到家后就把它刮掉了。","source":"textbook","pdfPage":253,"printedPage":249,"verification":"verified","translationSource":"supplement"}],"grammar":"who / which 引导定语从句复习；grew a beard 留胡子，shave ... off 刮掉。","tip":"during + 名词（during the trip），while + 句子（while I was travelling）——两者都表“在……期间”。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":253,"printedPage":249,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}],"teachingSource":"supplement","text":[{"en":"Look, Scott.","cn":"看，斯科特。","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"This is a photograph I took during my trip to Australia.","cn":"这是我在澳大利亚旅行期间拍的一张照片。","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Let me see it, Mike.","cn":"让我看看，迈克。","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"This is a good photograph.","cn":"这张照片拍得很好。","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Who are these people?","cn":"这些人是谁？","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"They're people I met during the trip.","cn":"他们是我在旅行期间认识的人。","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"That's the ship we travelled on.","cn":"那是我们乘坐的船。","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"What a beautiful ship!","cn":"多漂亮的船啊！","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Who's this?","cn":"这是谁？","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"That's the man I told you about.","cn":"那就是我跟你说过的那个人。","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Remember?","cn":"还记得吗？","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Ah yes.","cn":"啊，记得。","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"The one who offered you a job in Australia.","cn":"就是那个在澳大利亚给你提供工作的人。","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"That's right.","cn":"对。","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Who's this?","cn":"这是谁？","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Guess!","cn":"猜猜看！","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It's not you, is it?","cn":"不是你，对吧？","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"That's right.","cn":"正是我。","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I grew a beard during the trip, but I shaved it off when I came home.","cn":"我在旅行期间留了胡子，但回家时就把它刮掉了。","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Why did you shave it off?","cn":"你为什么把胡子刮掉？","speaker":"SCOTT","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"My wife didn't like it!","cn":"我妻子不喜欢！","speaker":"MIKE","source":"textbook","pdfPage":253,"printedPage":249,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"}],"teach":{"title":"during 与过去式拍档","chat":"during + 名词表示「在……期间」：during the trip（旅行期间）。两个新过去式：grow→grew（grow a beard 留胡子）、shave…off（刮掉）。","formula":"during + 名词（在……期间）｜ grow a beard 留胡子 ｜ shave it off 刮掉","examples":[{"en":"This is a photograph I took during my trip to Australia.","cn":"这是我在澳大利亚旅行期间拍的一张照片。","source":"supplement"},{"en":"I grew a beard during the trip.","cn":"我旅行时留了胡子。","source":"supplement"},{"en":"But I shaved it off when I came home.","cn":"但我到家就刮掉了。","source":"supplement"}],"watch":"during + 名词，while + 句子：during the trip = while I was travelling！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":253,"printedPage":249,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},"ex":{"g":[{"q":"I grew a beard ___ the trip.","opts":["during","while","when","at"],"a":"during","why":"表示“在旅行期间”，during 后接名词短语 the trip；while/when 通常接表示时间的句子。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":253,"printedPage":249,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""},{"q":"I ___ a beard during the trip.","opts":["grew","growed","grow","grown"],"a":"grew","why":"grow 不规则过去式 grew。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":253,"printedPage":249,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""}],"c":[{"q":"旅行去了哪里？","opts":["澳大利亚","美国","中国","日本"],"a":"澳大利亚","hint":"my trip to Australia","why":"照片是旅行时拍的。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":253,"printedPage":249,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},{"q":"到家后他把胡子怎么了？","opts":["刮掉了","留得更长","染了色","编了起来"],"a":"刮掉了","hint":"I shaved it off when I came home.","why":"迈克说回家时刮掉了胡子，因为妻子不喜欢；照片中的胡子让斯科特一时没认出他。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":253,"printedPage":249,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}}]}},{"id":124,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":123},{"id":125,"title":"Tea for two","titleCn":"两人一起喝茶","kind":"text","words":[{"en":"terribly","ipa":"/ˈterəbli/","cn":"adv. 非常地","source":"supplement"},{"en":"dry","ipa":"/draɪ/","cn":"adj. 干燥的","source":"supplement"},{"en":"nuisance","ipa":"/ˈnjuːsns/","cn":"n. 讨厌的事或人","source":"supplement"},{"en":"mean","ipa":"/miːn/","cn":"v. 意味着","source":"supplement"},{"en":"have to","ipa":"/ˈhæftə/","cn":"phr. 不得不，必须","source":"supplement"},{"en":"needn't","ipa":"/ˈniːdnt/","cn":"phr. 不必（= need not）","source":"supplement"}],"patterns":[{"en":"Do you have to water the garden every day?","cn":"你一定要每天浇花园吗？","source":"adaptation"},{"en":"It's terribly dry.","cn":"天太干燥了。","source":"adaptation"},{"en":"You needn't water the garden now.","cn":"你现在不必浇花园了。","source":"adaptation"},{"en":"What a nuisance!","cn":"真讨厌！","source":"adaptation"}],"grammar":"have to 表示客观上的“必须”（三单 has to）；needn't 表示“不必”；mustn't 表示“千万别”（禁止），与 needn't 完全不同。","tip":"考试重点：对 Must I...? 的否定回答用 No, you needn't.（不必），不能用 mustn't；感叹句 What a + 名词！","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":257,"printedPage":253,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Can't you come in and have tea now, Peter?","cn":"彼得，你现在能进来喝茶吗？","source":"adaptation","pdfPage":257,"printedPage":253,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Not yet, dear. I must water the garden first.","cn":"还不行，亲爱的。我必须先给花园浇水。","source":"adaptation","pdfPage":257,"printedPage":253,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Do you have to water it now?","cn":"你一定得现在浇吗？","source":"adaptation","pdfPage":257,"printedPage":253,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm afraid I do. It's terribly dry.","cn":"恐怕我得浇。这天太干燥了。","source":"adaptation","pdfPage":257,"printedPage":253,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What a nuisance!","cn":"真讨厌！","source":"adaptation","pdfPage":257,"printedPage":253,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Last summer it was very dry, too. Don't you remember? I had to water it every day.","cn":"去年夏天也是这样干燥。你记得吗？我不得不每天浇水。","source":"adaptation","pdfPage":257,"printedPage":253,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Well, I'll have tea ready for you when you come in.","cn":"好吧，等你进来，茶就准备好了。","source":"adaptation","pdfPage":257,"printedPage":253,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Good heavens! It's raining. That means I needn't water the garden!","cn":"天啊！下雨了。这就是说我不用给花园浇水了！","source":"adaptation","pdfPage":257,"printedPage":253,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"have to 与 needn't 再登场","chat":"have to 表示「客观上不得不」（三单变 has to）；「不必」是 needn't！再强调一次：mustn't 是「禁止」，needn't 才是「不必」，这对兄弟总在考试出现！","formula":"have to = 不得不 ｜ needn't = 不必 ｜ mustn't = 禁止","examples":[{"en":"Do you have to water it now?","cn":"你一定得现在浇吗？","source":"supplement"},{"en":"I'm afraid I do. It's terribly dry.","cn":"恐怕得浇，天太干了。","source":"supplement"},{"en":"You needn't water the garden.","cn":"你不用浇花园了。","source":"supplement"}],"watch":"感叹句公式：What a + 名词！What a nuisance!（真讨厌！）What a pity!（真遗憾！）","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":257,"printedPage":253,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"Do you have ___ water the garden now?","opts":["to","for","at","in"],"a":"to","why":"have to + 动词原形。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":257,"printedPage":253,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"You ___ water the garden now.（不必）","opts":["needn't","mustn't","can't","don't"],"a":"needn't","why":"needn't = 不必。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":257,"printedPage":253,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"彼得为什么要浇花园？","opts":["天太干燥了","因为下雨","苏珊让他玩","花是新种的"],"a":"天太干燥了","hint":"It's terribly dry.","why":"去年夏天也很干。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":257,"printedPage":253,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"结尾发生了什么？","opts":["下雨了","下雪了","刮大风","出太阳"],"a":"下雨了","hint":"Good heavens! It's raining.","why":"不用浇水了，正好进来喝茶。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":257,"printedPage":253,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":126,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":125},{"id":127,"title":"A famous actress","titleCn":"著名的女演员","kind":"text","words":[{"en":"famous","ipa":"/ˈfeɪməs/","cn":"adj. 著名的","source":"supplement"},{"en":"actress","ipa":"/ˈæktrəs/","cn":"n. 女演员","source":"supplement"},{"en":"actor","ipa":"/ˈæktə/","cn":"n. 男演员","source":"supplement"},{"en":"at least","ipa":"/ət liːst/","cn":"phr. 至少","source":"supplement"},{"en":"opinion","ipa":"/əˈpɪnjən/","cn":"n. 看法，意见","source":"supplement"},{"en":"thirty","ipa":"/ˈθɜːti/","cn":"num. 三十","source":"supplement"},{"en":"forty","ipa":"/ˈfɔːti/","cn":"num. 四十","source":"supplement"}],"patterns":[{"en":"I read she's twenty-nine, but she must be at least forty.","cn":"我读到她是二十九岁，但她一定至少有四十岁了。","source":"textbook","pdfPage":261,"printedPage":257,"verification":"verified","translationSource":"supplement"},{"en":"She was a famous actress when I was still at school.","cn":"我还在上学时，她就已经是著名的女演员了。","source":"textbook","pdfPage":261,"printedPage":257,"verification":"verified","translationSource":"supplement"},{"en":"In my opinion, she's about forty.","drill":true,"cn":"依我看，她大约四十岁。","source":"supplement"}],"grammar":"must be 表示有把握的推测（“肯定是”）；in my opinion 依我看；at least 至少。","tip":"推测三档：must be 肯定是 → may be 可能是 → can't be 不可能是。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":261,"printedPage":257,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}],"teachingSource":"supplement","text":[{"en":"Can you recognize that woman, Liz?","cn":"莉兹，你能认出那个女人吗？","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I think I can, Kate.","cn":"我想我能，凯特。","speaker":"LIZ","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It must be Karen Marsh, the actress.","cn":"她一定是女演员卡伦·马什。","speaker":"LIZ","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I thought so.","cn":"我也这样想。","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Who's that beside her?","cn":"她旁边的人是谁？","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"That must be Conrad Reeves.","cn":"那一定是康拉德·里夫斯。","speaker":"LIZ","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Conrad Reeves, the actor?","cn":"男演员康拉德·里夫斯？","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"It can't be.","cn":"不可能是他。","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Let me have another look.","cn":"让我再看一眼。","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I think you're right!","cn":"我想你说对了！","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Isn't he her third husband?","cn":"他不是她的第三任丈夫吗？","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"No. He must be her fourth or fifth.","cn":"不，他一定是她的第四任或第五任。","speaker":"LIZ","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Doesn't Karen Marsh look old!","cn":"卡伦·马什看上去多显老啊！","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"She does, doesn't she!","cn":"是啊，不是吗！","speaker":"LIZ","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I read she's twenty-nine, but she must be at least forty.","cn":"我读到她是二十九岁，但她一定至少有四十岁了。","speaker":"LIZ","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I'm sure she is.","cn":"我肯定她有了。","speaker":"KATE","pdfPage":261,"printedPage":257,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"She was a famous actress when I was still at school.","cn":"我还在上学时，她就已经是著名的女演员了。","speaker":" fPage":277,"printedPage":273,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Well, I may. I can't make up my mind. I shall have to ask my future husband. He won't let me make another film.","cn":"嗯，有可能。我还拿不定主意。我得问一下我的未婚夫，他不会让我再拍影片的。","source":"adaptation","pdfPage":277,"printedPage":273,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Your future husband, Miss Marsh?","cn":"您的未婚夫，马什小姐？","source":"adaptation","pdfPage":277,"printedPage":273,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes. Let me introduce him to you.","cn":"是的，让我把他介绍给您。","source":"adaptation","pdfPage":277,"printedPage":273,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Listen to this! “Karen Marsh: The Latest Report. Miss Marsh told reporters this morning that she might retire. She said she couldn't make up her mind. She said she would have to ask her future husband. She said her future husband would not let her make another film.”","cn":"听听这一段！“卡伦·马什：最新消息。马什小姐今天上午告诉记者她可能要退休。她说她还拿不定主意。她说她得问问她的未婚夫。她说她的未婚夫不会再让她拍电影。”","source":"adaptation","pdfPage":277,"printedPage":273,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Good heavens! That reporter is her future husband!","cn":"天啊！那位记者就是她的未婚夫！","source":"adaptation","pdfPage":277,"printedPage":273,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"转述将来：will 变 would","chat":"转述「将来的打算」，will 要变成 would：She said she would ask her future husband.（她说她会问未婚夫）。get married = 结婚；最新的 = the latest。","formula":"said (that) + 主语 + would + 动词原形","examples":[{"en":"Are you really going to retire?","cn":"您真准备退休吗？","source":"supplement"},{"en":"I can't make up my mind.","cn":"我还拿不定主意。","source":"supplement"},{"en":"She said she would have to ask her future husband.","cn":"她说她得问问未婚夫。","source":"supplement"}],"watch":"would 是 will 的过去式：I will… → He said he would…——总是后退一步！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":277,"printedPage":273,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"She said she ___ have to ask her future husband.","opts":["would","will","shall","can"],"a":"would","why":"转述将来：will → would。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":277,"printedPage":273,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"I can't make ___ my mind.","opts":["up","on","out","of"],"a":"up","why":"make up one's mind 下决心。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":277,"printedPage":273,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"马什小姐的未婚夫是谁？","opts":["记者艾伦·琼斯","经理","她的牙医","乔治"],"a":"记者艾伦·琼斯","hint":"她把记者介绍给了大家——他就是未婚夫！","why":"课文的反转：记者「自曝」。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":277,"printedPage":273,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"报纸把这则新闻叫什么？","opts":["最新消息（The Latest Report）","车祸","天气新闻","零钱"],"a":"最新消息（The Latest Report）","hint":"The latest report!","why":"报纸头条。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":277,"printedPage":273,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":136,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":135},{"id":137,"title":"A pleasant dream","titleCn":"美好的梦","kind":"text","words":[{"en":"football","ipa":"/ˈfʊtbɔːl/","cn":"n. 足球","source":"supplement"},{"en":"pool","ipa":"/puːl/","cn":"n. 赌注（the football pools 足球博彩）","source":"supplement"},{"en":"win","ipa":"/wɪn/","cn":"v. 赢（won）","source":"supplement"},{"en":"world","ipa":"/wɜːld/","cn":"n. 世界","source":"supplement"},{"en":"depend","ipa":"/dɪˈpend/","cn":"v. 依靠（depend on 取决于）","source":"supplement"},{"en":"if","ipa":"/ɪf/","cn":"conj. 如果","source":"supplement"},{"en":"round","ipa":"/raʊnd/","cn":"adv. 周围（travel round the world 环游世界）","source":"supplement"}],"patterns":[{"en":"What will you do if you win a lot of money?","cn":"如果你赢了许多钱，你打算做什么呢？","source":"adaptation"},{"en":"If we win the football pools, we'll travel round the world.","cn":"如果我们赢得足球博彩，我们就去周游世界。","source":"adaptation"},{"en":"It's only a pleasant dream.","drill":true,"cn":"这只是一个美好的梦。","source":"supplement"}],"grammar":"真实条件句：If + 一般现在时，主句用 will + 动词原形；if 从句可以放在句首或句尾。","tip":"条件句口诀“主将从现”：主句用将来时，if 从句用现在时——不能说 If we'll win...","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":281,"printedPage":277,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Do you do the football pools, Harry?","cn":"哈里，你买足球赛赌注吗？","source":"adaptation","pdfPage":281,"printedPage":277,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I do. Every week, but I never win anything.","cn":"是的，我每星期都买，可是从来没赢过。","source":"adaptation","pdfPage":281,"printedPage":277,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What will you do if you win a lot of money?","cn":"要是你赢了许多钱，你打算做什么呢？","source":"adaptation","pdfPage":281,"printedPage":277,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"If I win a lot of money I'll buy you a mink coat.","cn":"要是我赢了许多钱，我就给你买件貂皮大衣。","source":"adaptation","pdfPage":281,"printedPage":277,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I don't want a mink coat. I want to see the world.","cn":"我不要貂皮大衣，我要去看看世界。","source":"adaptation","pdfPage":281,"printedPage":277,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"All right. If we win a lot of money, we'll travel round the world and we'll stay at the best hotels. Then we'll return home and buy a big house in the country. We'll have a beautiful garden and…","cn":"好吧。要是我们赢了很多钱，我们就去周游世界，并且住最好的旅馆。然后我们回家，在乡下买幢大房子。我们将有一个漂亮的花园，还有……","source":"adaptation","pdfPage":281,"printedPage":277,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"But if we spend all that money we'll be poor again. What will we do then?","cn":"但是如果我们把所有的钱都花光了，我们又会变穷的。那时我们怎么办呢？","source":"adaptation","pdfPage":281,"printedPage":277,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"If we spend all the money we'll try and win the football pools again!","cn":"如果我们把所有的钱都花光了，我们就再去试一试赢得足球赛赌注！","source":"adaptation","pdfPage":281,"printedPage":277,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"if 条件句：主将从现","chat":"真实的假设用 if 条件句，口诀「主将从现」：if 从句用一般现在时，主句用 will：If we win, we'll travel round the world.（如果赢了，我们就环游世界。）","formula":"If + 一般现在时, 主语 + will + 动词原形","examples":[{"en":"What will you do if you win a lot of money?","cn":"如果你赢了很多钱，你会做什么？","source":"supplement"},{"en":"If we win the pools, we'll travel round the world.","cn":"如果我们赢了，我们就环游世界。","source":"supplement"},{"en":"If we spend all the money we'll be poor again.","cn":"把钱花光我们又会变穷的。","source":"supplement"}],"watch":"if 后面绝对不能用 will：If we'll win ❌ → If we win ✓——这就是「主将从现」！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":281,"printedPage":277,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"If we ___ the pools, we'll travel round the world.","opts":["win","will win","won","winning"],"a":"win","why":"主将从现：if 从句用现在时。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":281,"printedPage":277,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"What will you do if you ___ a lot of money?","opts":["win","wins","will win","won"],"a":"win","why":"从句主语 you 用一般现在时 win。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":281,"printedPage":277,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"如果赢了，妻子想做什么？","opts":["去看看世界","买件貂皮大衣","买大房子","呆在家"],"a":"去看看世界","hint":"I don't want a mink coat. I want to see the world.","why":"丈母娘? 不——是妻子不要貂皮大衣。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":281,"printedPage":277,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"如果钱花光了怎么办？","opts":["再去赢足球赌注","去上班","卖房子","再旅行一次"],"a":"再去赢足球赌注","hint":"we'll try and win the football pools again!","why":"美梦继续！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":281,"printedPage":277,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":138,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":137},{"id":139,"title":"Is that you, John?","titleCn":"是你吗，约翰？","kind":"text","words":[{"en":"extra","ipa":"/ˈekstrə/","cn":"adj. 额外的","source":"supplement"},{"en":"overseas","ipa":"/ˌəʊvəˈsiːz/","cn":"adj. 海外的，国外的","source":"supplement"},{"en":"engineering","ipa":"/ˌendʒɪˈnɪərɪŋ/","cn":"n. 工程","source":"supplement"},{"en":"company","ipa":"/ˈkʌmpəni/","cn":"n. 公司","source":"supplement"},{"en":"line","ipa":"/laɪn/","cn":"n. 线路（电话线）","source":"supplement"},{"en":"speaking","ipa":"/ˈspiːkɪŋ/","cn":"int. 我就是（电话用语）","source":"supplement"}],"patterns":[{"en":"Is that you, John?","cn":"是你吗，约翰？（电话用语）","source":"textbook","pdfPage":285,"printedPage":281,"verification":"verified","translationSource":"supplement"},{"en":"Yes, speaking.","cn":"是我，请讲。","source":"textbook","pdfPage":285,"printedPage":281,"verification":"verified","translationSource":"supplement"},{"en":"Tell Mary we'll be late for dinner this evening.","cn":"告诉玛丽，今晚吃饭我们会晚到。","source":"textbook","pdfPage":285,"printedPage":281,"verification":"verified","translationSource":"supplement"}],"grammar":"本课电话开头用 Is that you, John? 确认对方身份，回答 Yes, speaking.；tell sb (that) + 从句表示转告。后来才发现接电话的是电话工程师，不是要找的那位同名朋友。","tip":"电话里介绍自己常说 This is John；但本课核实姓名时也确实说 Yes, I’m John Smith.，不能把 I am John 一概说成错误。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":285,"printedPage":281,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}],"teachingSource":"supplement","text":[{"en":"Is that you, John?","cn":"是你吗，约翰？","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Yes, speaking.","cn":"是的，我就是。","speaker":"JOHN SMITH","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Tell Mary we'll be late for dinner this evening.","cn":"告诉玛丽，今晚吃饭我们会晚到。","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I'm afraid I don't understand.","cn":"恐怕我不明白。","speaker":"JOHN SMITH","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Hasn't Mary told you?","cn":"玛丽没有告诉你吗？","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"She invited Charlotte and me to dinner this evening.","cn":"她邀请夏洛特和我今晚去吃饭。","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I said I would be at your house at six o'clock, but the boss wants me to do some extra work.","cn":"我说过六点到你家，但老板要我加做一些工作。","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I'll have to stay at the office.","cn":"我只好留在办公室。","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I don't know when I'll finish.","cn":"我不知道什么时候能做完。","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Oh, and by the way, my wife wants to know if Mary needs any help.","cn":"哦，顺便说一下，我妻子想知道玛丽是否需要帮忙。","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I don't know what you're talking about.","cn":"我不知道你在说什么。","speaker":"JOHN SMITH","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"That is John Smith, isn't it?","cn":"你是约翰·史密斯，对吗？","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Yes, I'm John Smith.","cn":"是的，我是约翰·史密斯。","speaker":"JOHN SMITH","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"You are John Smith, the engineer, aren't you?","cn":"你是工程师约翰·史密斯，对吗？","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"That's right.","cn":"没错。","speaker":"JOHN SMITH","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"You work for the Overseas Engineering Company, don't you?","cn":"你在海外工程公司工作，对吗？","speaker":"GRAHAM TURNER","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"No, I don't.","cn":"不，我不在那里工作。","speaker":"JOHN SMITH","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I'm John Smith the telephone engineer and I'm repairing your telephone line.","cn":"我是电话工程师约翰·史密斯，正在修理您的电话线路。","speaker":"JOHN SMITH","pdfPage":285,"printedPage":281,"source":"textbook","sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"}],"teach":{"title":"电话用语：Is that…?","chat":"英语打电话问「你是……吗」用 Is that…?，回答 Yes, speaking.（我是，请讲）。转告某人一件事：tell + 人 + (that) + 内容。","formula":"Is that…(名字)? → Yes, speaking. ｜ tell + 人 + (that) + 句子","examples":[{"en":"Is that you, John?","cn":"是你吗，约翰？","source":"supplement"},{"en":"Yes, speaking.","cn":"是我，请讲。","source":"supplement"},{"en":"Tell Mary we'll be late for dinner this evening.","cn":"告诉玛丽，今晚吃饭我们会晚到。","source":"supplement"}],"watch":"电话开场介绍自己常用 This is…；本课核实姓名时也说 Yes, I’m John Smith.。格雷厄姆认错了同名的人，接电话的是正在修理线路的电话工程师。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":285,"printedPage":281,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}},"ex":{"g":[{"q":"___ that you, John?","opts":["Is","Are","Am","Do"],"a":"Is","why":"电话用语 Is that…?","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":285,"printedPage":281,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"},"hint":""},{"q":"Tell Mary we'll be ___ for dinner.","opts":["late","later","latest","late to"],"a":"late","why":"be late for 迟到。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":285,"printedPage":281,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"},"hint":""}],"c":[{"q":"实际接电话的约翰·史密斯是什么身份？","opts":["正在修线路的电话工程师","海外工程公司的朋友","玛丽的厨师","格雷厄姆的老板"],"a":"正在修线路的电话工程师","hint":"I'm John Smith the telephone engineer and I'm repairing your telephone line.","why":"格雷厄姆认错了同名的人；实际接电话的是电话工程师，不是承诺转告玛丽的朋友。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":285,"printedPage":281,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}},{"q":"格雷厄姆说自己为什么会晚到晚饭？","opts":["老板要他加做工作","饭已经凉了","电话工程师请他吃饭","玛丽取消了邀请"],"a":"老板要他加做工作","hint":"the boss wants me to do some extra work","why":"他要留在办公室加做工作，不知道何时结束；但接电话的并不是他以为的那位朋友。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":285,"printedPage":281,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, complete English-body and speaker","note":"二轮按proposal完整recommended逐行回看原页扫描确证；cn为补充翻译，未核教材参考译文；不含下一页词表、练习册或教师书。"}}]}},{"id":140,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":139},{"id":141,"title":"Sally's first train ride","titleCn":"萨莉第一次乘火车旅行","kind":"text","words":[{"en":"excited","ipa":"/ɪkˈsaɪtɪd/","cn":"adj. 兴奋的","source":"supplement"},{"en":"decide","ipa":"/dɪˈsaɪd/","cn":"v. 决定","source":"supplement"},{"en":"middle-aged","ipa":"/ˈmɪdl eɪdʒd/","cn":"adj. 中年的","source":"supplement"},{"en":"opposite","ipa":"/ˈɒpəzɪt/","cn":"prep. 在……对面","source":"supplement"},{"en":"curiously","ipa":"/ˈkjʊəriəsli/","cn":"adv. 好奇地","source":"supplement"},{"en":"funny","ipa":"/ˈfʌni/","cn":"adj. 有趣的，好笑的","source":"supplement"},{"en":"powder","ipa":"/ˈpaʊdə/","cn":"n. 香粉，粉","source":"supplement"},{"en":"ugly","ipa":"/ˈʌɡli/","cn":"adj. 丑陋的","source":"supplement"},{"en":"amused","ipa":"/əˈmjuːzd/","cn":"adj. 感到有趣的","source":"supplement"},{"en":"embarrassed","ipa":"/ɪmˈbærəst/","cn":"adj. 尴尬的","source":"supplement"}],"patterns":[{"en":"Sally was invited to a children's party.","cn":"萨莉应邀参加一个儿童聚会。","source":"adaptation"},{"en":"She had never travelled on a train before.","cn":"她以前从未坐过火车。","source":"adaptation"},{"en":"She sat opposite the middle-aged lady.","cn":"她坐在一位中年妇女的对面。","source":"adaptation"}],"grammar":"被动语态 was invited（be + 过去分词）；过去完成时 had never done 表示“在过去某时之前从未……”。","tip":"-ing / -ed 分清主客体：exciting 令人兴奋（事物），excited 感到兴奋（人）；embarrassing 事尴尬，embarrassed 人尴尬。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":289,"printedPage":285,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"When my four-year-old daughter, Sally, was invited to a children's party, I decided to take her by train. Sally was very excited because she had never travelled on a train before.","cn":"当我的4岁女儿萨莉被邀请去参加一个儿童聚会时，我决定带她乘火车去。萨莉非常激动，因为她从未乘过火车。","source":"adaptation","pdfPage":289,"printedPage":285,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"She sat near the window and asked questions about everything she saw.","cn":"她靠着车窗坐着，对她看到的一切都要问些什么。","source":"adaptation","pdfPage":289,"printedPage":285,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Suddenly, a middle-aged lady came into our compartment and sat opposite Sally.","cn":"突然，一位中年妇女进了我们的车厢，坐在萨莉的对面。","source":"adaptation","pdfPage":289,"printedPage":285,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“Hello, little girl,” she said. Sally did not answer, but looked at her curiously.","cn":"“你好，小姑娘，”她说。萨莉没回答，却好奇地看着她。","source":"adaptation","pdfPage":289,"printedPage":285,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The lady was dressed in a blue coat and a large, funny hat.","cn":"那位妇女穿着一件蓝色的大衣，戴着一顶大而滑稽的帽子。","source":"adaptation","pdfPage":289,"printedPage":285,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"After the train had left the station, the lady opened her handbag and took out her powder compact. She then began to make up her face.","cn":"火车开出车站后，那位妇女打开了手提包，拿出了粉盒，然后开始打扮起来。","source":"adaptation","pdfPage":289,"printedPage":285,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“Why are you doing that?” Sally asked.","cn":"“你为什么要那样做呢？”萨莉问。","source":"adaptation","pdfPage":289,"printedPage":285,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“To make myself beautiful,” the lady answered. She put away her compact and smiled kindly.","cn":"“为了把自己打扮漂亮啊，”那位妇女答道。她放好了粉盒，慈祥地微笑着。","source":"adaptation","pdfPage":289,"printedPage":285,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“But you are still ugly,” Sally said. Sally was amused, but I was very embarrassed!","cn":"“可你仍然很难看呀。”萨莉说。萨莉感到很有趣，而我却非常尴尬！","source":"adaptation","pdfPage":289,"printedPage":285,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"被动语态与过去完成时","chat":"动作「落在」主语头上，用被动语态：was invited（被邀请）= be + 过去分词。过去完成时 had done 表示「过去的过去」：她上车之前从未坐过火车 → She had never travelled by train before.","formula":"was/were + 过去分词（被……）｜ had + 过去分词（过去以前就……）","examples":[{"en":"Sally was invited to a children's party.","cn":"萨莉被邀请参加儿童聚会。","source":"supplement"},{"en":"She had never travelled on a train before.","cn":"她之前从未坐过火车。","source":"supplement"},{"en":"She sat opposite Sally.","cn":"她坐在萨莉对面。","source":"supplement"}],"watch":"excited 人感到兴奋，exciting 事物令人兴奋：Sally was excited.（萨莉很兴奋）！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":289,"printedPage":285,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"Sally ___ invited to a children's party.","opts":["was","is","has","been"],"a":"was","why":"被动语态 was invited。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":289,"printedPage":285,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"She had ___ travelled on a train before.","opts":["never","ever","already","just"],"a":"never","why":"had never done 过去完成时。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":289,"printedPage":285,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"萨莉为什么很兴奋？","opts":["从未坐过火车","最爱聚会","喜欢那位女士","看到了大海"],"a":"从未坐过火车","hint":"she had never travelled on a train before","why":"第一次坐火车。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":289,"printedPage":285,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"最后谁感到很尴尬？","opts":["「我」（家长）","萨莉","那位女士","司机"],"a":"「我」（家长）","hint":"Sally was amused, but I was very embarrassed!","why":"女儿说了实话「你还是很难看」。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":289,"printedPage":285,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":142,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":141},{"id":143,"title":"A walk through the woods","titleCn":"林中散步","kind":"text","words":[{"en":"surround","ipa":"/səˈraʊnd/","cn":"v. 包围（be surrounded by）","source":"supplement"},{"en":"wood","ipa":"/wʊd/","cn":"n. 树林（常用复数 woods）","source":"supplement"},{"en":"beauty spot","ipa":"/ˈbjuːti spɒt/","cn":"n. 风景点","source":"supplement"},{"en":"through","ipa":"/θruː/","cn":"prep. 穿过","source":"supplement"},{"en":"visitor","ipa":"/ˈvɪzɪtə/","cn":"n. 参观者，游客","source":"supplement"},{"en":"litter","ipa":"/ˈlɪtə/","cn":"n. 废弃物，垃圾","source":"supplement"},{"en":"throw","ipa":"/θrəʊ/","cn":"v. 扔，抛（threw）","source":"supplement"},{"en":"rubbish","ipa":"/ˈrʌbɪʃ/","cn":"n. 垃圾（不可数）","source":"supplement"},{"en":"tyre","ipa":"/ˈtaɪə/","cn":"n. 轮胎","source":"supplement"},{"en":"prosecute","ipa":"/ˈprɒsɪkjuːt/","cn":"v. 依法检控，起诉","source":"supplement"}],"patterns":[{"en":"I live in a very old town which is surrounded by beautiful woods.","cn":"我住在一个被美丽树林环绕的古老小镇上。","source":"textbook","pdfPage":293,"printedPage":289,"verification":"verified","translationSource":"supplement"},{"en":"Visitors have been asked to keep the woods clean and tidy.","cn":"游客们已被要求保持树林的整洁。","source":"textbook","pdfPage":293,"printedPage":289,"verification":"verified","translationSource":"supplement"},{"en":"Anyone who leaves litter in these woods will be prosecuted.","cn":"凡在这树林里丢弃垃圾的人将被依法处理。","source":"adaptation"}],"grammar":"被动语态小结：is surrounded by（一般现在时）/ have been asked（完成时）/ will be prosecuted（将来时）；which 引导定语从句。","tip":"be covered with 被……覆盖；litter 偏指随手丢弃的废弃物，rubbish 是垃圾总称——第144课收尾：全册核心语法一次看全。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":293,"printedPage":289,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}],"teachingSource":"supplement","text":[{"en":"I live in a very old town which is surrounded by beautiful woods. It is a famous beauty spot.","cn":"我住在一个由美丽的树林环绕的古老小镇上。这是一个著名的风景胜地。","source":"textbook","pdfPage":293,"printedPage":289,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"On Sundays, hundreds of people come from the city to see our town and to walk through the woods.","cn":"每逢星期天，有许许多多人从城里来观看我们的小镇，并在树林中散步。","source":"textbook","pdfPage":293,"printedPage":289,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Visitors have been asked to keep the woods clean and tidy.","cn":"游客已被告知要保持树林的整洁。","source":"textbook","pdfPage":293,"printedPage":289,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Litter baskets have been placed under the trees, but people still throw their rubbish everywhere.","cn":"树下都已放置了废物筐，但人们仍到处扔垃圾。","source":"textbook","pdfPage":293,"printedPage":289,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Last Wednesday, I went for a walk in the woods. What I saw made me very sad.","cn":"上星期三我到树林里去散步。我所看到的一切使我非常难过。","source":"textbook","pdfPage":293,"printedPage":289,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I counted seven old cars and three old refrigerators. The litter baskets were empty and the ground was covered with pieces of paper, cigarette ends, old tyres, empty bottles and rusty tins.","cn":"我数了一下，有7辆旧汽车和3台旧冰箱。废物筐是空的，而满地都是纸片、烟头、旧轮胎、空瓶子和生锈的空罐头盒。","source":"textbook","pdfPage":293,"printedPage":289,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Among the rubbish, I found a sign which said, “Anyone who leaves litter in these woods will be prosecuted!”","cn":"在垃圾堆中，我发现了一块牌子，上面写着：“凡在此树林里丢弃垃圾者，将依法处置！”","source":"textbook","pdfPage":293,"printedPage":289,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"}],"teach":{"title":"被动语态大集合（毕业课）","chat":"本课回顾几种被动表达：is surrounded（被环绕）、have been asked（已被要求）、will be prosecuted（将被依法检控）。which 也可以补充说明名词：a sign which said…（一块写着……的牌子）。","formula":"is/are + 过去分词 ｜ have/has been + 过去分词 ｜ will be + 过去分词","examples":[{"en":"The town is surrounded by beautiful woods.","cn":"小镇被美丽的树林环绕。","source":"supplement"},{"en":"Visitors have been asked to keep the woods clean.","cn":"游客已被要求保持树林整洁。","source":"supplement"},{"en":"Anyone who leaves litter will be prosecuted!","cn":"乱扔垃圾者将被依法处置！","source":"supplement"}],"watch":"surrounded by woods 表示“被树林环绕”；by 在这里引出周围的事物。先理解课文，再分句复习，不必一次背全所有形式。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":293,"printedPage":289,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},"ex":{"g":[{"q":"Anyone who leaves litter ___ prosecuted!","opts":["will be","will","is being","prosecutes"],"a":"will be","why":"将来被动：will be + 过去分词。","so th": "audio/voice/99552de9998a2b82.mp3", "duration": 1.444444 }, "chalk": { "path": "audio/voice/c886ff11f6a51b61.mp3", "duration": 1.634422 }, "change": { "path": "audio/voice/12ea12eace7d655f.mp3", "duration": 1.754422 }, "large": { "path": "audio/voice/d35c416a85b807e9.mp3", "duration": 1.61941 }, "small": { "path": "audio/voice/81db8ebbbbc69c6c.mp3", "duration": 1.67941 }, "all": { "path": "audio/voice/5ef5ef0364b6939c.mp3", "duration": 1.41941 }, "I want some envelopes, please.": { "path": "audio/voice/d1439ff0800ad43b.mp3", "duration": 3.319683 }, "Do you want the large size or the small size?": { "path": "audio/voice/040e7be6bfea5c26.mp3", "duration": 3.643946 }, "The large size, please. And do you have any writing paper?": { "path": "audio/voice/06c8c7d9faaa93a7.mp3", "duration": 5.498912 }, "Yes, we do. I don't have any small pads. I only have large ones. Do you want a pad?": { "path": "audio/voice/768b5981f62bc21b.mp3", "duration": 9.063537 }, "Yes, please. And I want a bottle of glue.": { "path": "audio/voice/a80e20a2264fcbfb.mp3", "duration": 4.679002 }, "A bottle of glue.": { "path": "audio/voice/4f71af553982060f.mp3", "duration": 2.065805 }, "And I want a large box of chalk, too.": { "path": "audio/voice/ececfb48ad4a7607.mp3", "duration": 3.624082 }, "I only have small boxes. Do you want one?": { "path": "audio/voice/8fc05872aefd473e.mp3", "duration": 4.508889 }, "No, thank you.": { "path": "audio/voice/428c7f109e54dac6.mp3", "duration": 2.33932 }, "That's all, thank you.": { "path": "audio/voice/1369740732d7d73e.mp3", "duration": 2.659274 }, "A bad cold": { "path": "audio/voice/98ae55629397b6af.mp3", "duration": 1.884308 }, "feel": { "path": "audio/voice/116c49130f14f514.mp3", "duration": 1.53941 }, "look": { "path": "audio/voice/3c01eba119e00d79.mp3", "duration": 1.51941 }, "call": { "path": "audio/voice/7edb360f06acaef2.mp3", "duration": 1.504399 }, "doctor": { "path": "audio/voice/72f4be89d6ebab14.mp3", "duration": 1.584399 }, "telephone": { "path"
