偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Isn't my car ready yet?","cn":"我的汽车还没有修好吗？","source":"adaptation","pdfPage":181,"printedPage":177,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, I'm afraid not. They're still working on it.","cn":"还没有，恐怕没有。机械师们还在修呢。","source":"adaptation","pdfPage":181,"printedPage":177,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I brought it here three days ago.","cn":"我是3天前送来的。","source":"adaptation","pdfPage":181,"printedPage":177,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I know. Didn't you have a crash?","cn":"是的，我知道。您难道没有出过车祸吗？","source":"adaptation","pdfPage":181,"printedPage":177,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"That's right. I drove it into a lamp-post. Can your mechanics repair it?","cn":"是的，我把汽车撞在电线杆上了。你们的机械师能修好吗？","source":"adaptation","pdfPage":181,"printedPage":177,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Well, they're trying to repair it, sir. But to tell you the truth, you need a new car!","cn":"好吧，他们正在设法修呢，先生。不过说实在的，您需要买一辆新车了！","source":"adaptation","pdfPage":181,"printedPage":177,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"still 与 yet 的位置","chat":"still（仍然）放在 be 动词后面：They're still working on it.（他们还在修呢）。yet（还）放在句尾，配合否定：not ready yet（还没好）。两个不规则过去式一起记：drive→drove、bring→brought。","formula":"主语 + be + still + 动词ing ｜ not… yet 还没……","examples":[{"en":"Isn't your car ready yet?","cn":"你的车还没好吗？","source":"supplement"},{"en":"They're still working on it.","cn":"他们还在修呢。","source":"supplement"},{"en":"I drove it into a lamp-post.","cn":"我把它撞到路灯杆上了。","source":"supplement"}],"watch":"try to do = 设法做：They're trying to repair it. 他们正设法修。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":181,"printedPage":177,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"I ___ it into a lamp-post.","opts":["drove","drived","drink","driven"],"a":"drove","why":"drive 不规则过去式 drove。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":181,"printedPage":177,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"They're still ___ on it.","opts":["working","work","works","worked"],"a":"working","why":"still + 进行时：还在修。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":181,"printedPage":177,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"那位先生把车撞到了什么上？","opts":["路灯杆","树上","墙上","别的车"],"a":"路灯杆","hint":"I drove it into a lamp-post.","why":"车祸的起因。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":181,"printedPage":177,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"接待员最后说先生需要什么？","opts":["一辆新车","一个新轮胎","一根新灯杆","一个新车库"],"a":"一辆新车","hint":"you need a new car!","why":"修不如买，课文的幽默。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":181,"printedPage":177,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":88,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":87},{"id":89,"title":"For sale","titleCn":"待售","kind":"text","words":[{"en":"believe","ipa":"/bɪˈliːv/","cn":"v. 相信","source":"supplement"},{"en":"may","ipa":"/meɪ/","cn":"aux. 可以","source":"supplement"},{"en":"sell","ipa":"/sel/","cn":"v. 卖（sold）","source":"supplement"},{"en":"because","ipa":"/bɪˈkɒz/","cn":"conj. 因为","source":"supplement"},{"en":"retire","ipa":"/rɪˈtaɪə/","cn":"v. 退休","source":"supplement"},{"en":"cost","ipa":"/kɒst/","cn":"v. 花费（cost）","source":"supplement"},{"en":"pound","ipa":"/paʊnd/","cn":"n. 英镑","source":"supplement"},{"en":"worth","ipa":"/wɜːθ/","cn":"adj. 值……钱","source":"supplement"},{"en":"penny","ipa":"/ˈpeni/","cn":"n. 便士（复数 pence）","source":"supplement"},{"en":"since","ipa":"/sɪns/","cn":"prep. 自从","source":"supplement"}],"patterns":[{"en":"I believe this house is for sale.","cn":"我想这房子是要出售的吧？","source":"adaptation"},{"en":"How long have you lived here?","cn":"您在这里住了多久了？","source":"adaptation"},{"en":"I've lived here for twenty years.","cn":"我在这里已经住了二十年了。","source":"adaptation"},{"en":"How much does this house cost?","cn":"这座房子卖多少钱？","source":"adaptation"}],"grammar":"现在完成时 + for（接一段时间）/ since（接时间点）；how much 问价格；for sale 待售。","tip":"for + 时间段，since + 时间点：for twenty years / since 2005；It's worth every penny. 一分钱一分货。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":185,"printedPage":181,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Good afternoon. I believe that this house is for sale.","cn":"下午好。我想这房子是要出售的吧？","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"That's right.","cn":"是的。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"May I have a look at it, please?","cn":"我可以看一看吗？","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, of course. Come in.","cn":"可以，当然可以。请进。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"How long have you lived here?","cn":"您在这里住了多长时间？","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I've lived here for twenty years.","cn":"我在这里住了20年了。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Twenty years! That's a long time.","cn":"20年！这个时间可不短。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I've been here since 1976.","cn":"是啊，从1976年起我就住在这里。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Then why do you want to sell it?","cn":"那么，您为什么要卖掉它呢？","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Because I've just retired. I want to buy a small house in the country.","cn":"因为我刚退休。我想在乡下买幢小房子。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"How much does this house cost?","cn":"这座房子卖多少钱？","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"£68,500.","cn":"68500英镑。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"That's a lot of money!","cn":"那可真是一大笔钱啊！","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"It's worth every penny of it.","cn":"它值那么多钱。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Well, I like the house, but I can't decide yet. My wife must see it first.","cn":"嗯，我喜欢这房子，但我还不能作决定。我妻子必须先来看一看。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Women always have the last word.","cn":"最后作出决定的总是女人。","source":"adaptation","pdfPage":185,"printedPage":181,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"for 和 since 的分工","chat":"现在完成时说「持续了多久」：for + 一段时间（for twenty years 二十年），since + 起点（since 1976 从1976年起）。问价钱用 How much…? 问时长用 How long…?","formula":"have + 过去分词 + for + 时间段 ／ since + 时间点","examples":[{"en":"How long have you lived here?","cn":"您在这里住了多久？","source":"supplement"},{"en":"I've lived here for twenty years.","cn":"我住了20年了。","source":"supplement"},{"en":"I've been here since 1976.","cn":"我从1976年起就住这儿。","source":"supplement"}],"watch":"for 后面跟「20年」这样的长度，since 后面跟「1976年」这样的起点，一个管长度、一个管起点！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":185,"printedPage":181,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"How ___ have you lived here?","opts":["long","much","often","old"],"a":"long","why":"问时长用 How long。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":185,"printedPage":181,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"I've lived here ___ twenty years.","opts":["for","since","at","in"],"a":"for","why":"for + 时间段。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":185,"printedPage":181,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"房主为什么卖房？","opts":["刚退休了","房子太旧","房子太小","不喜欢邻居"],"a":"刚退休了","hint":"Because I've just retired.","why":"想去乡下买小房子。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":185,"printedPage":181,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"这座房子卖多少钱？","opts":["68500英镑","6850英镑","685英镑","68050英镑"],"a":"68500英镑","hint":"£68,500.","why":"It's worth every penny of it.","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":185,"printedPage":181,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":90,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":89},{"id":91,"title":"Poor Ian!","titleCn":"可怜的伊恩！","kind":"text","words":[{"en":"still","ipa":"/stɪl/","cn":"adv. 还，仍旧","source":"supplement"},{"en":"move","ipa":"/muːv/","cn":"v. 搬家；移动","source":"supplement"},{"en":"miss","ipa":"/mɪs/","cn":"v. 想念；错过","source":"supplement"},{"en":"neighbour","ipa":"/ˈneɪbə/","cn":"n. 邻居","source":"supplement"},{"en":"person","ipa":"/ˈpɜːsn/","cn":"n. 人（单数）","source":"supplement"},{"en":"people","ipa":"/ˈpiːpl/","cn":"n. 人们（复数）","source":"supplement"},{"en":"poor","ipa":"/pɔː/","cn":"adj. 可怜的；贫穷的","source":"supplement"}],"patterns":[{"en":"Has Ian sold his house yet?","cn":"伊恩把房子卖了吗？","source":"textbook","pdfPage":189,"printedPage":185,"verification":"verified","translationSource":"supplement"},{"en":"He's still here.","cn":"他还在这儿。","source":"textbook","pdfPage":189,"printedPage":185,"verification":"verified","translationSource":"supplement"},{"en":"We'll all miss him.","cn":"我们都会想念他的。","source":"textbook","pdfPage":189,"printedPage":185,"verification":"verified","translationSource":"supplement"}],"grammar":"现在完成时疑问句：Has he ... yet?；will 可表示将来：I’ll miss him.；本课 He’s still here 中 still 放在 be 动词后。","tip":"miss 常表示想念朋友或错过火车（I missed the bus.）。本课 people 表示“人们”，已经按复数使用，不再加 s；不是说 peoples 在所有语境中都错误。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":189,"printedPage":185,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}],"teachingSource":"supplement","text":[{"en":"Has Ian sold his house yet?","cn":"伊恩把他的房子卖掉了吗？","speaker":"CATHERINE","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Yes, he has. He sold it last week.","cn":"是的，卖掉了。他是上星期卖掉的。","speaker":"JENNY","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Has he moved to his new house yet?","cn":"他已经搬进新居了吗？","speaker":"CATHERINE","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"No, not yet. He's still here. He's going to move tomorrow.","cn":"不，还没有。他仍在这里，他打算明天搬家。","speaker":"JENNY","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"When? Tomorrow morning?","cn":"什么时候？明天上午吗？","speaker":"CATHERINE","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"No. Tomorrow afternoon. I'll miss him. He has always been a good neighbour.","cn":"不，是明天下午。我会想念他的，他一直是个好邻居。","speaker":"JENNY","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"He's a very nice person. We'll all miss him.","cn":"他是个非常好的人，我们都会想念他的。","speaker":"LINDA","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"When will the new people move into this house?","cn":"新住户什么时候搬进这所房子？","speaker":"CATHERINE","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"I think that they'll move in the day after tomorrow.","cn":"我想他们将会在后天搬进来吧。","speaker":"JENNY","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Will you see Ian today, Jenny?","cn":"詹妮，你今天会见到伊恩吗？","speaker":"LINDA","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Yes, I will.","cn":"会的。","speaker":"JENNY","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Please give him my regards.","cn":"请代我问候他。","speaker":"LINDA","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"Poor Ian! He didn't want to leave this house.","cn":"可怜的伊恩！他本不想离开这幢房子。","speaker":"CATHERINE","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"},{"en":"No, he didn't want to leave, but his wife did!","cn":"是啊，他不想离开，可是他妻子要离开！","speaker":"JENNY","source":"textbook","pdfPage":189,"printedPage":185,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"verified","translationSource":"supplement"}],"teach":{"title":"Has he…yet? 与 will","chat":"现在完成时的一般疑问句把 Have/Has 提前：Has he sold his house yet?（他卖掉房子了吗？）；yet 在这里表示“已经”，并不是每个疑问句都必须加 yet。will 表示将来：I’ll miss him.（我会想念他）。本课 He’s still here 中 still 放在 be 动词后。","formula":"Has + 主语 + 过去分词 + yet? ｜ 主语 + will + 动词原形","examples":[{"en":"Has Ian sold his house yet?","cn":"伊恩把房子卖了吗？","source":"supplement"},{"en":"He's going to move tomorrow.","cn":"他打算明天搬家。","source":"supplement"},{"en":"We'll all miss him.","cn":"我们都会想念他的。","source":"supplement"}],"watch":"miss 有两个意思：想念朋友／错过公交车（I missed the bus!）","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":189,"printedPage":185,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},"ex":{"g":[{"q":"Has Ian ___ his house yet?","opts":["sold","sell","sells","selling"],"a":"sold","why":"完成时用过去分词 sold。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":189,"printedPage":185,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""},{"q":"We'll all ___ him.","opts":["miss","misses","missing","missed"],"a":"miss","why":"will 后面跟动词原形。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":189,"printedPage":185,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"},"hint":""}],"c":[{"q":"伊恩打算什么时候搬家？","opts":["明天下午","明天上午","后天","下周"],"a":"明天下午","hint":"No. Tomorrow afternoon.","why":"还没搬，仍在老房子里。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":189,"printedPage":185,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}},{"q":"谁想离开这幢房子？","opts":["伊恩的妻子","伊恩","詹妮","新住户"],"a":"伊恩的妻子","hint":"he didn't want to leave, but his wife did!","why":"课文的反转结尾！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":189,"printedPage":185,"status":"verified","verified":true,"scope":"lesson-heading, printed-page, English-body, speaker, Chinese-meaning","note":"本轮逐行对照原页；不含下一页词表和偶数课练习。"}}]}},{"id":92,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":91},{"id":93,"title":"Our new neighbour","titleCn":"我们的新邻居","kind":"text","words":[{"en":"pilot","ipa":"/ˈpaɪlət/","cn":"n. 飞行员","source":"supplement"},{"en":"return","ipa":"/rɪˈtɜːn/","cn":"v. 返回","source":"supplement"},{"en":"New York","ipa":"/njuː jɔːk/","cn":"n. 纽约","source":"supplement"},{"en":"Tokyo","ipa":"/ˈtəʊkiəʊ/","cn":"n. 东京","source":"supplement"},{"en":"Madrid","ipa":"/məˈdrɪd/","cn":"n. 马德里","source":"supplement"},{"en":"next door","ipa":"/nekst dɔː/","cn":"phr. 隔壁","source":"supplement"},{"en":"month","ipa":"/mʌnθ/","cn":"n. 月","source":"supplement"},{"en":"will","ipa":"/wɪl/","cn":"aux. 将要","source":"supplement"}],"patterns":[{"en":"Nigel is our new next-door neighbour.","cn":"奈杰尔是我们新搬来的隔壁邻居。","source":"adaptation"},{"en":"He will fly to New York next month.","cn":"他下个月要飞往纽约。","source":"adaptation"},{"en":"He'll return to London the week after next.","cn":"他下下个星期返回伦敦。","source":"adaptation"}],"grammar":"will + 动词原形表示将来，缩写 he'll；时间轴：last week 上周 → next week 下周 → the week after next 下下周。","tip":"乘飞机去某地说 fly to...，非常形象；return to... 返回某地。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":193,"printedPage":189,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Nigel is our new next-door neighbour.","cn":"奈杰尔是我们新搬来的隔壁邻居。","source":"adaptation","pdfPage":193,"printedPage":189,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He's a pilot.","cn":"他是个飞行员。","source":"adaptation","pdfPage":193,"printedPage":189,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He was in the R.A.F.","cn":"他曾在皇家空军任职。","source":"adaptation","pdfPage":193,"printedPage":189,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He will fly to New York next month.","cn":"下个月他将飞往纽约。","source":"adaptation","pdfPage":193,"printedPage":189,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The month after next he'll fly to Tokyo.","cn":"再下个月他将飞往东京。","source":"adaptation","pdfPage":193,"printedPage":189,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"At the moment, he's in Madrid. He flew to Spain a week ago.","cn":"现在他在马德里。他是一个星期以前飞往西班牙的。","source":"adaptation","pdfPage":193,"printedPage":189,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He'll return to London the week after next.","cn":"再下个星期他将返回伦敦。","source":"adaptation","pdfPage":193,"printedPage":189,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He's only forty-one years old, and he has already been to nearly every country in the world.","cn":"他只有41岁，但他几乎已经去过世界上所有的国家。","source":"adaptation","pdfPage":193,"printedPage":189,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Nigel is a very lucky man. But his wife isn't very lucky. She usually stays at home!","cn":"奈杰尔是个很幸运的人，但他的妻子运气不很好，她通常呆在家里！","source":"adaptation","pdfPage":193,"printedPage":189,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"will：将来的车票","chat":"will + 动词原形 = 将来做某事：He will fly to New York. 缩写成 he'll。时间轴背下来：last week 上周 → next month 下个月 → the week after next 下下周。","formula":"主语 + will + 动词原形（将要……）","examples":[{"en":"He will fly to New York next month.","cn":"他下个月将飞往纽约。","sourc ,"verification":"candidate","translationSource":"supplement"}],"teach":{"title":"had better：最好做……","chat":"had better + 动词原形 = 「最好做……」，谁用都不变形：We had better go.（我们最好走）。问将来的时间点：What time will…?","formula":"had better + 动词原形 = 最好…… ｜ What time will…?","examples":[{"en":"What time will the next train leave?","cn":"下一班火车几点开？","source":"supplement"},{"en":"We had better go back to the station now.","cn":"我们现在最好回车站去。","source":"supplement"},{"en":"We've got plenty of time.","cn":"我们的时间还很充裕。","source":"supplement"}],"watch":"had better 缩写成 'd better：We'd better hurry!（我们最好快点！）","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":197,"printedPage":193,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"Two ___ tickets to London, please.","opts":["return","returns","returning","returned"],"a":"return","why":"return ticket 来回票。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":197,"printedPage":193,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"We had ___ go back to the station now.","opts":["better","best","good","well"],"a":"better","why":"had better + 动词原形。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":197,"printedPage":193,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"下一班火车几点开？","opts":["8点19分","8点整","8点半","9点整"],"a":"8点19分","hint":"At nineteen minutes past eight.","why":"8:19。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":197,"printedPage":193,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"在哪个站台？","opts":["2号站台","1号站台","3号站台","10号站台"],"a":"2号站台","hint":"Platform Two. Over the bri . 帮助","source":"supplement"},{"en":"sure","ipa":"/ʃʊə/","cn":"adj. 确信的","source":"supplement"},{"en":"X-ray","ipa":"/ˈeks reɪ/","cn":"n. X 光透视","source":"supplement"}],"patterns":[{"en":"I slipped and fell downstairs.","cn":"我滑了一跤，从楼梯上摔了下来。","source":"adaptation"},{"en":"Have you hurt yourself?","cn":"你摔伤了没有？","source":"adaptation"},{"en":"I'm sure that you need an X-ray.","cn":"我看你需要拍一张X光片。","source":"adaptation"}],"grammar":"hurt yourself 用反身代词作宾语；have hurt 是 hurt 的现在完成时（hurt 三态同形：hurt-hurt-hurt）。","tip":"滑倒三步曲：slip（滑）→ fall（摔）→ hurt（受伤）；I'm sure (that) + 从句表示“我确信……”。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":205,"printedPage":201,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Ow!","cn":"啊哟！","source":"adaptation","pdfPage":205,"printedPage":201,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What's the matter, Andy?","cn":"怎么了，安迪？","source":"adaptation","pdfPage":205,"printedPage":201,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I slipped and fell downstairs.","cn":"我滑了一跤，从楼梯上摔了下来。","source":"adaptation","pdfPage":205,"printedPage":201,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Have you hurt yourself?","cn":"你摔伤了没有？","source":"adaptation","pdfPage":205,"printedPage":201,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I have. I think that I've hurt my back.","cn":"是啊，摔伤了。我想我把背摔坏了。","source":"adaptation","pdfPage":205,"printedPage":201,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Try and stand up. Can you stand up? Here. Let me help you.","cn":"试着站起来。你能站起来吗？来，我帮你。","source":"adaptation","pdfPage":205,"prin p":"say 强调“说”的内容，后面不直接跟人；tell 后面必须跟人：He says... ／ He tells me...","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":209,"printedPage":205,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Read Jimmy's card to me please, Mary.","cn":"请把吉米的明信片念给我听，玛丽。","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“I have just arrived in Scotland and I'm staying at a Youth Hostel.”","cn":"“我刚到苏格兰，现在住在一家青年招待所。”","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Eh?","cn":"你说什么？","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He says he's just arrived in Scotland. He says he's staying at a Youth Hostel.","cn":"他说他刚到苏格兰，他说他现在住在一家青年招待所。","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"You know he's a member of the Y.H.A.","cn":"你知道他是“青年招待所协会”的成员。","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The what?","cn":"什么协会？","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The Y.H.A., mother. The Youth Hostels Association.","cn":"“青招协”，妈妈，青年招待所协会。","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What else does he say?","cn":"他还说了些什么？","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"“I'll write a letter soon. I hope you are all well.”","cn":"“我很快会写信。祝大家身体都好。”","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Is that all? He doesn't say very much, does he?","cn":"就这些吗？他没有写许多，是吗？","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"He can't write very much on a card, mother.","cn":"在明信片上他写不了很多，妈妈。","source":"adaptation","pdfPage":209,"printedPage":205,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"says that：转述刚说的话","chat":"把别人说的话转告给别人，用 He says (that) + 原话。小 that 可以省略，引号也不需要了，时态跟原话保持一致。","formula":"He says (that) + 他说的内容","examples":[{"en":"He says he's just arrived in Scotland.","cn":"他说他刚到苏格兰。","source":"supplement"},{"en":"He says he's staying at a Youth Hostel.","cn":"他说他住在青年招待所。","source":"supplement"},{"en":"He says he'll write a letter soon.","cn":"他说他很快会写信来。","source":"supplement"}],"watch":"say 后面不接人；要接人说 tell：He tells me…（他告诉我……）！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":209,"printedPage":205,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"He says he ___ just arrived in Scotland.","opts":["has","have","is","was"],"a":"has","why":"has arrived 现在完成时。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":209,"printedPage":205,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"He will write a letter ___.","opts":["soon","now","yet","yesterday"],"a":"soon","why":"soon 不久。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":209,"printedPage":205,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"吉米住在哪儿？","opts":["青年招待所","旅馆","朋友家","家里"],"a":"青年招待所","hint":"He says he's staying at a Youth Hostel.","why":"他是青招协成员。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":209,"printedPage":205,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"奶奶请玛丽做什么？","opts":["把明信片念给她听","写一张明信片","买份报纸","给吉米打电话"],"a":"把明信片念给她听","hint":"Read Jimmy's card to me please.","why":"奶奶想了解吉米的近况。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":209,"printedPage":205,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":102,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":101},{"id":103,"title":"The French test","titleCn":"法语考试","kind":"text","words":[{"en":"exam","ipa":"/ɪɡˈzæm/","cn":"n. 考试","source":"supplement"},{"en":"pass","ipa":"/pɑːs/","cn":"v. 及格，通过","source":"supplement"},{"en":"mark","ipa":"/mɑːk/","cn":"n. 分数","source":"supplement"},{"en":"paper","ipa":"/ˈpeɪpə/","cn":"n. 试卷；纸","source":"supplement"},{"en":"easy","ipa":"/ˈiːzi/","cn":"adj. 容易的","source":"supplement"},{"en":"enough","ipa":"/ɪˈnʌf/","cn":"adv. 足够地；adj. 足够的","source":"supplement"},{"en":"question","ipa":"/ˈkwestʃən/","cn":"n. 问题","source":"supplement"},{"en":"maths","ipa":"/mæθs/","cn":"n. 数学","source":"supplement"},{"en":"hate","ipa":"/heɪt/","cn":"v. 讨厌","source":"supplement"}],"patterns":[{"en":"How was the exam, Richard?","cn":"考试考得怎样，理查德？","source":"adaptation"},{"en":"I think I passed.","cn":"我想我及格了。","source":"adaptation"},{"en":"The English paper wasn't easy enough for me.","cn":"英语试卷对我来说不够容易。","source":"adaptation"}],"grammar":"too + 形容词（太……而不适合）；形容词 + enough（足够……），enough 要放在形容词后面；think (that) + 从句。","tip":"too hard = 难得过火（做不了），hard enough = 足够难——位置相反：too 在前，enough 在后。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":213,"printedPage":209,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"How was the exam, Richard?","cn":"考试考得怎样，理查德？","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Not too bad.","cn":"还不错。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I think I passed in English and Mathematics.","cn":"我想我的英语和数学及格了。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The questions were very easy.","cn":"题目很容易。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"How about you, Gary?","cn":"加里，你怎么样？","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The English and Maths papers weren't easy enough for me.","cn":"英语和数学试题对我来说不很容易。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I hope I haven't failed.","cn":"我希望自己没有不及格。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I think I failed the French paper.","cn":"我想我的法语没及格。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I could answer sixteen of the questions.","cn":"我能回答其中的16道题。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"They were very easy.","cn":"这些题很容易。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"But I couldn't answer the rest.","cn":"但我回答不出其余的题。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"They were too difficult for me.","cn":"那些题对我来说太难了。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Oh, cheer up! Perhaps we didn't do too badly.","cn":"哦，振作一点！也许我们不会考得太糟。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"The man next to me wrote his name at the top of the paper.","cn":"坐在我旁边的那个人只在试卷顶端写自己的名字。","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"And then he sat there and looked at it for three hours!","cn":"然后他就坐在那里盯着它看了三个小时！","source":"adaptation","pdfPage":213,"printedPage":209,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"too 与 enough：一前一后","chat":"too 和 enough 都管「程度」，位置正好相反：too + 形容词（太……而做不到），形容词 + enough（足够……）。「我认为……」用 I think (that)…","formula":"too + 形容词（太……）｜ 形容词 + enough（足够……）","examples":[{"en":"The paper wasn't easy enough for me.","cn":"试卷对我来说不够容易。","source":"supplement"},{"en":"They were too difficult for me.","cn":"它们对我来说太难了。","source":"supplement"},{"en":"I think I passed.","cn":"我想我及格了。","source":"supplement"}],"watch":"enough 永远跟在形容词后面：easy enough ✓ enough easy ❌！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":213,"printedPage":209,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"I think I ___ in English and Mathematics.","opts":["passed","pass","passing","passs"],"a":"passed","why":"过去时 passed。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":213,"printedPage":209,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"The questions were not difficult ___ for me.","opts":["enough","too","very","much"],"a":"enough","why":"形容词 + enough，enough 后置。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":213,"printedPage":209,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"有一门考试有人觉得自己没及格，是哪一门？","opts":["法语","英语","数学","音乐"],"a":"法语","hint":"I think I failed the French paper.","why":"法语试卷太难了。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":213,"printedPage":209,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"坐在旁边的人三个小时做了什么？","opts":["盯着试卷上的名字看","睡觉","奋笔疾书","哭"],"a":"盯着试卷上的名字看","hint":"he sat there and looked at it for three hours!","why":"课文的幽默结尾！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":213,"printedPage":209,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":104,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":103},{"id":105,"title":"Full of mistakes","titleCn":"错误百出","kind":"text","words":[{"en":"spell","ipa":"/spel/","cn":"v. 拼写（spelt）","source":"supplement"},{"en":"intelligently","ipa":"/ɪnˈtelɪdʒəntli/","cn":"adv. 聪明地","source":"supplement"},{"en":"mistake","ipa":"/mɪˈsteɪk/","cn":"n. 错误","source":"supplement"},{"en":"correct","ipa":"/kəˈrekt/","cn":"v. 改正；adj. 正确的","source":"supplement"},{"en":"present","ipa":"/ˈpreznt/","cn":"n. 礼物","source":"supplement"},{"en":"dictionary","ipa":"/ˈdɪkʃənri/","cn":"n. 词典","source":"supplement"}],"patterns":[{"en":"I want her to type this letter again.","cn":"我要她把这封信再打一遍。","source":"adaptation"},{"en":"You've made seventeen mistakes.","drill":true,"cn":"你有十七处错误。","source":"supplement"},{"en":"Here's a present for you.","cn":"这是送给你的礼物。","source":"adaptation"}],"grammar":"want sb to do sth 要某人做某事；make a mistake 犯错误（复数 make mistakes）。","tip":"记住结构：I want you to spell it. —— to 后面的动作才是让对方做的。","source":"adaptation","sourceRefs":[{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":217,"printedPage":213,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}],"teachingSource":"supplement","text":[{"en":"Where's Sandra, Bob? I want her.","cn":"鲍勃，桑德拉在哪儿？我要她。","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Do you want to see her?","cn":"您要见她吗？","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I do. I want her to come to my office. Tell her to come at once.","cn":"是的。我要她到我的办公室来，叫她马上就来。","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Did you want to see me, sir?","cn":"您找我，先生？","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Ah, yes, Sandra. How do you spell “intelligent”? Can you tell me?","cn":"啊，是的，桑德拉。intelligent 这个词怎样拼写？你能告诉我吗？","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I-N-T-E-L-L-I-G-E-N-T.","cn":"I-N-T-E-L-L-I-G-E-N-T。","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"That's right. You've typed it with only one “L”. This letter's full of mistakes. I want you to type it again.","cn":"对了。可你只打了1个L。这封信里错误百出，我要你重打一遍。","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, I'll do that. I'm sorry about that.","cn":"是，我重打。对此我感到很抱歉。","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"And here's a little present for you.","cn":"这里有一件小礼物送你。","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What is it?","cn":"是什么？","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"It's a dictionary. I hope it'll help you.","cn":"是本词典。我希望它能对你有所帮助。","source":"adaptation","pdfPage":217,"printedPage":213,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"}],"teach":{"title":"want sb to do sth","chat":"要「某人去做某事」，公式是 want + 人 + to + 动词原形：I want her to come to my office.（我要她来我办公室）。「犯错误」固定说 make a mistake。","formula":"want + 人 + to + 动词原形（要某人做……）","examples":[{"en":"I want her to type this letter again.","cn":"我要她把这封信再打一遍。","source":"supplement"},{"en":"Tell her to come at once.","cn":"叫她马上来。","source":"supplement"},{"en":"You've made seventeen mistakes.","cn":"你犯了17处错误。","source":"supplement"}],"watch":"to 后面的动作是「对方」做的：I want you to spell it. 是要「你」来拼，不是我拼！","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":217,"printedPage":213,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},"ex":{"g":[{"q":"I want her ___ this letter again.","opts":["to type","type","typing","typed"],"a":"to type","why":"want sb to do sth。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":217,"printedPage":213,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""},{"q":"How do you ___ intelligent?","opts":["spell","spell to","spelling","spelt to"],"a":"spell","why":"问拼写用 spell。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":217,"printedPage":213,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"},"hint":""}],"c":[{"q":"老板送了桑德拉什么礼物？","opts":["一本词典","一个书架","一件貂皮大衣","一支钢笔"],"a":"一本词典","hint":"It's a dictionary. I hope it'll help you.","why":"帮她少犯拼写错误。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":217,"printedPage":213,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}},{"q":"信里有多少处错误？","opts":["17处","7处","70处","16处"],"a":"17处","hint":"You've made seventeen mistakes.","why":"所以要从头再打一遍。","source":"supplement","basedOn":{"source":"textbook","file":"电子资料/新概念英语第一册学生用书.pdf","pdfPage":217,"printedPage":213,"status":"candidate","verified":false,"scope":"page-offset-only","note":"按preflight页偏移生成，未逐课回看正文；不能视为全文审核通过。"}}]}},{"id":106,"title":"Exercises","titleCn":"配套练习","kind":"drill","refId":105},{"id":107,"title":"It's too small.","titleCn":"太小了。","kind":"text","words":[{"en":"madam","ipa":"/ˈmædəm/","cn":"n. 夫人，女士（尊 offee, Jane?","cn":"我来煮点咖啡好吗，简？","source":"adaptation","pdfPage":225,"printedPage":221,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"That's a good idea, Charlotte.","cn":"这是个好主意，夏洛特。","source":"adaptation","pdfPage":225,"printedPage":221,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"It's ready. Do you want any milk?","cn":"咖啡好了。你要放点牛奶吗？","source":"adaptation","pdfPage":225,"printedPage":221,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Just a little, please.","cn":"请放一点吧。","source":"adaptation","pdfPage":225,"printedPage":221,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"What about some sugar? Two teaspoonfuls?","cn":"加些糖怎么样？两茶匙糖？","source":"adaptation","pdfPage":225,"printedPage":221,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"No, less than that. One and a half teaspoonfuls, please. That's enough for me.","cn":"不，再少一些。请放一勺半。对我来说已足够了。","source":"adaptation","pdfPage":225,"printedPage":221,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Would you like some more?","cn":"你再来点吗？","source":"adaptation","pdfPage":225,"printedPage":221,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Yes, please. I'd like a cigarette, too. May I have one?","cn":"好的，请再来点。我还想抽支烟，可以给我一支吗？","source":"adaptation","pdfPage":225,"printedPage":221,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"Of course. I think there are a few in that box.","cn":"当然可以。我想那个盒子里还有一些。","source":"adaptation","pdfPage":225,"printedPage":221,"sourceFile":"电子资料/新概念英语第一册学生用书.pdf","verification":"candidate","translationSource":"supplement"},{"en":"I'm afraid it's
